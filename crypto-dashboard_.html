  // =====================================================================
  // EMIR DEFTERI (ORDER BOOK) PANELI
  // =====================================================================
  function createOrderBookPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let targetId = null;
    let generation = 0;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Emir Defteri`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);

    const obBody = document.createElement("div");
    obBody.className = "ob-body";
    obBody.innerHTML = `
      <div class="ob-header-row"><span>Fiyat</span><span>Miktar</span></div>
      <div class="ob-asks"></div>
      <div class="ob-spread">—</div>
      <div class="ob-bids"></div>
    `;
    body.appendChild(obBody);
    const asksEl = obBody.querySelector(".ob-asks");
    const bidsEl = obBody.querySelector(".ob-bids");
    const spreadEl = obBody.querySelector(".ob-spread");

    function priceDecimals(p) {
      if (p >= 100) return 2;
      if (p >= 1) return 4;
      return 6;
    }

    function renderSide(container, levels, side) {
      const qtys = levels.map((l) => parseFloat(l[1]));
      const maxQty = Math.max(...qtys, 0.0001);
      container.innerHTML = "";
      levels.forEach(([price, qty]) => {
        const p = parseFloat(price);
        const q = parseFloat(qty);
        const pct = Math.min(100, (q / maxQty) * 100);
        const row = document.createElement("div");
        row.className = `ob-row ${side}`;
        row.innerHTML = `
          <div class="ob-bar" style="width:${pct}%"></div>
          <span class="ob-price ${side}">${p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: priceDecimals(p) })}</span>
          <span class="ob-qty">${q.toLocaleString("en-US", { maximumFractionDigits: 4 })}</span>
        `;
        container.appendChild(row);
      });
    }

    // Binance'in depth10 yayinindaki alan adlari; esnek kontrol istendigi
    // icin hem futures kisa alan adlari (b/a) hem olasi alternatif isimler
    // (bids/asks) destekleniyor.
    function handleDepthMessage(data) {
      const rawBids = data.b || data.bids;
      const rawAsks = data.a || data.asks;
      if (!rawBids || !rawAsks) return;

      const bids = rawBids.filter(([, q]) => parseFloat(q) > 0);
      const asks = rawAsks.filter(([, q]) => parseFloat(q) > 0);
      if (!bids.length || !asks.length) return;

      // Ikisi de yuksekten dusuge siralaniyor: boylece en iyi (en dusuk)
      // ask listenin EN ALTINDA, en iyi (en yuksek) bid listenin EN
      // USTUNDE gorunuyor - spread ortada kaliyor.
      const asksSorted = [...asks].sort((a, b) => parseFloat(b[0]) - parseFloat(a[0]));
      const bidsSorted = [...bids].sort((a, b) => parseFloat(b[0]) - parseFloat(a[0]));

      renderSide(asksEl, asksSorted, "ask");
      renderSide(bidsEl, bidsSorted, "bid");

      const bestAsk = parseFloat(asksSorted[asksSorted.length - 1][0]);
      const bestBid = parseFloat(bidsSorted[0][0]);
      const spread = bestAsk - bestBid;
      const spreadPct = bestBid ? (spread / bestBid) * 100 : 0;
      spreadEl.textContent = `Spread: ${spread.toLocaleString("en-US", { maximumFractionDigits: 4 })} (${spreadPct.toFixed(3)}%)`;
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      ws = new WebSocket(`wss://fstream.binance.com/public/ws/${mySymbol.toLowerCase()}@depth10@100ms`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        let data;
        try { data = JSON.parse(event.data); } catch { return; }
        handleDepthMessage(data);
      };
      ws.onclose = () => {
        clearHeartbeat();
        if (!stopped && myGen === generation) scheduleReconnect(myGen);
      };
      ws.onerror = () => ws.close();
    }

    function resetHeartbeat() {
      clearHeartbeat();
      heartbeatTimer = setTimeout(() => ws && ws.close(), 60000);
    }
    function clearHeartbeat() {
      if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; }
    }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;

      symbol = newSymbol;
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;

      asksEl.innerHTML = "";
      bidsEl.innerHTML = "";
      spreadEl.textContent = "—";
      titleEl.textContent = `${symbol} · Emir Defteri`;

      panelsMeta[id].symbol = symbol;
      saveLayout();

      connectWs();
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, changeSymbol);
    }

    subscribeToTarget(initialTargetId);
    connectWs();

    panelInstances[id] = {
      destroy() {
        stopped = true;
        clearHeartbeat();
        if (ws) ws.close();
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
      },
    };

    return item;
  }

  // =====================================================================
  // LIKIDITE ISI HARITASI (HEATMAP) PANELI
  // =====================================================================
  function createHeatmapPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let targetId = null;
    let generation = 0;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Likidite Haritası`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);
    body.style.overflow = "hidden";

    const wrap = document.createElement("div");
    wrap.className = "heatmap-container";
    const canvas = document.createElement("canvas");
    canvas.className = "heatmap-canvas";
    wrap.appendChild(canvas);
    body.appendChild(wrap);
    const ctx = canvas.getContext("2d");

    const ROWS = 60;              // Y ekseni (fiyat) cozunurlugu
    const MAX_COLUMNS = 90;       // X ekseni (zaman) - gorunen gecmis kolon sayisi
    const SAMPLE_INTERVAL_MS = 1000; // her ~1 saniyede bir yeni kolon
    const PRICE_RANGE_PCT = 0.004;   // orta fiyatin +-%0.4'u araligi goster

    let history = [];      // {rowMin, rowHeight, values: Float64Array(ROWS), mid}
    let latestDepth = null;
    let sampleTimer = null;

    function resizeCanvas() {
      const rect = wrap.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width));
      canvas.height = Math.max(1, Math.floor(rect.height));
      draw();
    }
    const resizeObserver = new ResizeObserver(resizeCanvas);
    resizeObserver.observe(wrap);

    // Koyu mavi/siyah (dusuk hacim) -> mor -> kirmizi -> parlak sari (yuksek hacim)
    function heatColor(t) {
      const stops = [
        [0.0, [8, 10, 18]],
        [0.22, [24, 48, 105]],
        [0.48, [96, 40, 130]],
        [0.72, [210, 55, 55]],
        [1.0, [255, 221, 74]],
      ];
      let a = stops[0], b = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (t >= stops[i][0] && t <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
      }
      const span = b[0] - a[0] || 1;
      const lt = (t - a[0]) / span;
      const r = Math.round(a[1][0] + (b[1][0] - a[1][0]) * lt);
      const g = Math.round(a[1][1] + (b[1][1] - a[1][1]) * lt);
      const bch = Math.round(a[1][2] + (b[1][2] - a[1][2]) * lt);
      return `rgb(${r},${g},${bch})`;
    }

    function commitSample() {
      if (!latestDepth) return;
      const rawBids = latestDepth.b || latestDepth.bids;
      const rawAsks = latestDepth.a || latestDepth.asks;
      if (!rawBids || !rawAsks || !rawBids.length || !rawAsks.length) return;

      const bestBid = Math.max(...rawBids.map((l) => parseFloat(l[0])));
      const bestAsk = Math.min(...rawAsks.map((l) => parseFloat(l[0])));
      const mid = (bestBid + bestAsk) / 2;
      const rowMin = mid * (1 - PRICE_RANGE_PCT);
      const rowMax = mid * (1 + PRICE_RANGE_PCT);
      const rowHeight = (rowMax - rowMin) / ROWS;
      const values = new Float64Array(ROWS);

      [...rawBids, ...rawAsks].forEach(([price, qty]) => {
        const p = parseFloat(price);
        const q = parseFloat(qty);
        if (q <= 0) return;
        const rowIndex = Math.floor((p - rowMin) / rowHeight);
        if (rowIndex >= 0 && rowIndex < ROWS) values[rowIndex] += q;
      });

      history.push({ rowMin, rowHeight, values, mid });
      if (history.length > MAX_COLUMNS) history.shift();
      draw();
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#0a0e14";
      ctx.fillRect(0, 0, w, h);
      if (!history.length) return;

      let maxQty = 0.0001;
      history.forEach((col) => col.values.forEach((v) => { if (v > maxQty) maxQty = v; }));

      const colWidth = w / MAX_COLUMNS;
      const rowH = h / ROWS;
      const startIdx = MAX_COLUMNS - history.length;

      history.forEach((col, i) => {
        const x = (startIdx + i) * colWidth;
        for (let r = 0; r < ROWS; r++) {
          const v = col.values[r];
          if (v <= 0) continue;
          const t = Math.min(1, Math.log(1 + v) / Math.log(1 + maxQty));
          ctx.fillStyle = heatColor(t);
          const y = h - (r + 1) * rowH; // dusuk fiyat alta, yuksek fiyat usta
          ctx.fillRect(x, y, Math.ceil(colWidth) + 1, Math.ceil(rowH) + 1);
        }
      });

      const last = history[history.length - 1];
      ctx.fillStyle = "rgba(230,234,242,0.85)";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText(last.mid.toLocaleString("en-US", { maximumFractionDigits: 2 }), w - 4, 12);
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      ws = new WebSocket(`wss://fstream.binance.com/public/ws/${mySymbol.toLowerCase()}@depth10@100ms`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        try { latestDepth = JSON.parse(event.data); } catch { /* yoksay */ }
      };
      ws.onclose = () => { clearHeartbeat(); if (!stopped && myGen === generation) scheduleReconnect(myGen); };
      ws.onerror = () => ws.close();
    }
    function resetHeartbeat() { clearHeartbeat(); heartbeatTimer = setTimeout(() => ws && ws.close(), 60000); }
    function clearHeartbeat() { if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; } }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;
      history = [];
      latestDepth = null;
      titleEl.textContent = `${symbol} · Likidite Haritası`;
      panelsMeta[id].symbol = symbol;
      saveLayout();
      connectWs();
      draw();
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, changeSymbol);
    }

    subscribeToTarget(initialTargetId);
    connectWs();
    sampleTimer = setInterval(commitSample, SAMPLE_INTERVAL_MS);
    requestAnimationFrame(resizeCanvas);

    panelInstances[id] = {
      destroy() {
        stopped = true;
        clearHeartbeat();
        if (ws) ws.close();
        if (sampleTimer) clearInterval(sampleTimer);
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
        resizeObserver.disconnect();
      },
    };

    return item;
  }

  // =====================================================================
  // BOT KONTROL PANELI (Paper Trading simulasyonu)
  //
  // NOT: Bu tamamen istemci tarafinda calisan bir SIMULASYONDUR. Gercek
  // emir gonderilmez, gercek para kullanilmaz. Kapanan 1 dakikalik mumlar
  // uzerinden basit RSI/SMA/trailing-stop kurallariyla ornek al/sat
  // sinyalleri uretir ve varsayimsal PnL hesaplar - egitim/gosterim
  // amaclidir, yatirim tavsiyesi degildir.
  // =====================================================================
  function createBotPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let targetId = null;
    let generation = 0;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Bot`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);

    const botBody = document.createElement("div");
    botBody.className = "bot-body";
    botBody.innerHTML = `
      <select class="bot-select">
        <option value="rsi">RSI &lt; 30 ise Al (RSI &gt; 60 Sat)</option>
        <option value="trailing">20 Mum Zirvesi Kırılımı + Trailing Stop %1</option>
        <option value="sma">SMA(9) / SMA(21) Kesişimi</option>
      </select>
      <div class="bot-controls">
        <button class="bot-toggle-btn start">BAŞLAT</button>
        <div class="bot-status"><span class="bot-status-dot"></span><span class="bot-status-text">Beklemede</span></div>
      </div>
      <div class="bot-pnl">+0.00%</div>
      <table class="bot-trades-table">
        <thead><tr><th>Zaman</th><th>Giriş</th><th>Çıkış</th><th>PnL</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="bot-disclaimer">Simülasyon (Paper Trading) — gerçek emir gönderilmez, yatırım tavsiyesi değildir.</div>
    `;
    body.appendChild(botBody);

    const selectEl = botBody.querySelector(".bot-select");
    const toggleBtn = botBody.querySelector(".bot-toggle-btn");
    const statusDot = botBody.querySelector(".bot-status-dot");
    const statusText = botBody.querySelector(".bot-status-text");
    const pnlEl = botBody.querySelector(".bot-pnl");
    const tradesBody = botBody.querySelector(".bot-trades-table tbody");

    let strategy = "rsi";
    let running = false;
    let closes = [];   // kapanan 1dk mumlarin close fiyatlari
    let equity = 100;  // bilesik simule edilmis oz sermaye (baslangic = 100)
    let trades = [];   // {time, entry, exit, pnlPct}
    let position = null; // {entryPrice, peak}

    function fmtPct(v) { return `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`; }

    function renderStatus() {
      statusDot.className = "bot-status-dot" + (running ? " running" : "");
      statusText.textContent = running ? "Çalışıyor" : "Beklemede";
      toggleBtn.textContent = running ? "DURDUR" : "BAŞLAT";
      toggleBtn.className = "bot-toggle-btn " + (running ? "stop" : "start");
    }

    function renderPnl() {
      const pct = equity - 100;
      pnlEl.textContent = fmtPct(pct);
      pnlEl.style.color = pct >= 0 ? "var(--up)" : "var(--down)";
    }

    function renderTrades() {
      tradesBody.innerHTML = "";
      trades.slice(0, 5).forEach((t) => {
        const tr = document.createElement("tr");
        const pnlColor = t.pnlPct >= 0 ? "var(--up)" : "var(--down)";
        tr.innerHTML = `
          <td>${t.time}</td>
          <td>${t.entry.toLocaleString("en-US", { maximumFractionDigits: 2 })}</td>
          <td>${t.exit.toLocaleString("en-US", { maximumFractionDigits: 2 })}</td>
          <td style="color:${pnlColor}">${fmtPct(t.pnlPct)}</td>`;
        tradesBody.appendChild(tr);
      });
    }

    function sma(period) {
      if (closes.length < period) return null;
      const slice = closes.slice(-period);
      return slice.reduce((a, b) => a + b, 0) / period;
    }

    function rsi(period = 14) {
      if (closes.length < period + 1) return null;
      const slice = closes.slice(-(period + 1));
      let gain = 0, loss = 0;
      for (let i = 1; i < slice.length; i++) {
        const diff = slice[i] - slice[i - 1];
        if (diff >= 0) gain += diff; else loss -= diff;
      }
      const avgGain = gain / period, avgLoss = loss / period;
      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return 100 - 100 / (1 + rs);
    }

    function closePosition(exitPrice) {
      const pnlPct = ((exitPrice - position.entryPrice) / position.entryPrice) * 100;
      equity = equity * (1 + pnlPct / 100);
      trades.unshift({
        time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
        entry: position.entryPrice,
        exit: exitPrice,
        pnlPct,
      });
      trades = trades.slice(0, 5);
      position = null;
      renderPnl();
      renderTrades();
    }

    function evaluateStrategy() {
      if (!running || closes.length < 2) return;
      const price = closes[closes.length - 1];

      if (strategy === "rsi") {
        const r = rsi(14);
        if (r === null) return;
        if (!position && r < 30) position = { entryPrice: price, peak: price };
        else if (position && r > 60) closePosition(price);
      } else if (strategy === "trailing") {
        const recent20 = closes.slice(-21, -1);
        const prevHigh = recent20.length ? Math.max(...recent20) : null;
        if (!position && prevHigh !== null && price > prevHigh) {
          position = { entryPrice: price, peak: price };
        } else if (position) {
          position.peak = Math.max(position.peak, price);
          if (price <= position.peak * 0.99) closePosition(price);
        }
      } else if (strategy === "sma") {
        const fast = sma(9), slow = sma(21);
        if (fast === null || slow === null) return;
        if (!position && fast > slow) position = { entryPrice: price, peak: price };
        else if (position && fast < slow) closePosition(price);
      }
    }

    selectEl.addEventListener("change", () => {
      strategy = selectEl.value;
      position = null; // strateji degisince acik pozisyon islenmeden sifirlanir
    });

    toggleBtn.addEventListener("click", () => {
      running = !running;
      renderStatus();
    });

    async function loadInitialCloses() {
      const mySymbol = symbol;
      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${mySymbol}&interval=1m&limit=100`);
        if (!res.ok) throw new Error("REST hatasi: " + res.status);
        const raw = await res.json();
        if (mySymbol !== symbol) return;
        closes = raw.map((d) => parseFloat(d[4]));
      } catch (e) {
        console.error("[Bot] Gecmis kapanislar alinamadi:", e);
      }
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      ws = new WebSocket(`wss://stream.binance.com:9443/ws/${mySymbol.toLowerCase()}@kline_1m`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const k = msg.k;
        if (!k || !k.x) return; // sadece KAPANAN mumlari indikatore ekle
        closes.push(parseFloat(k.c));
        if (closes.length > 200) closes.shift();
        evaluateStrategy();
      };
      ws.onclose = () => { clearHeartbeat(); if (!stopped && myGen === generation) scheduleReconnect(myGen); };
      ws.onerror = () => ws.close();
    }
    function resetHeartbeat() { clearHeartbeat(); heartbeatTimer = setTimeout(() => ws && ws.close(), 60000); }
    function clearHeartbeat() { if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; } }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;
      closes = [];
      position = null;
      titleEl.textContent = `${symbol} · Bot`;
      panelsMeta[id].symbol = symbol;
      saveLayout();

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function drawArrowHead(ctx, x1, y1, x2, y2) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const size = 9;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 7), y2 - size * Math.sin(angle - Math.PI / 7));
    ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 7), y2 - size * Math.sin(angle + Math.PI / 7));
    ctx.closePath();
    ctx.fill();
  }

  // =====================================================================
  // GELISMIS ALARM YONETIMI (Advanced Alert Manager)
  //
  // Alarmlar gecerli sembol icin fiyat/RSI/funding/OI kosullarini arka
  // planda (herhangi bir panel acik olmasa bile) izler; sayfa yenilense
  // dahi localStorage'dan geri yuklenip izlemeye devam eder. Tetiklenince
  // 3 kanaldan bildirim verir: sesli uyari, masaustu bildirimi, ekran
  // ici toast + Alarm Gecmisi tablosu.
  // =====================================================================
  const ALERTS_KEY = "crypto-dashboard-alerts-v1";
  let alertsStore = { alerts: [], history: [] };
  let audioCtx = null;

  async function loadAlertsStore() {
    const migrated = await loadWithMigration(ALERTS_KEY, (v) => v && Array.isArray(v.alerts));
    if (!migrated) return { alerts: [], history: [] };
    if (!Array.isArray(migrated.history)) migrated.history = [];
    return migrated;
  }
  function persistAlertsStore() {
    idbSet(ALERTS_KEY, alertsStore); // fire-and-forget
  }

  // --- Bildirim kanali 1: Sesli uyari (Web Audio API) ------------------
  function ensureAudioContext() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* desteklenmiyor */ }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function playAlertSound() {
    ensureAudioContext();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = now + i * 0.16;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.2);
    });
  }

  // --- Bildirim kanali 2: Masaustu bildirimi ----------------------------
  function requestDesktopPermission() {
    if (!("Notification" in window)) return;
    if (Notification.permission === "default") Notification.requestPermission();
  }
  function showDesktopNotification(title, body) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body }); } catch { /* bazi ortamlarda kisitli olabilir */ }
  }

  // --- Bildirim kanali 3: Ekran ici Toast --------------------------------

      <div class="toast-desc">${desc}</div>`;
    toast.querySelector(".toast-close").addEventListener("click", () => toast.remove());
    container.appendChild(toast);

  }

  function fireAlert(alert, desc) {
    playAlertSound();
    showDesktopNotification(alert.name, desc);
    showToast(alert.name, desc);

  // --- Piyasa Verisi Merkezi (marketDataHub) -----------------------------
  // Sadece etkin alarmlarin ihtiyac duydugu sembol/veri turleri icin,
  // istege bagli (lazy) baglanti acar; ayni sembolu izleyen birden fazla
  // alarm varsa tek bir baglanti paylasilir.
  const hub = {}; // symbol -> { price, closes[], rsi, fundingRate, oiHistory:[{t,v}], _conns:{} }

  function ensureHubEntry(symbol) {
    if (!hub[symbol]) hub[symbol] = { price: null, closes: [], rsi: null, fundingRate: null, oiHistory: [], _conns: {} };
    return hub[symbol];
  }

  function hubNeedsType(symbol, type) {
    return alertsStore.alerts.some((a) => a.enabled && a.symbol === symbol && a.conditions.some((c) => c.type === type));
  }

  function symbolsNeeded() {
    const set = new Set();
    alertsStore.alerts.forEach((a) => { if (a.enabled) set.add(a.symbol); });
    return set;
  }

  // Fiyat (spot bookTicker - miniTicker gibi hafif, surekli akan bir stream)
  function hubEnsurePriceConn(symbol) {
    const entry = ensureHubEntry(symbol);
    if (entry._conns.price) return;
    let stopped = false;
    let retryMs = 1000;
    function connect() {
      if (stopped) return;
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@miniTicker`);
      entry._conns.price = { ws, stopped: false };
      ws.onopen = () => { retryMs = 1000; };
      ws.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        entry.price = parseFloat(msg.c);
        evaluateAlertsForSymbol(symbol);
      };
      ws.onclose = () => { if (!stopped) setTimeout(connect, retryMs); retryMs = Math.min(retryMs * 2, 30000); };
      ws.onerror = () => ws.close();
    }
    connect();
    entry._conns.price = { stop: () => { stopped = true; } };
  }

  // RSI icin kapanan 1dk mumlari
  function hubEnsureRsiConn(symbol) {
    const entry = ensureHubEntry(symbol);
    if (entry._conns.rsi) return;
    let stopped = false;
    let retryMs = 1000;
    (async () => {
      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=100`);
        const raw = await res.json();
        entry.closes = raw.map((d) => parseFloat(d[4]));
        entry.rsi = computeRsi(entry.closes, 14);
      } catch (e) { console.error("[Alarm] Gecmis kapanislar alinamadi:", e); }
    })();
    function connect() {
      if (stopped) return;
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_1m`);
      ws.onopen = () => { retryMs = 1000; };
      ws.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const k = msg.k;
        if (!k || !k.x) return;
        entry.closes.push(parseFloat(k.c));
        if (entry.closes.length > 200) entry.closes.shift();
        entry.rsi = computeRsi(entry.closes, 14);
        evaluateAlertsForSymbol(symbol);
      };
      ws.onclose = () => { if (!stopped) setTimeout(connect, retryMs); retryMs = Math.min(retryMs * 2, 30000); };
      ws.onerror = () => ws.close();
    }
    connect();
    entry._conns.rsi = { stop: () => { stopped = true; } };
  }

  // Funding rate (futures markPrice@1s)
  function hubEnsureFundingConn(symbol) {
    const entry = ensureHubEntry(symbol);
    if (entry._conns.funding) return;
    let stopped = false;
    let retryMs = 1000;
    function connect() {
      if (stopped) return;
      const ws = new WebSocket(`wss://fstream.binance.com/market/ws/${symbol.toLowerCase()}@markPrice@1s`);
      ws.onopen = () => { retryMs = 1000; };
      ws.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        if (msg.r === undefined) return;
        entry.fundingRate = parseFloat(msg.r) * 100;
        evaluateAlertsForSymbol(symbol);
      };
      ws.onclose = () => { if (!stopped) setTimeout(connect, retryMs); retryMs = Math.min(retryMs * 2, 30000); };
      ws.onerror = () => ws.close();
    }
    connect();
    entry._conns.funding = { stop: () => { stopped = true; } };
  }

  // Open Interest sicramasi icin REST polling + kayan pencere
  function hubEnsureOiConn(symbol) {
    const entry = ensureHubEntry(symbol);
    if (entry._conns.oi) return;
    let stopped = false;
    async function poll() {
      if (stopped) return;
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${symbol}`);
        const data = await res.json();
        const v = parseFloat(data.openInterest);
        entry.oiHistory.push({ t: Date.now(), v });
        const cutoff = Date.now() - 5 * 60 * 1000; // son 5 dakikayi tut
        entry.oiHistory = entry.oiHistory.filter((p) => p.t >= cutoff);
        evaluateAlertsForSymbol(symbol);
      } catch (e) { console.error("[Alarm] Open Interest alinamadi:", e); }
      if (!stopped) setTimeout(poll, 5000);
    }
    poll();
    entry._conns.oi = { stop: () => { stopped = true; } };
  }

  function computeRsi(closes, period) {
    if (closes.length < period + 1) return null;
    const slice = closes.slice(-(period + 1));
    let gain = 0, loss = 0;
    for (let i = 1; i < slice.length; i++) {
      const diff = slice[i] - slice[i - 1];
      if (diff >= 0) gain += diff; else loss -= diff;
    }
    const avgGain = gain / period, avgLoss = loss / period;
    if (avgLoss === 0) return 100;
    return 100 - 100 / (1 + avgGain / avgLoss);
  }

  // OI'nin son 5 dakikadaki en eski degerine gore yuzde degisimi
  function oiPctChange(entry) {
    if (entry.oiHistory.length < 2) return null;
    const first = entry.oiHistory[0].v;
    const last = entry.oiHistory[entry.oiHistory.length - 1].v;
    if (!first) return null;
    return ((last - first) / first) * 100;
  }

  // Kullanilan sembollere gore gerekli hub baglantilarini acar/kapatir
  function syncHubConnections() {
    const needed = symbolsNeeded();
    needed.forEach((symbol) => {
      if (hubNeedsType(symbol, "price")) hubEnsurePriceConn(symbol);
      if (hubNeedsType(symbol, "rsi")) hubEnsureRsiConn(symbol);
      if (hubNeedsType(symbol, "funding")) hubEnsureFundingConn(symbol);
      if (hubNeedsType(symbol, "oi_spike")) hubEnsureOiConn(symbol);
    });
    // artik hicbir etkin alarmin kullanmadigi sembollerin baglantilarini kapat
    Object.keys(hub).forEach((symbol) => {
      if (!needed.has(symbol)) {
        Object.values(hub[symbol]._conns).forEach((c) => c.stop && c.stop());
        delete hub[symbol];
      }
    });
  }

  function evaluateCondition(entry, cond) {
    if (!entry) return false;
    if (cond.type === "price") {
      if (entry.price === null) return false;
      return cond.operator === ">" ? entry.price > cond.value : entry.price < cond.value;
    }
    if (cond.type === "rsi") {
      if (entry.rsi === null) return false;
      return cond.operator === ">" ? entry.rsi > cond.value : entry.rsi < cond.value;
    }
    if (cond.type === "funding") {
      if (entry.fundingRate === null) return false;
      return cond.operator === ">" ? entry.fundingRate > cond.value : entry.fundingRate < cond.value;
    }
    if (cond.type === "oi_spike") {
      const pct = oiPctChange(entry);
      if (pct === null) return false;
      return Math.abs(pct) > cond.value;
    }
    return false;
  }

  function describeCondition(c) {
    const labels = { price: "Fiyat", rsi: "RSI", funding: "Funding Rate", oi_spike: "OI değişimi (%5dk)" };
    const opLabel = c.type === "oi_spike" ? "mutlak >" : c.operator;
    return `${labels[c.type]} ${opLabel} ${c.value}`;
  }

  function describeAlert(alert) {
    return `${alert.symbol}: ` + alert.conditions.map(describeCondition).join(` ${alert.logic} `);
  }

  function evaluateAlertsForSymbol(symbol) {
    const entry = hub[symbol];
    alertsStore.alerts.forEach((alert) => {
      if (!alert.enabled || alert.symbol !== symbol) return;
      const results = alert.conditions.map((c) => evaluateCondition(entry, c));
      const combined = alert.logic === "AND" ? results.every(Boolean) : results.some(Boolean);
      if (combined && !alert._wasTrue) {
        fireAlert(alert, describeAlert(alert));
      }
      alert._wasTrue = combined;
    });
  }

  // --- Alarm CRUD --------------------------------------------------------
  function makeAlertId() { return "alert-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)); }

  function addAlert(alert) {
    alert.id = makeAlertId();

    alert._wasTrue = false;

  let pendingConditions = [];

    const saveBtn = document.createElement("button");

    saveBtn.addEventListener("click", () => {

      requestDesktopPermission();
      ensureAudioContext();
      pendingConditions = [{ type: "price", operator: ">", value: 0 }];
      pendingLogic = "AND";
      alertModalBackdrop.querySelector('.alert-tab[data-tab="list"]').click();
    });
    body.appendChild(saveBtn);

    if (!("Notification" in window)) {
      const note = document.createElement("div");
      note.className = "alert-empty-note";
      note.textContent = "Bu tarayıcı masaüstü bildirimlerini desteklemiyor; sesli uyarı ve ekran içi toast yine de çalışacak.";
      body.appendChild(note);
    } else if (Notification.permission === "default") {
      const permBtn = document.createElement("button");
      permBtn.className = "alert-btn secondary";
      permBtn.style.marginTop = "10px";
      permBtn.textContent = "Masaüstü bildirimlerine izin ver";
      permBtn.addEventListener("click", requestDesktopPermission);
      body.appendChild(permBtn);
    }
  }

  function renderAlertList() {
    const body = document.getElementById("alert-modal-body");
    body.innerHTML = "";
    if (alertsStore.alerts.length === 0) {
      const empty = document.createElement("div");
      empty.className = "alert-empty-note";
      empty.textContent = "Henüz alarm eklemediniz. \"+ Yeni Alarm\" sekmesinden ekleyebilirsiniz.";
      body.appendChild(empty);
      return;
    }
    alertsStore.alerts.forEach((alert) => {
      const item = document.createElement("div");
      item.className = "alert-list-item" + (alert.enabled ? "" : " disabled");
      item.innerHTML = `
        <div class="info">
          <div class="name">${alert.name}</div>
          <div class="desc">${describeAlert(alert)}</div>
        </div>`;
      const toggle = document.createElement("div");
      toggle.className = "alert-toggle-switch" + (alert.enabled ? " on" : "");
      toggle.innerHTML = `<div class="knob"></div>`;
      toggle.addEventListener("click", () => toggleAlert(alert.id));
      const delBtn = document.createElement("button");
      delBtn.className = "panel-btn close-btn";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", () => deleteAlert(alert.id));
      item.append(toggle, delBtn);
      body.appendChild(item);
    });
  }

  function renderAlertHistory() {
    const body = document.getElementById("alert-modal-body");
    if (!alertModalBackdrop.querySelector('.alert-tab[data-tab="history"]').classList.contains("active")) return;
    body.innerHTML = "";
    if (alertsStore.history.length === 0) {
      const empty = document.createElement("div");
      empty.className = "alert-empty-note";
      empty.textContent = "Henüz tetiklenen bir alarm yok.";
      body.appendChild(empty);
      return;
    }
    alertsStore.history.forEach((h) => {
      const row = document.createElement("div");
      row.className = "alert-history-row";
      row.innerHTML = `<span class="time">${h.time}</span><span style="flex:1;">${h.alertName} — ${h.desc}</span>`;
      body.appendChild(row);
    });
  }

  function renderAlertTab(tab) {
    if (tab === "new") renderNewAlertTab();
    else if (tab === "list") renderAlertList();
    else renderAlertHistory();
  }

  function openAlertManager(prefillSymbol) {
    ensureAudioContext();
    pendingConditions = [{ type: "price", operator: ">", value: 0 }];
    pendingConditions._symbol = prefillSymbol;
    pendingLogic = "AND";
    alertModalBackdrop.querySelectorAll(".alert-tab").forEach((t) => t.classList.remove("active"));
    alertModalBackdrop.querySelector('.alert-tab[data-tab="new"]').classList.add("active");
    renderNewAlertTab();
    alertModalBackdrop.classList.add("visible");
  }
  function closeAlertManager() {
    alertModalBackdrop.classList.remove("visible");
  }

  async function initAlertManager() {
    alertsStore = await loadAlertsStore();
    alertsStore.alerts.forEach((a) => { a._wasTrue = false; });
    syncHubConnections();
    updateAlertButtonBadge();
    document.getElementById("alert-manager-btn").addEventListener("click", () => openAlertManager("BTCUSDT"));
  }

  // =====================================================================
  // STICKY BAR (Funding Rate + geri sayim + Open Interest)
  // =====================================================================
  async function initStickyBar() {
    const saved = (await loadWithMigration(STICKY_KEY, (v) => v && typeof v === "object")) || {};
    let visible = saved.visible !== false;

    let symbol = "BTCUSDT";
    let currentTargetId = null;
    let generation = 0;
    let nextFundingTime = null;
    let lastFunding = null;
    let lastOI = null;

    const bar = document.getElementById("sticky-bar");
    const symbolEl = document.getElementById("sticky-symbol");
    const indicator = document.getElementById("sticky-indicator");
    const fundingEl = document.getElementById("sticky-funding");
    const countdownEl = document.getElementById("sticky-countdown");
    const oiEl = document.getElementById("sticky-oi");
    const targetSlot = document.getElementById("sticky-target-slot");
    const closeBtn = document.getElementById("sticky-close-btn");
    const showBtn = document.getElementById("sticky-show-btn");

    indicator.style.background = TARGET_COLORS[saved.targetId || DEFAULT_TARGET_ID];
    indicator.style.color = TARGET_COLORS[saved.targetId || DEFAULT_TARGET_ID];

    function persist(targetId) {
      idbSet(STICKY_KEY, { targetId, visible }); // fire-and-forget
    }

    function setVisible(v) {
      visible = v;
      bar.style.display = v ? "flex" : "none";
      showBtn.style.display = v ? "none" : "inline-flex";
      persist(currentTargetId || DEFAULT_TARGET_ID);
    }

    closeBtn.addEventListener("click", () => setVisible(false));
    showBtn.addEventListener("click", () => setVisible(true));

    function updateCountdown() {
      if (!nextFundingTime) { countdownEl.textContent = "—"; return; }
      const diff = nextFundingTime - Date.now();
      if (diff <= 0) { countdownEl.textContent = "00:00:00"; return; }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      countdownEl.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    setInterval(updateCountdown, 1000);

    let fundingWs = null;
    let fundingRetryMs = 1000;
    let fundingHeartbeat = null;
    let fundingFailCount = 0;
    let stopped = false;

    function connectFundingWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      fundingWs = new WebSocket(`wss://fstream.binance.com/market/ws/${mySymbol.toLowerCase()}@markPrice@1s`);
      fundingWs.onopen = () => { fundingRetryMs = 1000; fundingFailCount = 0; resetFundingHeartbeat(); };
      fundingWs.onmessage = (event) => {
        resetFundingHeartbeat();
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        if (msg.r === undefined) return;
        const rate = parseFloat(msg.r) * 100;
        if (lastFunding !== null && rate !== lastFunding) flashValue(fundingEl, rate >= lastFunding);
        fundingEl.textContent = `${rate >= 0 ? "+" : ""}${rate.toFixed(4)}%`;
        fundingEl.style.color = rate >= 0 ? "var(--up)" : "var(--down)";
        lastFunding = rate;
        nextFundingTime = msg.T;
        updateCountdown();
      };
      fundingWs.onclose = (ev) => {
        clearFundingHeartbeat();
        if (!stopped && myGen === generation) {
          fundingFailCount++;
          console.warn(`[Sticky Bar] markPrice WS kapandi (kod: ${ev.code}). Deneme: ${fundingFailCount}`);
          if (fundingFailCount >= 3 && lastFunding === null) {
            fundingEl.textContent = "bağlanamıyor";
            countdownEl.textContent = "—";
          }
          scheduleFundingReconnect(myGen);
        }
      };
      fundingWs.onerror = (ev) => {
        console.error("[Sticky Bar] markPrice WS hatasi - Futures WS'e erisim engelli olabilir (bolgesel kisitlama). Detay icin Network sekmesine bakin.", ev);
        fundingWs.close();
      };
    }
    function resetFundingHeartbeat() {
      clearFundingHeartbeat();
      fundingHeartbeat = setTimeout(() => fundingWs && fundingWs.close(), 60000);
    }
    function clearFundingHeartbeat() {
      if (fundingHeartbeat) { clearTimeout(fundingHeartbeat); fundingHeartbeat = null; }
    }
    function scheduleFundingReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectFundingWs(); }, fundingRetryMs);
      fundingRetryMs = Math.min(fundingRetryMs * 2, 30000);
    }

    let oiPollTimer = null;
    let oiFailCount = 0;
    async function pollOpenInterest() {
      const mySymbol = symbol;
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${mySymbol}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (mySymbol !== symbol) return;
        const oi = parseFloat(data.openInterest);
        if (lastOI !== null && oi !== lastOI) flashValue(oiEl, oi >= lastOI);
        oiEl.textContent = oi.toLocaleString("en-US", { maximumFractionDigits: 2 });
        lastOI = oi;
        oiFailCount = 0;
      } catch (e) {
        if (mySymbol !== symbol) return;
        oiFailCount++;
        console.error(`[Sticky Bar] Open Interest alinamadi (deneme ${oiFailCount}): ${e.message}. Futures REST API'ye erisim engelli olabilir (bolgesel kisitlama) - tarayicidan dogrudan https://fapi.binance.com/fapi/v1/openInterest?symbol=${mySymbol} adresini deneyin.`);
        if (oiFailCount >= 2 && lastOI === null) oiEl.textContent = "erişilemiyor";
      }
    }
    function startOiPolling() {
      if (oiPollTimer) clearInterval(oiPollTimer);
      oiFailCount = 0;
      pollOpenInterest();
      oiPollTimer = setInterval(pollOpenInterest, 5000);
    }

    function changeStickySymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      clearFundingHeartbeat();
      if (fundingWs) { try { fundingWs.close(); } catch (e) { /* yoksay */ } }
      fundingRetryMs = 1000;
      fundingFailCount = 0;

      lastFunding = null;
      lastOI = null;
      nextFundingTime = null;
      symbolEl.textContent = symbol;
      fundingEl.textContent = "—";
      fundingEl.style.color = "";
      oiEl.textContent = "—";
      countdownEl.textContent = "—";

      connectFundingWs();
      startOiPolling();
    }

    function subscribeToTarget(newTargetId) {
      if (currentTargetId !== null) targetBus.unsubscribe(currentTargetId, "sticky-bar");
      currentTargetId = newTargetId;
      targetBus.subscribe(currentTargetId, "sticky-bar", changeStickySymbol);
      persist(currentTargetId);
    }

    const targetGroupEl = createTargetButtonGroup(saved.targetId || DEFAULT_TARGET_ID, indicator, (newId) => {
      subscribeToTarget(newId);
    });
    targetSlot.appendChild(targetGroupEl);

    symbolEl.textContent = symbol;
    subscribeToTarget(saved.targetId || DEFAULT_TARGET_ID);
    connectFundingWs();
    startOiPolling();

    bar.style.display = visible ? "flex" : "none";
    showBtn.style.display = visible ? "none" : "inline-flex";
  }

  // =====================================================================
  // SAHNE YONETICISI (Scene Manager / Presets)
  // =====================================================================
  const SCENES_KEY = "crypto-dashboard-scenes-v1";
  let scenesStore = { scenes: [], activeSceneId: null };

  async function loadScenesStore() {
    const migrated = await loadWithMigration(SCENES_KEY, (v) => v && Array.isArray(v.scenes));
    return migrated || { scenes: [], activeSceneId: null };
  }

  function persistScenesStore() {
    idbSet(SCENES_KEY, scenesStore); // fire-and-forget
  }

  function findScene(id) {
    return scenesStore.scenes.find((s) => s.id === id);
  }

  function makeSceneId() {
    return "scene-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
  }

  // Su an ekrandaki GridStack duzenini (konum/boyut + panel tipi/sembol/target)
  // yakalar - hem otomatik kaydetme hem "Kaydet/Guncelle" butonu bunu kullanir.
  function captureCurrentGridData() {
    const nodes = grid.save(false); // sadece x/y/w/h/id - GridStack'in kendi alanlari
    const layout = nodes.map((n) => ({ id: n.id, x: n.x, y: n.y, w: n.w, h: n.h }));
    const meta = {};
    nodes.forEach((n) => {
      if (panelsMeta[n.id]) meta[n.id] = panelsMeta[n.id];
    });
    return { layout, meta };
  }

  // Aktif sahnenin icerigini gunceller. Panel eklendiginde/tasindiginde/
  // silindiginde veya sembol/target degistiginde otomatik cagrilir; ayrica
  // "Kaydet/Guncelle" butonu da aynen bunu tetikler.
  function saveLayout() {
    if (!scenesStore.activeSceneId) return;
    const scene = findScene(scenesStore.activeSceneId);
    if (!scene) return;
    const { layout, meta } = captureCurrentGridData();
    scene.layout = layout;
    scene.meta = meta;
    persistScenesStore();
  }

  grid.on("added removed change", () => saveLayout());

  function createPanelElement(type, id, symbol, targetId) {
    if (type === "watchlist") return createWatchlistPanel(id, targetId);
    if (type === "orderbook") return createOrderBookPanel(id, symbol, targetId);
    if (type === "heatmap") return createHeatmapPanel(id, symbol, targetId);
    if (type === "bot") return createBotPanel(id, symbol, targetId);
    return createChartPanel(id, symbol, targetId);
  }

  function addPanelToGrid(id, type, symbol, targetId, position) {
    panelsMeta[id] = { type, symbol, targetId };
    const el = createPanelElement(type, id, symbol, targetId);
    grid.addWidget(el, position);
  }

  // Izgaradaki TUM panelleri (WS baglantilari dahil) temizler; sahne
  // degistirirken veya yeni bos sahne acarken kullanilir.
  function clearGridPanels() {
    Object.keys(panelInstances).forEach((id) => panelInstances[id]?.destroy?.());
    Object.keys(panelInstances).forEach((id) => delete panelInstances[id]);
    Object.keys(panelsMeta).forEach((id) => delete panelsMeta[id]);
    grid.removeAll();
  }

  // Verilen sahne verisini (layout+meta) izgaraya yukler. GridStack'in
  // gercek callback imzasi: (parent, w, add) => HTMLElement | undefined.
  function loadSceneIntoGrid(scene) {
    if (!scene || !Array.isArray(scene.layout) || scene.layout.length === 0) return;
    const meta = scene.meta || {};
    grid.load(scene.layout, (parentEl, w, add) => {
      if (add) {
        const panelMeta = meta[w.id] || { type: "chart", symbol: "BTCUSDT", targetId: DEFAULT_TARGET_ID };
        const targetId = panelMeta.targetId || DEFAULT_TARGET_ID;
        panelsMeta[w.id] = { type: panelMeta.type, symbol: panelMeta.symbol, targetId, interval: panelMeta.interval };
        return createPanelElement(panelMeta.type, w.id, panelMeta.symbol, targetId);
      }
      panelInstances[w.id]?.destroy?.();
      delete panelInstances[w.id];
      delete panelsMeta[w.id];
      return undefined;
    });
  }

  function createDefaultLayout() {
    addPanelToGrid("panel-watchlist-default", "watchlist", null, DEFAULT_TARGET_ID,
      { id: "panel-watchlist-default", x: 0, y: 0, w: 3, h: 8 });
    addPanelToGrid("panel-chart-default", "chart", "BTCUSDT", DEFAULT_TARGET_ID,
      { id: "panel-chart-default", x: 3, y: 0, w: 6, h: 8 });
    addPanelToGrid("panel-orderbook-default", "orderbook", "BTCUSDT", DEFAULT_TARGET_ID,
      { id: "panel-orderbook-default", x: 9, y: 0, w: 3, h: 8 });
  }

  function renderSceneSelect() {
    const select = document.getElementById("scene-select");
    select.innerHTML = "";
    scenesStore.scenes.forEach((scene) => {
      const opt = document.createElement("option");
      opt.value = scene.id;
      opt.textContent = scene.name;
      if (scene.id === scenesStore.activeSceneId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function switchToScene(sceneId) {
    const scene = findScene(sceneId);
    if (!scene) return;
    scenesStore.activeSceneId = sceneId;
    persistScenesStore();
    clearGridPanels();
    loadSceneIntoGrid(scene);
    renderSceneSelect();
  }

  function createNewScene() {
    const name = window.prompt("Yeni sahne adı:", `Sahne ${scenesStore.scenes.length + 1}`);
    if (!name || !name.trim()) return;
    const scene = { id: makeSceneId(), name: name.trim(), layout: [], meta: {} };
    scenesStore.scenes.push(scene);
    scenesStore.activeSceneId = scene.id;
    persistScenesStore();
    clearGridPanels(); // yeni sahne bos baslar; kullanici "Panel Ekle" ile doldurur
    renderSceneSelect();
  }

  function deleteActiveScene() {
    const scene = findScene(scenesStore.activeSceneId);
    if (!scene) return;
    if (!window.confirm(`"${scene.name}" sahnesini silmek istediğinize emin misiniz?`)) return;

    scenesStore.scenes = scenesStore.scenes.filter((s) => s.id !== scene.id);
    if (scenesStore.scenes.length === 0) {
      const fresh = { id: makeSceneId(), name: "Varsayılan Sahne", layout: [], meta: {} };
      scenesStore.scenes.push(fresh);
      scenesStore.activeSceneId = fresh.id;
      persistScenesStore();
      clearGridPanels();
      createDefaultLayout();
    } else {
      scenesStore.activeSceneId = scenesStore.scenes[0].id;
      persistScenesStore();
      clearGridPanels();
      loadSceneIntoGrid(findScene(scenesStore.activeSceneId));
    }
    renderSceneSelect();
  }

  function flashSceneSaveFeedback() {
    const btn = document.getElementById("scene-save-btn");
    const original = btn.textContent;
    btn.textContent = "Kaydedildi ✓";
    setTimeout(() => { btn.textContent = original; }, 1200);
  }

  // --- Ilk kurulum: eski (sahne oncesi) duz localStorage duzeni varsa
  // ilk sahneye tasi; hic veri yoksa varsayilan 3 panelli sahneyi olustur.
  (async function initScenes() {
    scenesStore = await loadScenesStore();

    if (scenesStore.scenes.length === 0) {
      let migratedLayout = null;
      let migratedMeta = null;
      try {
        const oldRaw = localStorage.getItem(STORAGE_KEY);
        if (oldRaw) {
          const old = JSON.parse(oldRaw);
          if (old && Array.isArray(old.layout) && old.layout.length) {
            migratedLayout = old.layout;
            migratedMeta = old.meta || {};
          }
        }
      } catch { /* eski veri okunamadi, onemli degil */ }

      const scene = {
        id: makeSceneId(),
        name: "Varsayılan Sahne",
        layout: migratedLayout || [],
        meta: migratedMeta || {},
      };
      scenesStore.scenes.push(scene);
      scenesStore.activeSceneId = scene.id;
      persistScenesStore();
      localStorage.removeItem(STORAGE_KEY); // artik IndexedDB'deki sahne sistemi icinde
    }

    const activeScene = findScene(scenesStore.activeSceneId) || scenesStore.scenes[0];
    scenesStore.activeSceneId = activeScene.id;

    if (activeScene.layout && activeScene.layout.length > 0) {
      loadSceneIntoGrid(activeScene);
    } else {
      createDefaultLayout();
      saveLayout();
    }
    renderSceneSelect();
  })();

  initStickyBar();
  initAlertManager();

  document.getElementById("scene-select").addEventListener("change", (e) => {
    switchToScene(e.target.value);
  });
  document.getElementById("scene-save-btn").addEventListener("click", () => {
    saveLayout();
    flashSceneSaveFeedback();
  });
  document.getElementById("scene-new-btn").addEventListener("click", createNewScene);
  document.getElementById("scene-delete-btn").addEventListener("click", deleteActiveScene);

  // =====================================================================
  // "Panel Ekle" butonu
  // =====================================================================
  document.getElementById("add-panel-btn").addEventListener("click", () => {
    const typeInput = window.prompt(
      "Panel türü girin: 'grafik', 'emirdefteri', 'isiharitasi' veya 'bot'",
      "grafik"
    );
    if (!typeInput) return;
    const normalizedType = typeInput.trim().toLowerCase();
    const typeMap = { grafik: "chart", emirdefteri: "orderbook", isiharitasi: "heatmap", bot: "bot" };
    if (!typeMap[normalizedType]) {
      window.alert("Geçersiz tür. 'grafik', 'emirdefteri', 'isiharitasi' veya 'bot' yazın.");
      return;
    }

    const symbolInput = window.prompt("Sembol girin (örn. ETHUSDT):", "ETHUSDT");
    if (!symbolInput) return;
    const symbol = symbolInput.trim().toUpperCase();
    if (!/^[A-Z0-9]{5,15}$/.test(symbol)) {
      window.alert("Geçersiz sembol. Örnek: ETHUSDT, SOLUSDT");
      return;
    }

    const panelType = typeMap[normalizedType];
    const sizeByType = {
      chart: { w: 6, h: 8 },
      orderbook: { w: 3, h: 8 },
      heatmap: { w: 6, h: 6 },
      bot: { w: 4, h: 10 },
    };
    const id = "panel-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
    addPanelToGrid(id, panelType, symbol, DEFAULT_TARGET_ID, { id, ...sizeByType[panelType] });
    saveLayout();
  });
})();
</script>
</body>
</html>
