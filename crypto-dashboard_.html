<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kripto Dashboard</title>

<!-- Grafik kütüphanesi -->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<!-- Grid / drag-drop / resize kütüphanesi (react-grid-layout'un vanilla JS karsiligi) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css" />
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack-all.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel-header: #141a26;
    --border: #1e2634;
    --text-primary: #e6eaf2;
    --text-secondary: #7c8699;
    --accent: #e8a33d;
    --up: #26a69a;
    --down: #ef5350;
    --dot-live: #3ddc84;
    --target-1: #e8a33d;
    --target-2: #26a69a;
    --target-3: #7c8aff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    overflow: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* ---------- Ust toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #toolbar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
  #toolbar .sub { font-size: 11px; color: var(--text-secondary); margin-left: 10px; font-family: 'IBM Plex Mono', monospace; }
  #toolbar-right { display: flex; align-items: center; gap: 8px; }

  #add-panel-btn, #sticky-show-btn {
    background: var(--accent);
    color: #1a1305;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  #add-panel-btn:hover, #sticky-show-btn:hover { filter: brightness(1.1); }
  #sticky-show-btn {
    display: none;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  #sticky-show-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }

  /* ---------- Sahne cubugu (Scene Bar) ---------- */
  #scene-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #scene-bar label { font-size: 11px; color: var(--text-secondary); }
  #scene-select {
    background: var(--panel);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    min-width: 180px;
  }
  .scene-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .scene-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  .scene-btn.primary { background: var(--accent); color: #1a1305; border-color: var(--accent); }
  .scene-btn.primary:hover { filter: brightness(1.1); color: #1a1305; }
  .scene-btn.danger:hover { background: rgba(239,83,80,0.18); color: var(--down); border-color: var(--down); }

  /* ---------- Sticky bar ---------- */
  #sticky-bar {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 9px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sticky-symbol { font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .sticky-metric { display: flex; flex-direction: column; gap: 2px; }
  .sticky-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
  .sticky-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
    display: inline-block;
  }

  /* ---------- Deger degisince yesil/kirmizi kisa parlama ---------- */
  @keyframes flashUp { 0% { background: rgba(38,166,154,0.45); } 100% { background: transparent; } }
  @keyframes flashDown { 0% { background: rgba(239,83,80,0.45); } 100% { background: transparent; } }
  .flash-up { animation: flashUp 0.8s ease-out; }
  .flash-down { animation: flashDown 0.8s ease-out; }

  /* ---------- Grid alani ---------- */
  #grid-wrapper { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
  .grid-stack { background: transparent; }

  /* ---------- Panel govdesi ---------- */
  .grid-stack-item-content.panel {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    inset: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 6px 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--panel-header);
  }

  .drag-handle {
    cursor: grab;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 2px 6px;
    line-height: 1;
    user-select: none;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .drag-handle:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
  .drag-handle:active { cursor: grabbing; }

  .target-indicator {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 4px currentColor;
  }

  .panel-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .target-group { display: flex; gap: 3px; flex-shrink: 0; }
  .target-btn {
    width: 20px; height: 20px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .target-btn:hover { border-color: var(--text-secondary); }
  .target-btn.active-1 { background: var(--target-1); color: #1a1305; border-color: var(--target-1); }
  .target-btn.active-2 { background: var(--target-2); color: #04211d; border-color: var(--target-2); }
  .target-btn.active-3 { background: var(--target-3); color: #0d0f2b; border-color: var(--target-3); }

  .panel-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    width: 24px; height: 24px;
    border-radius: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .panel-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
  .panel-btn.close-btn:hover { background: rgba(239,83,80,0.18); color: var(--down); }

  .panel-body { flex: 1; min-height: 0; position: relative; }

  /* ---------- Maksimize modu ---------- */
  .grid-stack-item.maximized {
    position: fixed !important;
    top: 14px !important; left: 14px !important; right: 14px !important; bottom: 14px !important;
    width: auto !important; height: auto !important;
    z-index: 1000;
    transform: none !important;
  }

  #maximize-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 999; }
  #maximize-backdrop.visible { display: block; }

  /* ---------- Watchlist paneli (tablo) ---------- */
  .watchlist-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .wl-col-toggles {
    display: flex; gap: 4px; padding: 5px 8px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: var(--panel-header);
  }
  .wl-col-toggle-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 2px 8px; font-size: 9px; font-weight: 600;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .wl-col-toggle-btn.active { border-color: var(--accent); color: var(--accent); }
  .wl-table-wrap { flex: 1; min-height: 0; overflow: auto; }
  .wl-table {
    width: 100%; min-width: 360px; border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  }
  .wl-table th {
    position: sticky; top: 0; background: var(--panel-header);
    text-align: right; font-size: 9px; color: var(--text-secondary); font-weight: 600;
    padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .wl-table td {
    text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border);
    color: var(--text-primary); white-space: nowrap;
  }
  .wl-table th.col-symbol, .wl-table td.col-symbol { text-align: left; }
  .wl-table tbody tr { cursor: pointer; transition: background 0.15s ease; }
  .wl-table tbody tr:last-child td { border-bottom: none; }
  .wl-table tbody tr:hover { background: rgba(255,255,255,0.04); }
  .wl-symbol { font-weight: 600; }
  .wl-table.hide-fr .col-fr, .wl-table.hide-oi .col-oi { display: none; }

  /* ---------- Grafik paneli ---------- */
  .chart-container { position: absolute; inset: 0; }
  .chart-init-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--text-secondary); font-size: 12px; font-family: 'IBM Plex Mono', monospace;
  }
  .chart-price-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-secondary); }

  .chart-tf-bar {
    display: flex; gap: 4px; padding: 5px 8px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    background: var(--panel-header);
  }
  .chart-tf-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 3px 8px; font-size: 10px;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .chart-tf-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  .chart-tf-btn.active { background: var(--accent); color: #1a1305; border-color: var(--accent); font-weight: 600; }

  /* ---------- Cizim (Drawing) araç çubuğu ve katmanı ---------- */
  .draw-toolbar {
    position: absolute; top: 8px; left: 8px; z-index: 5;
    display: flex; flex-direction: column; gap: 3px;
    background: rgba(16,21,31,0.92); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px; backdrop-filter: blur(2px);
  }
  .draw-tool-btn {
    width: 28px; height: 24px; background: transparent; border: 1px solid transparent;
    color: var(--text-secondary); border-radius: 4px; font-size: 9px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .draw-tool-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
  .draw-tool-btn.active { background: var(--accent); color: #1a1305; }
  .draw-tool-btn.draw-tool-long { color: var(--up); }
  .draw-tool-btn.draw-tool-short { color: var(--down); }
  .draw-tool-btn.draw-tool-long.active { background: var(--up); color: #04211d; }
  .draw-tool-btn.draw-tool-short.active { background: var(--down); color: #2b0a08; }
  .draw-toolbar hr { width: 100%; border: none; border-top: 1px solid var(--border); margin: 2px 0; }

  .draw-canvas { position: absolute; inset: 0; z-index: 2; }

  .draw-mini-toolbar {
    position: absolute; z-index: 6; display: none;
    align-items: center; gap: 4px; padding: 4px 6px;
    background: var(--panel-header); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .draw-mini-toolbar.visible { display: flex; }
  .draw-color-swatch { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .draw-color-swatch.selected { border-color: var(--text-primary); }
  .draw-mini-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 2px 7px; font-size: 10px; cursor: pointer;
  }
  .draw-mini-btn:hover { color: var(--text-primary); }
  .draw-mini-btn.danger:hover { color: var(--down); border-color: var(--down); }

  /* ---------- Emir defteri (Order Book) paneli ---------- */
  .ob-body {
    display: flex; flex-direction: column; height: 100%; overflow: hidden;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  }
  .ob-header-row {
    display: flex; justify-content: space-between;
    padding: 5px 10px; color: var(--text-secondary); font-size: 10px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ob-asks, .ob-bids { display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 0; }
  .ob-row {
    position: relative;
    display: flex; justify-content: space-between;
    padding: 2.5px 10px;
  }
  .ob-row .ob-bar { position: absolute; top: 0; right: 0; bottom: 0; }
  .ob-row.ask .ob-bar { background: rgba(239,83,80,0.16); }
  .ob-row.bid .ob-bar { background: rgba(38,166,154,0.16); }
  .ob-price, .ob-qty { position: relative; z-index: 1; }
  .ob-price.ask { color: var(--down); }
  .ob-price.bid { color: var(--up); }
  .ob-qty { color: var(--text-secondary); }
  .ob-spread {
    text-align: center; padding: 4px; color: var(--text-secondary); font-size: 10px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    flex-shrink: 0; background: var(--panel-header);
  }

  /* ---------- Likidite Isi Haritasi (Heatmap) paneli ---------- */
  .heatmap-container { position: absolute; inset: 0; }
  .heatmap-canvas { width: 100%; height: 100%; display: block; }

  /* ---------- Bot Kontrol paneli ---------- */
  .bot-body {
    padding: 10px; display: flex; flex-direction: column; gap: 10px;
    height: 100%; overflow-y: auto; font-size: 12px;
  }
  .bot-select {
    background: var(--panel); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 8px; font-size: 11px; font-family: 'IBM Plex Sans', sans-serif; width: 100%;
  }
  .bot-controls { display: flex; align-items: center; gap: 10px; }
  .bot-toggle-btn {
    flex-shrink: 0; padding: 8px 14px; border-radius: 6px; border: none;
    font-weight: 600; cursor: pointer; font-size: 11px; transition: filter 0.15s ease;
  }
  .bot-toggle-btn:hover { filter: brightness(1.1); }
  .bot-toggle-btn.start { background: var(--up); color: #04211d; }
  .bot-toggle-btn.stop { background: var(--down); color: #2b0a08; }
  .bot-status {
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-secondary);
  }
  .bot-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-secondary); flex-shrink: 0; }
  .bot-status-dot.running { background: var(--dot-live); box-shadow: 0 0 5px var(--dot-live); }
  .bot-pnl {
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600;
    text-align: center; padding: 8px; border-radius: 6px; background: var(--panel-header);
  }
  .bot-trades-table { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 10px; }
  .bot-trades-table th, .bot-trades-table td { padding: 4px 5px; text-align: right; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
  .bot-trades-table th { font-weight: 600; color: var(--text-secondary); }
  .bot-trades-table td { color: var(--text-primary); }
  .bot-trades-table th:first-child, .bot-trades-table td:first-child { text-align: left; }
  .bot-disclaimer { font-size: 9px; color: var(--text-secondary); text-align: center; line-height: 1.4; }

  /* ---------- Alarm Yoneticisi butonu ---------- */
  #alert-manager-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #alert-manager-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  #alert-manager-btn.has-alerts { border-color: var(--accent); color: var(--accent); }

  /* ---------- Alarm Yoneticisi modali ---------- */
  #alert-modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000;
    align-items: center; justify-content: center;
  }
  #alert-modal-backdrop.visible { display: flex; }
  #alert-modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: min(640px, 92vw); max-height: 84vh; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #alert-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--panel-header); flex-shrink: 0;
  }
  #alert-modal-header h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .alert-tabs { display: flex; gap: 4px; padding: 10px 18px 0; flex-shrink: 0; }
  .alert-tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-secondary); padding: 8px 4px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .alert-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  #alert-modal-body { padding: 14px 18px 18px; overflow-y: auto; flex: 1; }

  .alert-form-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .alert-form-row label { font-size: 11px; color: var(--text-secondary); min-width: 80px; flex-shrink: 0; }
  .alert-input, .alert-select {
    background: var(--bg); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: 'IBM Plex Sans', sans-serif;
    flex: 1; min-width: 0;
  }
  .condition-row {
    display: flex; gap: 6px; align-items: center; margin-bottom: 6px;
    background: var(--panel-header); padding: 8px; border-radius: 6px; border: 1px solid var(--border);
  }
  .condition-remove-btn {
    background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
    font-size: 14px; flex-shrink: 0; width: 22px; height: 22px; border-radius: 4px;
  }
  .condition-remove-btn:hover { color: var(--down); background: rgba(239,83,80,0.15); }
  .alert-logic-toggle { display: flex; gap: 4px; margin: 6px 0 12px; }
  .alert-logic-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 600; cursor: pointer;
  }
  .alert-logic-btn.active { background: var(--accent); color: #1a1305; border-color: var(--accent); }

  .alert-btn {
    background: var(--accent); color: #1a1305; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .alert-btn:hover { filter: brightness(1.1); }
  .alert-btn.secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .alert-btn.secondary:hover { color: var(--text-primary); border-color: var(--text-secondary); }

  .alert-list-item {
    display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 8px;
    background: var(--panel-header); border: 1px solid var(--border); border-radius: 8px; font-size: 12px;
  }
  .alert-list-item .info { flex: 1; min-width: 0; }
  .alert-list-item .info .name { font-weight: 600; color: var(--text-primary); }
  .alert-list-item .info .desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .alert-list-item.disabled { opacity: 0.5; }
  .alert-toggle-switch {
    width: 34px; height: 18px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); position: relative; cursor: pointer; flex-shrink: 0;
  }
  .alert-toggle-switch .knob {
    position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-secondary); transition: left 0.15s ease, background 0.15s ease;
  }
  .alert-toggle-switch.on { border-color: var(--up); }
  .alert-toggle-switch.on .knob { left: 17px; background: var(--up); }

  .alert-history-row {
    display: flex; justify-content: space-between; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border); font-size: 11px;
  }
  .alert-history-row .time { color: var(--text-secondary); font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
  .alert-empty-note { color: var(--text-secondary); font-size: 12px; text-align: center; padding: 20px 0; }

  /* ---------- Toast bildirimleri ---------- */
  #toast-container {
    position: fixed; top: 16px; right: 16px; z-index: 3000;
    display: flex; flex-direction: column; gap: 8px; max-width: 320px;
  }
  .toast {
    background: var(--panel); border: 1px solid var(--accent); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: toastIn 0.25s ease-out;
  }
  .toast .toast-title { font-size: 12px; font-weight: 600; color: var(--text-primary); display: flex; justify-content: space-between; gap: 8px; }
  .toast .toast-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .toast .toast-close { cursor: pointer; color: var(--text-secondary); background: none; border: none; font-size: 12px; flex-shrink: 0; }
  @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>

</head>
<body>
<div id="app">
  <div id="toolbar">
    <div style="display:flex; align-items:baseline;">
      <h1>Kripto Dashboard</h1>
      <span class="sub">İzleme Listesi'nde bir sembole tıklayınca aynı Target ID'ye sahip paneller güncellenir</span>
    </div>
    <div id="toolbar-right">
      <button id="sticky-show-btn">Bilgi çubuğunu göster</button>
      <button id="alert-manager-btn">🔔 Alarmlar</button>
      <button id="add-panel-btn">+ Panel Ekle</button>
    </div>
  </div>

  <div id="scene-bar">
    <label for="scene-select">Sahne</label>
    <select id="scene-select"></select>
    <button class="scene-btn primary" id="scene-save-btn">Kaydet / Güncelle</button>
    <button class="scene-btn" id="scene-new-btn">+ Yeni Sahne</button>
    <button class="scene-btn danger" id="scene-delete-btn">Sil</button>
  </div>

  <div id="sticky-bar">
    <div class="target-group" id="sticky-target-slot"></div>
    <span class="target-indicator" id="sticky-indicator"></span>
    <span id="sticky-symbol">—</span>
    <div class="sticky-metric">
      <span class="sticky-label">Funding Rate</span>
      <span class="sticky-value" id="sticky-funding">—</span>
    </div>
    <div class="sticky-metric">
      <span class="sticky-label">Sonraki Fonlama</span>
      <span class="sticky-value" id="sticky-countdown" style="color:var(--text-secondary)">—</span>
    </div>
    <div class="sticky-metric">
      <span class="sticky-label">Open Interest</span>
      <span class="sticky-value" id="sticky-oi">—</span>
    </div>
    <button class="panel-btn close-btn" id="sticky-close-btn" style="margin-left:auto;" title="Bilgi çubuğunu kapat">✕</button>
  </div>

  <div id="grid-wrapper">
    <div class="grid-stack" id="dashboard-grid"></div>
  </div>
</div>

<div id="maximize-backdrop"></div>
<div id="toast-container"></div>

<script>
(function () {
  "use strict";

  // =====================================================================
  // Genel ayarlar / durum
  // =====================================================================
  const STORAGE_KEY = "crypto-dashboard-layout-v3";
  const STICKY_KEY = "crypto-dashboard-stickybar-v1";
  const WATCHLIST_SYMBOLS = ["btcusdt", "ethusdt", "bnbusdt", "solusdt", "xrpusdt", "adausdt"];
  const TARGET_COLORS = { 1: "#e8a33d", 2: "#26a69a", 3: "#7c8aff" };
  const DEFAULT_TARGET_ID = 1;

  const panelsMeta = {};      // id -> { type: 'watchlist' | 'chart' | 'orderbook', symbol?, targetId }
  const panelInstances = {};  // id -> { destroy() }
  let maximizedPanelId = null;

  const backdrop = document.getElementById("maximize-backdrop");

  // =====================================================================
  // IndexedDB tabanli kalici depo (localStorage yerine)
  //
  // localStorage senkron ve ~5-10MB sinirli; IndexedDB asenkron ama cok
  // daha genis kapasiteli ve yapisal veriyi (JSON.stringify gerekmeden)
  // dogrudan saklayabiliyor. Asagidaki idbGet/idbSet, eski kodun geri
  // kalaninin degismeden calismasi icin basit bir anahtar-deger arayuzu
  // sunuyor. Ilk calistirmada, eger IndexedDB'de veri yoksa ama eski
  // localStorage'da varsa, otomatik olarak IndexedDB'ye tasinir (tek
  // seferlik gecis) - boylece daha once olusturulmus sahneler, alarmlar
  // ve cizimler kaybolmaz.
  // =====================================================================
  const IDB_NAME = "crypto-dashboard-db";
  const IDB_STORE = "kv";
  let idbOpenPromise = null;

  function openIdb() {
    if (idbOpenPromise) return idbOpenPromise;
    idbOpenPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("IndexedDB desteklenmiyor")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return idbOpenPromise;
  }

  async function idbGet(key) {
    try {
      const db = await openIdb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      console.error("[IndexedDB] Okuma hatasi, localStorage'a dusuluyor:", e);
      return null;
    }
  }

  async function idbSet(key, value) {
    try {
      const db = await openIdb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      console.error("[IndexedDB] Yazma hatasi:", e);
    }
  }

  // Bir anahtar icin: once IndexedDB'ye bak; yoksa eski localStorage
  // kaydini oku, IndexedDB'ye tasi, localStorage'daki eski kopyayi sil.
  async function loadWithMigration(key, isValid) {
    const fromIdb = await idbGet(key);
    if (fromIdb !== null && isValid(fromIdb)) return fromIdb;
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (isValid(parsed)) {
          await idbSet(key, parsed);
          localStorage.removeItem(key);
          return parsed;
        }
      }
    } catch { /* eski veri okunamadi, onemli degil */ }
    return null;
  }

  const grid = GridStack.init({
    column: 12,
    cellHeight: 58,
    margin: 8,
    float: true,
    handle: ".drag-handle",
    animate: true,
  }, "#dashboard-grid");

  // =====================================================================
  // Target bus: Watchlist -> ayni Target ID'deki Grafik/Emir Defteri/
  // Sticky Bar hedeflerine yayin
  // =====================================================================
  const targetBus = {
    listeners: {}, // targetId -> Map(subscriberId -> callback)
    subscribe(targetId, subscriberId, cb) {
      if (!this.listeners[targetId]) this.listeners[targetId] = new Map();
      this.listeners[targetId].set(subscriberId, cb);
    },
    unsubscribe(targetId, subscriberId) {
      this.listeners[targetId]?.delete(subscriberId);
    },
    emit(targetId, symbol) {
      this.listeners[targetId]?.forEach((cb) => cb(symbol));
    },
  };

  // Deger degisince kisa yesil/kirmizi parlama efekti
  function flashValue(el, isUp) {
    el.classList.remove("flash-up", "flash-down");
    void el.offsetWidth; // reflow - animasyonu yeniden baslatmak icin
    el.classList.add(isUp ? "flash-up" : "flash-down");
  }

  // Target 1/2/3 buton grubunu olusturur; hem panel basliklarinda hem
  // Sticky Bar'da ayni mantikla kullanilir.
  function createTargetButtonGroup(initialTargetId, indicatorEl, onChange) {
    const wrap = document.createElement("div");
    wrap.className = "target-group";
    const buttons = [1, 2, 3].map((tId) => {
      const btn = document.createElement("button");
      btn.className = "target-btn" + (tId === initialTargetId ? ` active-${tId}` : "");
      btn.textContent = String(tId);
      btn.title = `Target ${tId}`;
      btn.dataset.target = String(tId);
      wrap.appendChild(btn);
      return btn;
    });
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const tId = Number(btn.dataset.target);
        buttons.forEach((b) => {
          b.className = "target-btn" + (Number(b.dataset.target) === tId ? ` active-${tId}` : "");
        });
        if (indicatorEl) {
          indicatorEl.style.background = TARGET_COLORS[tId];
          indicatorEl.style.color = TARGET_COLORS[tId];
          indicatorEl.title = `Target ${tId}`;
        }
        onChange(tId);
      });
    });
    return wrap;
  }

  // =====================================================================
  // Ortak panel govdesi (baslik + tutamac + target secici + butonlar)
  // =====================================================================
  function buildPanelShell(id, title, initialTargetId, onTargetChange, getAlertSymbol) {
    const item = document.createElement("div");
    item.className = "grid-stack-item";

    const content = document.createElement("div");
    content.className = "grid-stack-item-content panel";

    const header = document.createElement("div");
    header.className = "panel-header";

    const handle = document.createElement("span");
    handle.className = "drag-handle";
    handle.textContent = "≡";
    handle.title = "Sürüklemek için tutun";

    const indicator = document.createElement("span");
    indicator.className = "target-indicator";
    indicator.style.background = TARGET_COLORS[initialTargetId];
    indicator.style.color = TARGET_COLORS[initialTargetId];
    indicator.title = `Target ${initialTargetId}`;

    const titleEl = document.createElement("span");
    titleEl.className = "panel-title";
    titleEl.textContent = title;

    const targetGroup = createTargetButtonGroup(initialTargetId, indicator, onTargetChange);

    const bellBtn = document.createElement("button");
    bellBtn.className = "panel-btn";
    bellBtn.textContent = "🔔";
    bellBtn.title = "Alarm ekle";
    bellBtn.addEventListener("click", () => {
      const sym = (typeof getAlertSymbol === "function" ? getAlertSymbol() : getAlertSymbol) || "BTCUSDT";
      openAlertManager(sym);
    });

    const maxBtn = document.createElement("button");
    maxBtn.className = "panel-btn";
    maxBtn.textContent = "⤢";
    maxBtn.title = "Tam ekran";
    maxBtn.addEventListener("click", () => toggleMaximize(id));

    const closeBtn = document.createElement("button");
    closeBtn.className = "panel-btn close-btn";
    closeBtn.textContent = "✕";
    closeBtn.title = "Paneli kapat";
    closeBtn.addEventListener("click", () => closePanel(id));

    header.append(handle, indicator, titleEl, targetGroup, bellBtn, maxBtn, closeBtn);

    const body = document.createElement("div");
    body.className = "panel-body";

    content.append(header, body);
    item.appendChild(content);

    return { item, body, titleEl };
  }

  function toggleMaximize(id) {
    const item = grid.engine.nodes.find((n) => n.id === id)?.el;
    if (!item) return;

    if (maximizedPanelId === id) {
      item.classList.remove("maximized");
      backdrop.classList.remove("visible");
      grid.movable(item, true);
      grid.resizable(item, true);
      maximizedPanelId = null;
    } else {
      if (maximizedPanelId) toggleMaximize(maximizedPanelId);
      item.classList.add("maximized");
      backdrop.classList.add("visible");
      grid.movable(item, false);
      grid.resizable(item, false);
      maximizedPanelId = id;
    }
  }

  function closePanel(id) {
    const node = grid.engine.nodes.find((n) => n.id === id);
    if (!node) return;
    panelInstances[id]?.destroy?.();
    delete panelInstances[id];
    delete panelsMeta[id];
    if (maximizedPanelId === id) {
      backdrop.classList.remove("visible");
      maximizedPanelId = null;
    }
    grid.removeWidget(node.el);
    saveLayout();
  }

  // =====================================================================
  // WATCHLIST PANELI
  // =====================================================================
  function createWatchlistPanel(id, initialTargetId) {
    let targetId = initialTargetId;

    const { item, body } = buildPanelShell(id, "İzleme Listesi", targetId, (newId) => {
      targetId = newId;
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => "BTCUSDT");
    body.classList.add("watchlist-body");

    // --- Sutun goster/gizle kontrolleri ---
    const colBar = document.createElement("div");
    colBar.className = "wl-col-toggles";
    const wrap = document.createElement("div");
    wrap.className = "wl-table-wrap";
    const table = document.createElement("table");
    table.className = "wl-table";
    table.innerHTML = `
      <thead>
        <tr>
          <th class="col-symbol">Sembol</th>
          <th class="col-price">Fiyat</th>
          <th class="col-fr">FR (Fonlama)</th>
          <th class="col-oi">OI (Açık Pozisyon)</th>
        </tr>
      </thead>
      <tbody></tbody>`;
    wrap.appendChild(table);
    const tbody = table.querySelector("tbody");

    ["fr", "oi"].forEach((col) => {
      const btn = document.createElement("button");
      btn.className = "wl-col-toggle-btn active";
      btn.textContent = col.toUpperCase();
      btn.title = `${col.toUpperCase()} sütununu göster/gizle`;
      btn.addEventListener("click", () => {
        const hidden = table.classList.toggle(`hide-${col}`);
        btn.classList.toggle("active", !hidden);
      });
      colBar.appendChild(btn);
    });

    body.appendChild(colBar);
    body.appendChild(wrap);

    // sym -> { price, fundingRate, oiQty }, hucreleri yeniden hesaplamak icin
    const state = {};
    const rows = {};

    WATCHLIST_SYMBOLS.forEach((sym) => {
      const symbolUpper = sym.toUpperCase();
      state[sym] = { price: null, fundingRate: null, oiQty: null };

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="col-symbol wl-symbol">${sym.replace("usdt", "").toUpperCase()}/USDT</td>
        <td class="col-price wl-price">—</td>
        <td class="col-fr wl-fr">—</td>
        <td class="col-oi wl-oi">—</td>`;
      tr.addEventListener("click", () => {
        tr.style.background = "rgba(232,163,61,0.18)";
        setTimeout(() => { tr.style.background = ""; }, 250);
        targetBus.emit(targetId, symbolUpper);
      });
      tbody.appendChild(tr);
      rows[sym] = {
        priceCell: tr.querySelector(".wl-price"),
        frCell: tr.querySelector(".wl-fr"),
        oiCell: tr.querySelector(".wl-oi"),
      };
    });

    function formatCompactUsd(v) {
      if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
      if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
      if (v >= 1e3) return "$" + (v / 1e3).toFixed(1) + "K";
      return "$" + v.toFixed(0);
    }

    function renderOi(sym) {
      const s = state[sym];
      if (s.price === null || s.oiQty === null) return;
      rows[sym].oiCell.textContent = formatCompactUsd(s.oiQty * s.price);
    }

    // --- Fiyat (spot miniTicker, coklu sembol tek baglanti) ---
    let priceWs = null;
    let priceRetryMs = 1000;
    let priceHeartbeat = null;
    let stopped = false;

    function connectPrice() {
      if (stopped) return;
      const streams = WATCHLIST_SYMBOLS.map((s) => `${s}@miniTicker`).join("/");
      priceWs = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
      priceWs.onopen = () => { priceRetryMs = 1000; resetPriceHeartbeat(); };
      priceWs.onmessage = (event) => {
        resetPriceHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const d = msg.data;
        if (!d) return;
        const sym = d.s.toLowerCase();
        const s = state[sym];
        if (!s) return;
        const close = parseFloat(d.c);
        const prevPrice = s.price;
        s.price = close;
        rows[sym].priceCell.textContent = close.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 6 });
        if (prevPrice !== null && close !== prevPrice) flashValue(rows[sym].priceCell, close >= prevPrice);
        renderOi(sym);
      };
      priceWs.onclose = () => { clearPriceHeartbeat(); if (!stopped) schedulePriceReconnect(); };
      priceWs.onerror = () => priceWs.close();
    }
    function resetPriceHeartbeat() { clearPriceHeartbeat(); priceHeartbeat = setTimeout(() => priceWs && priceWs.close(), 60000); }
    function clearPriceHeartbeat() { if (priceHeartbeat) { clearTimeout(priceHeartbeat); priceHeartbeat = null; } }
    function schedulePriceReconnect() {
      setTimeout(connectPrice, priceRetryMs);
      priceRetryMs = Math.min(priceRetryMs * 2, 30000);
    }

    // --- Funding Rate (futures markPrice@1s, coklu sembol tek baglanti) ---
    let fundingWs = null;
    let fundingRetryMs = 1000;
    let fundingHeartbeat = null;

    function connectFunding() {
      if (stopped) return;
      const streams = WATCHLIST_SYMBOLS.map((s) => `${s}@markPrice@1s`).join("/");
      fundingWs = new WebSocket(`wss://fstream.binance.com/market/stream?streams=${streams}`);
      fundingWs.onopen = () => { fundingRetryMs = 1000; resetFundingHeartbeat(); };
      fundingWs.onmessage = (event) => {
        resetFundingHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const d = msg.data;
        if (!d || d.r === undefined) return;
        const sym = d.s.toLowerCase();
        const s = state[sym];
        if (!s) return;
        const rate = parseFloat(d.r) * 100;
        const prevRate = s.fundingRate;
        s.fundingRate = rate;
        const cell = rows[sym].frCell;
        cell.textContent = `%${rate.toFixed(4)}`;
        cell.style.color = rate >= 0 ? "var(--up)" : "var(--down)";
        if (prevRate !== null && rate !== prevRate) flashValue(cell, rate >= prevRate);
      };
      fundingWs.onclose = () => { clearFundingHeartbeat(); if (!stopped) scheduleFundingReconnect(); };
      fundingWs.onerror = () => fundingWs.close();
    }
    function resetFundingHeartbeat() { clearFundingHeartbeat(); fundingHeartbeat = setTimeout(() => fundingWs && fundingWs.close(), 60000); }
    function clearFundingHeartbeat() { if (fundingHeartbeat) { clearTimeout(fundingHeartbeat); fundingHeartbeat = null; } }
    function scheduleFundingReconnect() {
      setTimeout(connectFunding, fundingRetryMs);
      fundingRetryMs = Math.min(fundingRetryMs * 2, 30000);
    }

    // --- Open Interest (REST polling - Binance'de canli push stream yok) ---
    let oiPollTimer = null;
    async function pollOpenInterest() {
      try {
        const results = await Promise.all(
          WATCHLIST_SYMBOLS.map(async (sym) => {
            try {
              const res = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${sym.toUpperCase()}`);
              if (!res.ok) throw new Error("HTTP " + res.status);
              const data = await res.json();
              return { sym, oi: parseFloat(data.openInterest) };
            } catch (e) {
              console.error(`[Watchlist] ${sym.toUpperCase()} OI alinamadi:`, e.message);
              return null;
            }
          })
        );
        results.forEach((r) => {
          if (!r) return;
          state[r.sym].oiQty = r.oi;
          renderOi(r.sym);
        });
      } catch (e) { /* bireysel hatalar zaten yukarida yakalandi */ }
    }
    function startOiPolling() {
      pollOpenInterest();
      oiPollTimer = setInterval(pollOpenInterest, 10000);
    }

    connectPrice();
    connectFunding();
    startOiPolling();

    panelInstances[id] = {
      destroy() {
        stopped = true;
        clearPriceHeartbeat();
        clearFundingHeartbeat();
        if (priceWs) priceWs.close();
        if (fundingWs) fundingWs.close();
        if (oiPollTimer) clearInterval(oiPollTimer);
      },
    };

    return item;
  }

  // =====================================================================
  // GRAFIK PANELI
  // =====================================================================
  function createChartPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let interval = (panelsMeta[id] && panelsMeta[id].interval) || "1m";
    if (panelsMeta[id]) panelsMeta[id].interval = interval; // eski sahnelerde alan yoksa varsayilanla doldur
    let targetId = null;
    let generation = 0;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · ${interval}`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);
    body.style.display = "flex";
    body.style.flexDirection = "column";
    body.style.overflow = "hidden";

    // --- Zaman dilimi (timeframe) secici ---
    const TIMEFRAMES = [
      { label: "1m", value: "1m" },
      { label: "5m", value: "5m" },
      { label: "15m", value: "15m" },
      { label: "1h", value: "1h" },
      { label: "4h", value: "4h" },
      { label: "1D", value: "1d" },
    ];
    const tfBar = document.createElement("div");
    tfBar.className = "chart-tf-bar";
    const tfButtons = TIMEFRAMES.map((tf) => {
      const btn = document.createElement("button");
      btn.className = "chart-tf-btn" + (tf.value === interval ? " active" : "");
      btn.textContent = tf.label;
      btn.dataset.value = tf.value;
      btn.addEventListener("click", () => changeInterval(tf.value));
      tfBar.appendChild(btn);
      return btn;
    });
    body.appendChild(tfBar);

    const chartArea = document.createElement("div");
    chartArea.style.position = "relative";
    chartArea.style.flex = "1";
    chartArea.style.minHeight = "0";
    body.appendChild(chartArea);

    const container = document.createElement("div");
    container.className = "chart-container";
    const initMsg = document.createElement("div");
    initMsg.className = "chart-init-msg";
    initMsg.textContent = "geçmiş veriler yükleniyor...";
    container.appendChild(initMsg);
    chartArea.appendChild(container);

    const chart = LightweightCharts.createChart(container, {
      layout: {
        background: { type: "solid", color: "transparent" },
        textColor: "#7c8699",
        fontFamily: "'IBM Plex Mono', monospace",
        fontSize: 11,
      },
      grid: { vertLines: { color: "#151b28" }, horzLines: { color: "#151b28" } },
      rightPriceScale: { borderColor: "#1e2634" },
      timeScale: { borderColor: "#1e2634", timeVisible: true, secondsVisible: false },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        horzLine: {
          labelVisible: true,
          color: "#7c8699",
          labelBackgroundColor: "#1e2634",
        },
        vertLine: {
          color: "#7c8699",
          labelBackgroundColor: "#1e2634",
        },
      },
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
      wickUpColor: "#26a69a", wickDownColor: "#ef5350",
    });

    const resizeObserver = new ResizeObserver((entries) => {
      const { width, height } = entries[0].contentRect;
      if (width > 0 && height > 0) {
        chart.resize(width, height);
        drawCanvas.width = width;
        drawCanvas.height = height;
      }
    });
    resizeObserver.observe(container);

    // =====================================================================
    // CIZIM ARAC CUBUGU VE CANVAS KATMANI
    // =====================================================================
    const drawCanvas = document.createElement("canvas");
    drawCanvas.className = "draw-canvas";
    chartArea.appendChild(drawCanvas);
    const dctx = drawCanvas.getContext("2d");

    const drawToolbar = document.createElement("div");
    drawToolbar.className = "draw-toolbar";
    const toolButtons = {};
    DRAW_TOOLS.forEach((tool, i) => {
      if (i === 1 || i === 7 || i === 9) { // gruplar arasi ayrac: secim | cizgiler | fib&olcum | pozisyon
        const hr = document.createElement("hr");
        drawToolbar.appendChild(hr);
      }
      const btn = document.createElement("button");
      btn.className = "draw-tool-btn" + (tool.cls ? ` ${tool.cls}` : "") + (tool.id === "select" ? " active" : "");
      btn.textContent = tool.label;
      btn.title = tool.title;
      btn.addEventListener("click", () => setActiveTool(tool.id));
      toolButtons[tool.id] = btn;
      drawToolbar.appendChild(btn);
    });
    const clearHr = document.createElement("hr");
    drawToolbar.appendChild(clearHr);
    const clearBtn = document.createElement("button");
    clearBtn.className = "draw-tool-btn";
    clearBtn.textContent = "🗑";
    clearBtn.title = "Bu semboldeki tüm çizimleri temizle";
    clearBtn.addEventListener("click", () => {
      const shapes = getShapesForSymbol(symbol);
      if (shapes.length === 0) return;
      if (!window.confirm(`${symbol} için ${shapes.length} çizimin tamamını silmek istediğinize emin misiniz?`)) return;
      shapes.length = 0;
      selectedShape = null;
      renderMiniToolbar();
      persistDrawingsStore();
    });
    drawToolbar.appendChild(clearBtn);
    chartArea.appendChild(drawToolbar);

    const miniToolbar = document.createElement("div");
    miniToolbar.className = "draw-mini-toolbar";
    miniToolbar.innerHTML =
      DRAW_COLORS.map((c) => `<button class="draw-color-swatch" data-color="${c}" style="background:${c}"></button>`).join("") +
      `<button class="draw-mini-btn" id="mini-width-btn">Kalınlık</button>` +
      `<button class="draw-mini-btn danger" id="mini-delete-btn">Sil</button>`;
    chartArea.appendChild(miniToolbar);
    miniToolbar.querySelectorAll(".draw-color-swatch").forEach((sw) => {
      sw.addEventListener("click", () => {
        if (!selectedShape) return;
        selectedShape.color = sw.dataset.color;
        persistDrawingsStore();
        renderMiniToolbar();
      });
    });
    miniToolbar.querySelector("#mini-width-btn").addEventListener("click", () => {
      if (!selectedShape) return;
      selectedShape.lineWidth = (selectedShape.lineWidth % 4) + 1;
      persistDrawingsStore();
    });
    miniToolbar.querySelector("#mini-delete-btn").addEventListener("click", () => {
      if (!selectedShape) return;
      const shapes = getShapesForSymbol(symbol);
      const idx = shapes.indexOf(selectedShape);
      if (idx !== -1) shapes.splice(idx, 1);
      persistDrawingsStore();
      selectedShape = null;
      renderMiniToolbar();
    });

    let activeTool = "select";
    let pendingPoints = [];
    let previewPoint = null;
    let selectedShape = null;
    let dragTarget = null; // {shape, kind, index}
    let drawStopped = false;

    function setActiveTool(toolId) {
      activeTool = toolId;
      pendingPoints = [];
      selectedShape = null;
      renderMiniToolbar();
      Object.entries(toolButtons).forEach(([id, btn]) => btn.classList.toggle("active", id === toolId));
      const isDrawing = toolId !== "select";
      // Cizim modunda canvas TUM fare olaylarini yakalar (yanlislikla grafik
      // kaymasin diye). Secim modunda ise varsayilan olarak "none" - fare
      // bir cizimin uzerine gelmedigi surece olaylar seffaf sekilde alttaki
      // grafige gecer, boylece pan/zoom calismaya devam eder. Bir cizimin
      // uzerine gelince mousemove dinleyicisi "auto"ya ceviriyor (asagida).
      drawCanvas.style.pointerEvents = isDrawing ? "auto" : "none";
    }

    function canvasPos(evt) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }

    function H() {
      return {
        width: drawCanvas.width,
        height: drawCanvas.height,
        timeToX: (t) => chart.timeScale().timeToCoordinate(t),
        priceToY: (p) => candleSeries.priceToCoordinate(p),
      };
    }

    function visibleRangeSeconds() {
      const r = chart.timeScale().getVisibleRange();
      if (!r) return 3600;
      return Math.max(60, r.to - r.from);
    }

    // --- Cizim (render) ------------------------------------------------
    function drawOneShape(ctx, shape, h, isSelected) {
      ctx.save();
      ctx.strokeStyle = shape.color;
      ctx.fillStyle = shape.color;
      ctx.lineWidth = shape.lineWidth || 2;
      ctx.font = "10px 'IBM Plex Mono', monospace";
      if (isSelected) { ctx.setLineDash([5, 3]); ctx.lineWidth = (shape.lineWidth || 2) + 1; }

      const pts = shape.points;
      if (shape.type === "hline") {
        const y = h.priceToY(pts[0].price);
        if (y === null) { ctx.restore(); return; }
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(h.width, y); ctx.stroke();
        ctx.fillText(pts[0].price.toLocaleString("en-US", { maximumFractionDigits: 4 }), h.width - 70, y - 4);
      } else if (shape.type === "trendline" || shape.type === "arrow") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (shape.type === "arrow") { ctx.setLineDash([]); drawArrowHead(ctx, x1, y1, x2, y2); }
      } else if (shape.type === "rectangle") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.globalAlpha = 0.15;
        ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        ctx.globalAlpha = 1;
        ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
      } else if (shape.type === "channel") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (pts[2]) {
          const y3 = h.priceToY(pts[2].price);
          if (y3 !== null) {
            const dy = y3 - y1;
            ctx.beginPath(); ctx.moveTo(x1, y1 + dy); ctx.lineTo(x2, y2 + dy); ctx.stroke();
          }
        }
      } else if (shape.type === "fib") {
        const x1 = h.timeToX(pts[0].time), x2 = h.timeToX(pts[1].time);
        if (x1 === null || x2 === null) { ctx.restore(); return; }
        const xMin = Math.min(x1, x2);
        ctx.setLineDash(isSelected ? [5, 3] : []);
        FIB_LEVELS.forEach((lv) => {
          const price = pts[0].price + (pts[1].price - pts[0].price) * lv;
          const y = h.priceToY(price);
          if (y === null) return;
          ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.moveTo(xMin, y); ctx.lineTo(h.width, y); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillText(`${(lv * 100).toFixed(1)}%  ${price.toLocaleString("en-US", { maximumFractionDigits: 2 })}`, xMin + 4, y - 3);
        });
      } else if (shape.type === "measure") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.setLineDash([]);
        const dPrice = pts[1].price - pts[0].price;
        const dPct = (dPrice / pts[0].price) * 100;
        const label = `${dPrice >= 0 ? "+" : ""}${dPrice.toFixed(2)}  (${dPct >= 0 ? "+" : ""}${dPct.toFixed(2)}%)`;
        const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = dPrice >= 0 ? "#26a69a" : "#ef5350";
        ctx.fillRect(midX - tw / 2 - 5, midY - 17, tw + 10, 16);
        ctx.fillStyle = "#0a0e14";
        ctx.fillText(label, midX - tw / 2, midY - 5);
      } else if (shape.type === "label") {
        const x = h.timeToX(pts[0].time), y = h.priceToY(pts[0].price);
        if (x === null || y === null) { ctx.restore(); return; }
        const text = shape.text || "";
        const tw = ctx.measureText(text).width;
        ctx.fillStyle = shape.color;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(x + 6, y - 17, tw + 10, 16);
        ctx.fillStyle = "#0a0e14";
        ctx.fillText(text, x + 11, y - 5);
      } else if (shape.type === "long" || shape.type === "short") {
        const x1 = h.timeToX(pts[0].time);
        const yEntry = h.priceToY(pts[0].price);
        const yTp = h.priceToY(shape.tp);
        const ySl = h.priceToY(shape.sl);
        if ([x1, yEntry, yTp, ySl].some((v) => v === null)) { ctx.restore(); return; }
        const width = shape.widthPx || 120;
        const left = x1;
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#26a69a";
        ctx.fillRect(left, Math.min(yEntry, yTp), width, Math.abs(yEntry - yTp));
        ctx.fillStyle = "#ef5350";
        ctx.fillRect(left, Math.min(yEntry, ySl), width, Math.abs(yEntry - ySl));
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#e6eaf2"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(left, yEntry); ctx.lineTo(left + width, yEntry); ctx.stroke();
        const risk = Math.abs(pts[0].price - shape.sl);
        const reward = Math.abs(shape.tp - pts[0].price);
        const rr = risk ? reward / risk : 0;
        ctx.fillStyle = "#e6eaf2";
        ctx.fillText(`Giriş ${pts[0].price.toFixed(2)}  ·  R:R 1:${rr.toFixed(2)}`, left + 4, Math.min(yEntry, yTp) - 4);
        ctx.fillStyle = "#26a69a"; ctx.fillText(`TP ${shape.tp.toFixed(2)}`, left + 4, Math.min(yEntry, yTp) + 12);
        ctx.fillStyle = "#ef5350"; ctx.fillText(`SL ${shape.sl.toFixed(2)}`, left + 4, Math.max(yEntry, ySl) - 4);
      }
      ctx.restore();
    }

    function render() {
      if (drawStopped) return;
      dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const h = H();
      const shapes = getShapesForSymbol(symbol);
      shapes.forEach((s) => drawOneShape(dctx, s, h, s === selectedShape));

      if (pendingPoints.length > 0 && previewPoint) {
        const previewShape = { ...POINT_SHAPE_DEFAULTS(activeTool), points: [...pendingPoints, previewPoint] };
        dctx.save(); dctx.globalAlpha = 0.6;
        drawOneShape(dctx, previewShape, h, false);
        dctx.restore();
      }
      requestAnimationFrame(render);
    }
    function POINT_SHAPE_DEFAULTS(type) {
      return { type, color: currentColor, lineWidth: currentWidth };
    }

    let currentColor = DRAW_COLORS[0];
    let currentWidth = 2;

    function finalizeShape(shape) {
      getShapesForSymbol(symbol).push(shape);
      persistDrawingsStore();
    }

    // --- Hit-testing ------------------------------------------------------
    function hitTestShape(shape, x, y) {
      const h = H();
      const pts = shape.points;
      const tol = 8;

      // once nokta tutamaclarini kontrol et (surukleme icin)
      for (let i = 0; i < pts.length; i++) {
        const px = h.timeToX(pts[i].time), py = h.priceToY(pts[i].price);
        if (px !== null && py !== null && Math.hypot(x - px, y - py) <= tol) {
          return { kind: "point", index: i };
        }
      }
      if (shape.type === "long" || shape.type === "short") {
        const yEntry = h.priceToY(pts[0].price), yTp = h.priceToY(shape.tp), ySl = h.priceToY(shape.sl);
        if (yEntry !== null && Math.abs(y - yEntry) <= tol) return { kind: "entry" };
        if (yTp !== null && Math.abs(y - yTp) <= tol) return { kind: "tp" };
        if (ySl !== null && Math.abs(y - ySl) <= tol) return { kind: "sl" };
        return null;
      }
      if (shape.type === "hline") {
        const py = h.priceToY(pts[0].price);
        return py !== null && Math.abs(y - py) <= tol ? { kind: "point", index: 0 } : null;
      }
      if (shape.type === "trendline" || shape.type === "arrow" || shape.type === "measure") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) return null;
        return distToSegment(x, y, x1, y1, x2, y2) <= tol ? { kind: "body" } : null;
      }
      if (shape.type === "rectangle") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) return null;
        const inX = x >= Math.min(x1, x2) - tol && x <= Math.max(x1, x2) + tol;
        const inY = y >= Math.min(y1, y2) - tol && y <= Math.max(y1, y2) + tol;
        return inX && inY ? { kind: "body" } : null;
      }
      if (shape.type === "channel" || shape.type === "fib") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) return null;
        return distToSegment(x, y, x1, y1, x2, y2) <= tol ? { kind: "body" } : null;
      }
      if (shape.type === "label") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        if (x1 === null || y1 === null) return null;
        return (x >= x1 - tol && x <= x1 + 120 && y >= y1 - 20 && y <= y1 + tol) ? { kind: "body" } : null;
      }
      return null;
    }

    function hitTestAll(x, y) {
      const shapes = getShapesForSymbol(symbol);
      for (let i = shapes.length - 1; i >= 0; i--) {
        const res = hitTestShape(shapes[i], x, y);
        if (res) return { shape: shapes[i], ...res };
      }
      return null;
    }

    function renderMiniToolbar() {
      if (!selectedShape) { miniToolbar.classList.remove("visible"); return; }
      const h = H();
      const p = selectedShape.points[0];
      const x = h.timeToX(p.time), y = h.priceToY(p.price);
      if (x === null || y === null) { miniToolbar.classList.remove("visible"); return; }
      miniToolbar.style.left = Math.min(x, h.width - 180) + "px";
      miniToolbar.style.top = Math.max(0, y - 40) + "px";
      miniToolbar.classList.add("visible");
      miniToolbar.querySelectorAll(".draw-color-swatch").forEach((sw) => {
        sw.classList.toggle("selected", sw.dataset.color === selectedShape.color);
      });
    }

    // --- Fare olaylari ------------------------------------------------------
    // NOT: mousemove dinleyicisi CANVAS'a degil chartArea'ya bagli - cunku
    // sec modunda canvas'in pointer-events'i "none" oldugunda olaylar dogrudan
    // alttaki grafige gidiyor (grafik boylece serbestce kaydirilip
    // yakinlastirilabiliyor), ama olay yine de DOM agacinda yukari (bubbling)
    // chartArea'ya kadar ulasiyor. Fare bir cizimin uzerine geldiginde canvas'i
    // aninda "auto" yapiyoruz ki bir sonraki mousedown/click canvas'a gitsin;
    // uzaklasinca tekrar "none" yapip grafigi serbest birakiyoruz.
    chartArea.addEventListener("mousemove", (evt) => {
      if (evt.target.closest(".draw-mini-toolbar, .draw-toolbar")) return;
      const rect = chartArea.getBoundingClientRect();
      const x = evt.clientX - rect.left, y = evt.clientY - rect.top;

      if (pendingPoints.length > 0) {
        const time = chart.timeScale().coordinateToTime(x);
        const price = candleSeries.coordinateToPrice(y);
        if (time !== null && price !== null) previewPoint = { time, price };
      }

      if (dragTarget) {
        const time = chart.timeScale().coordinateToTime(x);
        const price = candleSeries.coordinateToPrice(y);
        if (time === null || price === null) return;
        const s = dragTarget.shape;
        if (dragTarget.kind === "point") s.points[dragTarget.index] = { time, price };
        else if (dragTarget.kind === "tp") s.tp = price;
        else if (dragTarget.kind === "sl") s.sl = price;
        else if (dragTarget.kind === "entry") {
          s.points[0] = { time, price };
        } else if (dragTarget.kind === "body") {
          const dPrice = price - dragTarget.startPrice;
          const dTime = time - dragTarget.startTime;
          s.points = dragTarget.origPoints.map((pt) => ({ time: pt.time + dTime, price: pt.price + dPrice }));
        }
        return;
      }

      if (activeTool === "select") {
        const hit = hitTestAll(x, y);
        drawCanvas.style.pointerEvents = hit ? "auto" : "none";
        drawCanvas.style.cursor = hit ? (hit.kind === "body" || hit.kind === "entry" ? "move" : "pointer") : "default";
      }
    });

    chartArea.addEventListener("mousedown", (evt) => {
      if (activeTool !== "select") return;
      // Mini arac cubugu veya sol dikey arac cubugu uzerindeki bir
      // tiklama (orn. "Sil" butonu) buraya bubbling ile sizmasin - yoksa
      // secim aninda sifirlanip butonun kendi click'i bosa cikiyordu.
      if (evt.target.closest(".draw-mini-toolbar, .draw-toolbar")) return;
      const rect = chartArea.getBoundingClientRect();
      const x = evt.clientX - rect.left, y = evt.clientY - rect.top;
      const hit = hitTestAll(x, y);
      if (!hit) { selectedShape = null; renderMiniToolbar(); return; }
      // Bir cizime tam isabet ettik: grafigin bu surukleme boyunca pan/zoom
      // yapmasini engellemek icin canvas'i hemen "auto" yapiyoruz - onceki
      // mousemove'un bunu zaten yapmis olmasina guvenmiyoruz (hizli
      // tiklamalarda o sira kacabiliyordu).
      drawCanvas.style.pointerEvents = "auto";
      evt.preventDefault();
      selectedShape = hit.shape;
      renderMiniToolbar();
      if (hit.kind === "body") {
        const time = chart.timeScale().coordinateToTime(x);
        const price = candleSeries.coordinateToPrice(y);
        dragTarget = { shape: hit.shape, kind: "body", startTime: time, startPrice: price, origPoints: hit.shape.points.map((p) => ({ ...p })) };
      } else {
        dragTarget = { shape: hit.shape, kind: hit.kind, index: hit.index };
      }
    });

    window.addEventListener("mouseup", () => {
      if (dragTarget) {
        persistDrawingsStore();
        dragTarget = null;
        renderMiniToolbar();
        // surukleme bittiginde fare artik cizimin uzerinde olmayabilir;
        // grafigi tekrar serbest birakmak icin sonraki mousemove karar verecek.
        if (activeTool === "select") drawCanvas.style.pointerEvents = "none";
      }
    });

    drawCanvas.addEventListener("click", (evt) => {
      if (activeTool === "select" || dragTarget) return;
      const { x, y } = canvasPos(evt);
      const time = chart.timeScale().coordinateToTime(x);
      const price = candleSeries.coordinateToPrice(y);
      if (time === null || price === null) return;

      if (activeTool === "label") {
        const text = window.prompt("Etiket metni:", "Not");
        if (text === null) return;
        finalizeShape({ type: "label", points: [{ time, price }], text, color: currentColor, lineWidth: currentWidth });
        setActiveTool("select");
        return;
      }
      if (activeTool === "long" || activeTool === "short") {
        const isLong = activeTool === "long";
        finalizeShape({
          type: activeTool,
          points: [{ time, price }],
          tp: price * (isLong ? 1.02 : 0.98),
          sl: price * (isLong ? 0.99 : 1.01),
          widthPx: drawCanvas.width * 0.18,
          color: isLong ? "#26a69a" : "#ef5350",
          lineWidth: currentWidth,
        });
        setActiveTool("select");
        return;
      }

      pendingPoints.push({ time, price });
      const needed = POINTS_NEEDED[activeTool];
      if (pendingPoints.length >= needed) {
        finalizeShape({ type: activeTool, points: [...pendingPoints], color: currentColor, lineWidth: currentWidth });
        pendingPoints = [];
        previewPoint = null;
        setActiveTool("select");
      }
    });

    // Baslangicta sec modundayiz: canvas seffaf (pointer-events: none), grafik
    // serbestce kaydirilip yakinlastirilabilir. Fare bir cizimin uzerine
    // geldiginde yukaridaki chartArea mousemove dinleyicisi "auto"ya cevirir.
    drawCanvas.style.pointerEvents = "none";

    requestAnimationFrame(render);

    let lastClose = null;
    function updateTitlePrice(close) {
      const color = lastClose !== null && close < lastClose ? "var(--down)" : "var(--up)";
      titleEl.innerHTML = `${symbol} · ${interval} <span class="chart-price-tag" style="color:${color}">${close.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>`;
      lastClose = close;
    }

    async function loadInitialData() {
      const mySymbol = symbol;
      const myInterval = interval;
      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${mySymbol}&interval=${myInterval}&limit=1000`);
        if (!res.ok) throw new Error("REST hatasi: " + res.status);
        const raw = await res.json();
        if (mySymbol !== symbol || myInterval !== interval) return; // bu sirada sembol/periyot tekrar degismis olabilir
        const candles = raw.map((d) => ({
          time: d[0] / 1000,
          open: parseFloat(d[1]), high: parseFloat(d[2]),
          low: parseFloat(d[3]), close: parseFloat(d[4]),
        }));
        candleSeries.setData(candles);
        chart.timeScale().fitContent();
        updateTitlePrice(candles[candles.length - 1].close);
        initMsg.remove();
      } catch (err) {
        if (mySymbol !== symbol || myInterval !== interval) return;
        initMsg.textContent = "geçmiş veri yüklenemedi, yeniden deneniyor...";
        setTimeout(() => { if (mySymbol === symbol && myInterval === interval) loadInitialData(); }, 3000);
      }
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      const myInterval = interval;
      ws = new WebSocket(`wss://stream.binance.com:9443/ws/${mySymbol.toLowerCase()}@kline_${myInterval}`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        const k = msg.k;
        if (!k) return;
        const candle = {
          time: k.t / 1000,
          open: parseFloat(k.o), high: parseFloat(k.h),
          low: parseFloat(k.l), close: parseFloat(k.c),
        };
        candleSeries.update(candle);
        updateTitlePrice(candle.close);
      };
      ws.onclose = () => {
        clearHeartbeat();
