    });

    let activeTool = "select";
    let pendingPoints = [];
    let previewPoint = null;
    let selectedShape = null;
    let dragTarget = null; // {shape, kind, index}
    let drawStopped = false;

    function setActiveTool(toolId) {
      activeTool = toolId;
      pendingPoints = [];
      selectedShape = null;
      renderMiniToolbar();
      Object.entries(toolButtons).forEach(([id, btn]) => btn.classList.toggle("active", id === toolId));
      const isDrawing = toolId !== "select";
      // Cizim modunda canvas TUM fare olaylarini yakalar (yanlislikla grafik
      // kaymasin diye). Secim modunda ise varsayilan olarak "none" - fare
      // bir cizimin uzerine gelmedigi surece olaylar seffaf sekilde alttaki
      // grafige gecer, boylece pan/zoom calismaya devam eder. Bir cizimin
      // uzerine gelince mousemove dinleyicisi "auto"ya ceviriyor (asagida).
      drawCanvas.style.pointerEvents = isDrawing ? "auto" : "none";
    }

    function canvasPos(evt) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }

    function barIntervalSec() {
      const map = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400 };
      return map[interval] || 60;
    }

    function logicalFromTime(t) {
      if (!rawCandles.length || t == null || !isFinite(t)) return null;
      const lastIdx = rawCandles.length - 1;
      const lastT = rawCandles[lastIdx].time;
      if (t >= lastT) return lastIdx + (t - lastT) / barIntervalSec();
      if (t <= rawCandles[0].time) return 0;
      let lo = 0, hi = lastIdx;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (rawCandles[mid].time <= t) lo = mid;
        else hi = mid;
      }
      const span = (rawCandles[hi].time - rawCandles[lo].time) || barIntervalSec();
      return lo + (t - rawCandles[lo].time) / span;
    }

    function timeFromLogical(logical) {
      if (!rawCandles.length || logical == null || !isFinite(logical)) return null;
      const lastIdx = rawCandles.length - 1;
      if (logical >= lastIdx) return rawCandles[lastIdx].time + (logical - lastIdx) * barIntervalSec();
      if (logical <= 0) return rawCandles[0].time;
      const i = Math.floor(logical);
      const frac = logical - i;
      const a = rawCandles[i];
      const b = rawCandles[Math.min(i + 1, lastIdx)];
      return a.time + (b.time - a.time) * frac;
    }

    function normalizeChartTime(t) {
      if (t == null) return null;
      if (typeof t === "number" && isFinite(t)) return t;
      if (typeof t === "object" && t.year) return Date.UTC(t.year, t.month - 1, t.day) / 1000;
      return null;
    }

    function pointToX(pt) {
      if (!pt) return null;
      const ts = chart.timeScale();
      if (pt.time != null) {
        const x = ts.timeToCoordinate(pt.time);
        if (x != null) return x;
      }
      const logical = pt.logical != null && isFinite(pt.logical) ? pt.logical : logicalFromTime(pt.time);
      if (logical == null) return null;
      return ts.logicalToCoordinate(logical);
    }

    function xyToPoint(x, y) {
      const price = candleSeries.coordinateToPrice(y);
      if (price == null) return null;
      const ts = chart.timeScale();
      const logical = ts.coordinateToLogical(x);
      let time = normalizeChartTime(ts.coordinateToTime(x));
      if (time == null && logical != null) time = timeFromLogical(logical);
      if (time == null) return null;
      return { time, price, logical: logical != null ? logical : logicalFromTime(time) };
    }

    function H() {
      return {
        width: drawCanvas.width,
        height: drawCanvas.height,
        timeToX: (t) => pointToX(typeof t === "object" && t && t.time != null ? t : { time: t }),
        priceToY: (p) => candleSeries.priceToCoordinate(p),
      };
    }

    function visibleRangeSeconds() {
      const r = chart.timeScale().getVisibleRange();
      if (!r) return 3600;
      return Math.max(60, r.to - r.from);
    }

    // --- Cizim (render) ------------------------------------------------
    function drawOneShape(ctx, shape, h, isSelected) {
      ctx.save();
      ctx.strokeStyle = shape.color;
      ctx.fillStyle = shape.color;
      ctx.lineWidth = shape.lineWidth || 2;
      ctx.font = "10px 'IBM Plex Mono', monospace";
      if (isSelected) { ctx.setLineDash([5, 3]); ctx.lineWidth = (shape.lineWidth || 2) + 1; }

      const pts = shape.points;
      if (shape.type === "hline") {
        const y = h.priceToY(pts[0].price);
        if (y === null) { ctx.restore(); return; }
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(h.width, y); ctx.stroke();
        ctx.fillText(pts[0].price.toLocaleString("en-US", { maximumFractionDigits: 4 }), h.width - 70, y - 4);
      } else if (shape.type === "trendline" || shape.type === "arrow") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (shape.type === "arrow") { ctx.setLineDash([]); drawArrowHead(ctx, x1, y1, x2, y2); }
      } else if (shape.type === "rectangle") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.globalAlpha = 0.15;
        ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        ctx.globalAlpha = 1;
        ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
      } else if (shape.type === "channel") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (pts[2]) {
          const y3 = h.priceToY(pts[2].price);
          if (y3 !== null) {
            const dy = y3 - y1;
            ctx.beginPath(); ctx.moveTo(x1, y1 + dy); ctx.lineTo(x2, y2 + dy); ctx.stroke();
          }
        }
      } else if (shape.type === "fib") {
        const x1 = h.timeToX(pts[0].time), x2 = h.timeToX(pts[1].time);
        if (x1 === null || x2 === null) { ctx.restore(); return; }
        const xMin = Math.min(x1, x2);
        ctx.setLineDash(isSelected ? [5, 3] : []);
        FIB_LEVELS.forEach((lv) => {
          const price = pts[0].price + (pts[1].price - pts[0].price) * lv;
          const y = h.priceToY(price);
          if (y === null) return;
          ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.moveTo(xMin, y); ctx.lineTo(h.width, y); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillText(`${(lv * 100).toFixed(1)}%  ${price.toLocaleString("en-US", { maximumFractionDigits: 2 })}`, xMin + 4, y - 3);
        });
      } else if (shape.type === "measure") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) { ctx.restore(); return; }
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.setLineDash([]);
        const dPrice = pts[1].price - pts[0].price;
        const dPct = (dPrice / pts[0].price) * 100;
        const label = `${dPrice >= 0 ? "+" : ""}${dPrice.toFixed(2)}  (${dPct >= 0 ? "+" : ""}${dPct.toFixed(2)}%)`;
        const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = dPrice >= 0 ? "#26a69a" : "#ef5350";
        ctx.fillRect(midX - tw / 2 - 5, midY - 17, tw + 10, 16);
        ctx.fillStyle = "#0a0e14";
        ctx.fillText(label, midX - tw / 2, midY - 5);
      } else if (shape.type === "label") {
        const x = h.timeToX(pts[0].time), y = h.priceToY(pts[0].price);
        if (x === null || y === null) { ctx.restore(); return; }
        const text = shape.text || "";
        const tw = ctx.measureText(text).width;
        ctx.fillStyle = shape.color;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(x + 6, y - 17, tw + 10, 16);
        ctx.fillStyle = "#0a0e14";
        ctx.fillText(text, x + 11, y - 5);
      } else if (shape.type === "long" || shape.type === "short") {
        const x1 = h.timeToX(pts[0].time);
        const yEntry = h.priceToY(pts[0].price);
        const yTp = h.priceToY(shape.tp);
        const ySl = h.priceToY(shape.sl);
        if ([x1, yEntry, yTp, ySl].some((v) => v === null)) { ctx.restore(); return; }
        const width = shape.widthPx || 120;
        const left = x1;
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#26a69a";
        ctx.fillRect(left, Math.min(yEntry, yTp), width, Math.abs(yEntry - yTp));
        ctx.fillStyle = "#ef5350";
        ctx.fillRect(left, Math.min(yEntry, ySl), width, Math.abs(yEntry - ySl));
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#e6eaf2"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(left, yEntry); ctx.lineTo(left + width, yEntry); ctx.stroke();
        const risk = Math.abs(pts[0].price - shape.sl);
        const reward = Math.abs(shape.tp - pts[0].price);
        const rr = risk ? reward / risk : 0;
        ctx.fillStyle = "#e6eaf2";
        ctx.fillText(`Giriş ${pts[0].price.toFixed(2)}  ·  R:R 1:${rr.toFixed(2)}`, left + 4, Math.min(yEntry, yTp) - 4);
        ctx.fillStyle = "#26a69a"; ctx.fillText(`TP ${shape.tp.toFixed(2)}`, left + 4, Math.min(yEntry, yTp) + 12);
        ctx.fillStyle = "#ef5350"; ctx.fillText(`SL ${shape.sl.toFixed(2)}`, left + 4, Math.max(yEntry, ySl) - 4);
      }
      ctx.restore();
    }

    function render() {
      if (drawStopped) return;
      dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const h = H();
      const shapes = getShapesForSymbol(symbol);
      shapes.forEach((s) => drawOneShape(dctx, s, h, s === selectedShape));

      if (pendingPoints.length > 0 && previewPoint) {
        const previewShape = { ...POINT_SHAPE_DEFAULTS(activeTool), points: [...pendingPoints, previewPoint] };
        dctx.save(); dctx.globalAlpha = 0.6;
        drawOneShape(dctx, previewShape, h, false);
        dctx.restore();
      }
      requestAnimationFrame(render);
    }
    function POINT_SHAPE_DEFAULTS(type) {
      return { type, color: currentColor, lineWidth: currentWidth };
    }

    let currentColor = DRAW_COLORS[0];
    let currentWidth = 2;

    function finalizeShape(shape) {
      getShapesForSymbol(symbol).push(shape);
      persistDrawingsStore();
    }

    // --- Hit-testing ------------------------------------------------------
    function hitTestShape(shape, x, y) {
      const h = H();
      const pts = shape.points;
      const tol = 8;

      // once nokta tutamaclarini kontrol et (surukleme icin)
      for (let i = 0; i < pts.length; i++) {
        const px = h.timeToX(pts[i].time), py = h.priceToY(pts[i].price);
        if (px !== null && py !== null && Math.hypot(x - px, y - py) <= tol) {
          return { kind: "point", index: i };
        }
      }
      if (shape.type === "long" || shape.type === "short") {
        const yEntry = h.priceToY(pts[0].price), yTp = h.priceToY(shape.tp), ySl = h.priceToY(shape.sl);
        if (yEntry !== null && Math.abs(y - yEntry) <= tol) return { kind: "entry" };
        if (yTp !== null && Math.abs(y - yTp) <= tol) return { kind: "tp" };
        if (ySl !== null && Math.abs(y - ySl) <= tol) return { kind: "sl" };
        return null;
      }
      if (shape.type === "hline") {
        const py = h.priceToY(pts[0].price);
        return py !== null && Math.abs(y - py) <= tol ? { kind: "point", index: 0 } : null;
      }
      if (shape.type === "trendline" || shape.type === "arrow" || shape.type === "measure") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) return null;
        return distToSegment(x, y, x1, y1, x2, y2) <= tol ? { kind: "body" } : null;
      }
      if (shape.type === "rectangle") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) return null;
        const inX = x >= Math.min(x1, x2) - tol && x <= Math.max(x1, x2) + tol;
        const inY = y >= Math.min(y1, y2) - tol && y <= Math.max(y1, y2) + tol;
        return inX && inY ? { kind: "body" } : null;
      }
      if (shape.type === "channel" || shape.type === "fib") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        const x2 = h.timeToX(pts[1].time), y2 = h.priceToY(pts[1].price);
        if ([x1, y1, x2, y2].some((v) => v === null)) return null;
        return distToSegment(x, y, x1, y1, x2, y2) <= tol ? { kind: "body" } : null;
      }
      if (shape.type === "label") {
        const x1 = h.timeToX(pts[0].time), y1 = h.priceToY(pts[0].price);
        if (x1 === null || y1 === null) return null;
        return (x >= x1 - tol && x <= x1 + 120 && y >= y1 - 20 && y <= y1 + tol) ? { kind: "body" } : null;
      }
      return null;
    }

    function hitTestAll(x, y) {
      const shapes = getShapesForSymbol(symbol);
      for (let i = shapes.length - 1; i >= 0; i--) {
        const res = hitTestShape(shapes[i], x, y);
        if (res) return { shape: shapes[i], ...res };
      }
      return null;
    }

    function renderMiniToolbar() {
      if (!selectedShape) { miniToolbar.classList.remove("visible"); return; }
      const h = H();
      const p = selectedShape.points[0];
      const x = h.timeToX(p.time), y = h.priceToY(p.price);
      if (x === null || y === null) { miniToolbar.classList.remove("visible"); return; }
      miniToolbar.style.left = Math.min(x, h.width - 180) + "px";
      miniToolbar.style.top = Math.max(0, y - 40) + "px";
      miniToolbar.classList.add("visible");
      miniToolbar.querySelectorAll(".draw-color-swatch").forEach((sw) => {
        sw.classList.toggle("selected", sw.dataset.color === selectedShape.color);
      });
    }

    // --- Fare olaylari ------------------------------------------------------
    // NOT: mousemove dinleyicisi CANVAS'a degil chartArea'ya bagli - cunku
    // sec modunda canvas'in pointer-events'i "none" oldugunda olaylar dogrudan
    // alttaki grafige gidiyor (grafik boylece serbestce kaydirilip
    // yakinlastirilabiliyor), ama olay yine de DOM agacinda yukari (bubbling)
    // chartArea'ya kadar ulasiyor. Fare bir cizimin uzerine geldiginde canvas'i
    // aninda "auto" yapiyoruz ki bir sonraki mousedown/click canvas'a gitsin;
    // uzaklasinca tekrar "none" yapip grafigi serbest birakiyoruz.
    chartArea.addEventListener("mousemove", (evt) => {
      if (evt.target.closest(".draw-mini-toolbar, .draw-toolbar")) return;
      const rect = chartArea.getBoundingClientRect();
      const x = evt.clientX - rect.left, y = evt.clientY - rect.top;

      if (pendingPoints.length > 0) {
        const p = xyToPoint(x, y);
        if (p) previewPoint = p;
      }

      if (dragTarget) {
        const p = xyToPoint(x, y);
        if (!p) return;
        const s = dragTarget.shape;
        if (dragTarget.kind === "point") s.points[dragTarget.index] = p;
        else if (dragTarget.kind === "tp") s.tp = p.price;
        else if (dragTarget.kind === "sl") s.sl = p.price;
        else if (dragTarget.kind === "entry") {
          s.points[0] = p;
        } else if (dragTarget.kind === "body") {
          const dPrice = p.price - dragTarget.startPrice;
          const dTime = p.time - dragTarget.startTime;
          const dLogical = (p.logical || 0) - (dragTarget.startLogical || 0);
          s.points = dragTarget.origPoints.map((pt) => ({
            time: pt.time + dTime,
            price: pt.price + dPrice,
            logical: (pt.logical != null ? pt.logical : logicalFromTime(pt.time)) + dLogical,
          }));
        }
        return;
      }

      if (activeTool === "select") {
        const hit = hitTestAll(x, y);
        drawCanvas.style.pointerEvents = hit ? "auto" : "none";
        drawCanvas.style.cursor = hit ? (hit.kind === "body" || hit.kind === "entry" ? "move" : "pointer") : "default";
      }
    });

    chartArea.addEventListener("mousedown", (evt) => {
      if (activeTool !== "select") return;
      // Mini arac cubugu veya sol dikey arac cubugu uzerindeki bir
      // tiklama (orn. "Sil" butonu) buraya bubbling ile sizmasin - yoksa
      // secim aninda sifirlanip butonun kendi click'i bosa cikiyordu.
      if (evt.target.closest(".draw-mini-toolbar, .draw-toolbar")) return;
      const rect = chartArea.getBoundingClientRect();
      const x = evt.clientX - rect.left, y = evt.clientY - rect.top;
      const hit = hitTestAll(x, y);
      if (!hit) { selectedShape = null; renderMiniToolbar(); return; }
      // Bir cizime tam isabet ettik: grafigin bu surukleme boyunca pan/zoom
      // yapmasini engellemek icin canvas'i hemen "auto" yapiyoruz - onceki
      // mousemove'un bunu zaten yapmis olmasina guvenmiyoruz (hizli
      // tiklamalarda o sira kacabiliyordu).
      drawCanvas.style.pointerEvents = "auto";
      evt.preventDefault();
      selectedShape = hit.shape;
      renderMiniToolbar();
      if (hit.kind === "body") {
        const p = xyToPoint(x, y);
        if (!p) return;
        dragTarget = { shape: hit.shape, kind: "body", startTime: p.time, startPrice: p.price, startLogical: p.logical, origPoints: hit.shape.points.map((pt) => ({ ...pt })) };
      } else {
        dragTarget = { shape: hit.shape, kind: hit.kind, index: hit.index };
      }
    });

    window.addEventListener("mouseup", () => {
      if (dragTarget) {
        persistDrawingsStore();
        dragTarget = null;
        renderMiniToolbar();
        // surukleme bittiginde fare artik cizimin uzerinde olmayabilir;
        // grafigi tekrar serbest birakmak icin sonraki mousemove karar verecek.
        if (activeTool === "select") drawCanvas.style.pointerEvents = "none";
      }
    });

    drawCanvas.addEventListener("click", (evt) => {
      if (activeTool === "select" || dragTarget) return;
      const { x, y } = canvasPos(evt);
      const p = xyToPoint(x, y);
      if (!p) return;

      if (activeTool === "label") {
        const text = window.prompt("Etiket metni:", "Not");
        if (text === null) return;
        finalizeShape({ type: "label", points: [p], text, color: currentColor, lineWidth: currentWidth });
        setActiveTool("select");
        return;
      }
      if (activeTool === "long" || activeTool === "short") {
        const isLong = activeTool === "long";
        finalizeShape({
          type: activeTool,
          points: [p],
          tp: p.price * (isLong ? 1.02 : 0.98),
          sl: p.price * (isLong ? 0.99 : 1.01),
          widthPx: drawCanvas.width * 0.18,
          color: isLong ? "#26a69a" : "#ef5350",
          lineWidth: currentWidth,
        });
        setActiveTool("select");
        return;
      }

      pendingPoints.push(p);
      const needed = POINTS_NEEDED[activeTool];
      if (pendingPoints.length >= needed) {
        finalizeShape({ type: activeTool, points: [...pendingPoints], color: currentColor, lineWidth: currentWidth });
        pendingPoints = [];
        previewPoint = null;
        setActiveTool("select");
      }
    });

    // Baslangicta sec modundayiz: canvas seffaf (pointer-events: none), grafik
    // serbestce kaydirilip yakinlastirilabilir. Fare bir cizimin uzerine
    // geldiginde yukaridaki chartArea mousemove dinleyicisi "auto"ya cevirir.
    drawCanvas.style.pointerEvents = "none";

    requestAnimationFrame(render);

    let lastClose = null;
    let haMode = false;
    let rawCandles = []; // her zaman HAM (normal) mumlar - HA bundan hesaplanir
    let lastHaReversalTime = null; // ayni mum icin tekrar bildirim gondermemek icin

    function computeHeikinAshi(raw) {
      const out = [];
      let prevOpen = null, prevClose = null;
      raw.forEach((c) => {
        const haClose = (c.open + c.high + c.low + c.close) / 4;
        const haOpen = prevOpen === null ? (c.open + c.close) / 2 : (prevOpen + prevClose) / 2;
        const haHigh = Math.max(c.high, haOpen, haClose);
        const haLow = Math.min(c.low, haOpen, haClose);
        out.push({ time: c.time, open: haOpen, high: haHigh, low: haLow, close: haClose });
        prevOpen = haOpen; prevClose = haClose;
      });
      return out;
    }

    function checkReversalConfirmation(haArray) {
      if (!haMode || haArray.length < 2) return;
      const entry = marketScanner.bySymbol[symbol.toLowerCase()];
      if (!entry || entry.extremeLevel === 0 || !entry.oiDivergence) return;
      const last = haArray[haArray.length - 1];
      const prev = haArray[haArray.length - 2];
      const lastRed = last.close < last.open;
      const prevRed = prev.close < prev.open;
      if (lastRed && !prevRed && lastHaReversalTime !== last.time) {
        lastHaReversalTime = last.time;
        const desc = `${symbol} · Ekstrem FR + OI Diverjansı sonrası ilk kırmızı Heikin Ashi mumu kapandı`;
        showToast("Dönüş Teyit Edildi", desc);
        addHistoryEntry("Heikin Ashi Dönüş", desc);
        renderAlertHistory();
        playAlertSound();
      }
    }

    // --- PDH/PDL/PWH/PWL likidasyon temizlik seviyeleri --------------------
    let priceLines = [];
    let liqLevels = { pdh: null, pdl: null, pwh: null, pwl: null };
    let sweptFlags = { pdh: false, pdl: false, pwh: false, pwl: false };
    let chartMarkers = [];

    function clearPriceLines() {
      priceLines.forEach((pl) => { try { candleSeries.removePriceLine(pl); } catch (e) { /* chart zaten kapanmis olabilir */ } });
      priceLines = [];
    }

    function drawLiquidityLevels() {
      clearPriceLines();
      const defs = [
        { price: liqLevels.pdh, color: "#ef5350", title: "PDH" },
        { price: liqLevels.pdl, color: "#26a69a", title: "PDL" },
        { price: liqLevels.pwh, color: "#ff9f43", title: "PWH" },
        { price: liqLevels.pwl, color: "#4fc3f7", title: "PWL" },
      ];
      defs.forEach((d) => {
        if (d.price === null) return;
        const line = candleSeries.createPriceLine({
          price: d.price,
          color: d.color,
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: d.title,
        });
        priceLines.push(line);
      });
    }

    // PDH/PDL/PWH/PWL sadece SEMBOLE bagli (takvim gunu/haftasi), grafigin
    // kendi zaman dilimi (1m/1h/...) secimiyle ilgisiz - o yuzden sadece
    // sembol degisince yeniden cekilir, interval degisince degil.
    async function loadLiquidityLevels() {
      const mySymbol = symbol;
      try {
        const [dailyRes, weeklyRes] = await Promise.all([
          fetch(futuresKlinesUrl(mySymbol, "1d", 3)),
          fetch(futuresKlinesUrl(mySymbol, "1w", 3)),
        ]);
        if (!dailyRes.ok || !weeklyRes.ok) throw new Error("REST hatasi");
        const daily = await dailyRes.json();
        const weekly = await weeklyRes.json();
        if (mySymbol !== symbol) return;
        // son eleman bugun/bu hafta icin hala olusuyor olabilir - ondan
        // onceki TAMAMLANMIS gunu/haftayi al (PDH/PDL/PWH/PWL tanimi budur).
        const prevDay = daily.length >= 2 ? daily[daily.length - 2] : null;
        const prevWeek = weekly.length >= 2 ? weekly[weekly.length - 2] : null;
        liqLevels = {
          pdh: prevDay ? parseFloat(prevDay[2]) : null,
          pdl: prevDay ? parseFloat(prevDay[3]) : null,
          pwh: prevWeek ? parseFloat(prevWeek[2]) : null,
          pwl: prevWeek ? parseFloat(prevWeek[3]) : null,
        };
        sweptFlags = { pdh: false, pdl: false, pwh: false, pwl: false };
        drawLiquidityLevels();
      } catch (e) {
        console.error("[Likidite Seviyeleri] PDH/PDL/PWH/PWL alinamadi:", e);
      }
    }

    // Bir mum, seviyeyi ignesiyle (wick) delip KAPANISTA geri donduyse
    // "sweep" (likidasyon temizligi) olarak kabul edilir - klasik stop-avi
    // / likidite toplama paterni.
    function checkLiquiditySweep(candle) {
      const checks = [
        { key: "pdh", swept: liqLevels.pdh !== null && candle.high > liqLevels.pdh && candle.close < liqLevels.pdh, label: "PDH (Önceki Gün Zirvesi)", dir: "down" },
        { key: "pdl", swept: liqLevels.pdl !== null && candle.low < liqLevels.pdl && candle.close > liqLevels.pdl, label: "PDL (Önceki Gün Dibi)", dir: "up" },
        { key: "pwh", swept: liqLevels.pwh !== null && candle.high > liqLevels.pwh && candle.close < liqLevels.pwh, label: "PWH (Önceki Hafta Zirvesi)", dir: "down" },
        { key: "pwl", swept: liqLevels.pwl !== null && candle.low < liqLevels.pwl && candle.close > liqLevels.pwl, label: "PWL (Önceki Hafta Dibi)", dir: "up" },
      ];
      checks.forEach((c) => {
        if (!c.swept || sweptFlags[c.key]) return;
        sweptFlags[c.key] = true;
        const desc = `${symbol} · ${c.label} seviyesi iğnelendi (sweep) ve fiyat içeri döndü`;
        showToast("⚡ Liquidation Swept", desc);
        addHistoryEntry("Likidite Temizliği", desc);
        renderAlertHistory();
        playAlertSound();
        chartMarkers.push({
          time: candle.time,
          position: c.dir === "down" ? "aboveBar" : "belowBar",
          color: c.dir === "down" ? "#ef5350" : "#26a69a",
          shape: c.dir === "down" ? "arrowDown" : "arrowUp",
          text: `⚡ ${c.key.toUpperCase()}`,
        });
        candleSeries.setMarkers(chartMarkers.slice(-30));
      });
    }

    function applyDisplayData() {
      if (rawCandles.length === 0) return;
      if (haMode) {
        const haArray = computeHeikinAshi(rawCandles);
        candleSeries.setData(haArray);
      } else {
        candleSeries.setData(rawCandles);
      }
      chart.timeScale().fitContent();
    }

    function scannerBadgeHtml() {
      const entry = marketScanner.bySymbol[symbol.toLowerCase()];
      const mrow = allMarket.bySymbol[symbol];
      const reasons = [];
      if (entry && entry.extremeLevel > 0) reasons.push("Ekstrem FR");
      if (entry && entry.oiDivergence) reasons.push("OI Diverjansı");
      if (mrow && mrow.divChartHint && mrow.divChartHint.tf === interval) {
        reasons.push(mrow.divChartHint.label);
      } else if (mrow && mrow.divBadge) reasons.push(mrow.divBadge);
      if (!reasons.length) return "";
      return ` <span title="${reasons.join(" · ")}" style="color:#c9a227;">⚠️</span>`;
    }

    function updateTitlePrice(close) {
      const color = lastClose !== null && close < lastClose ? "var(--down)" : "var(--up)";
      titleEl.innerHTML = `${symbol} · ${interval}${haMode ? " · HA" : ""} <span class="chart-price-tag" style="color:${color}">${formatPrice(close)}</span>${scannerBadgeHtml()}`;
      lastClose = close;
    }
    function refreshScannerBadge() { if (lastClose !== null) updateTitlePrice(lastClose); }
    marketScanner.subscribe(refreshScannerBadge);

    async function loadInitialData() {
      const mySymbol = symbol;
      const myInterval = interval;
      try {
        const res = await fetch(futuresKlinesUrl(mySymbol, myInterval, 1000));
        if (!res.ok) throw new Error("REST hatasi: " + res.status);
        const raw = await res.json();
        if (!Array.isArray(raw) || raw.length < 2) throw new Error("mum verisi yok");
        if (mySymbol !== symbol || myInterval !== interval) return; // bu sirada sembol/periyot tekrar degismis olabilir
        const candles = raw.map((d) => ({
          time: d[0] / 1000,
          open: parseFloat(d[1]), high: parseFloat(d[2]),
          low: parseFloat(d[3]), close: parseFloat(d[4]),
        }));
        rawCandles = candles;
        const lastPx = candles[candles.length - 1].close;
        const precision = priceFractionDigits(lastPx);
        candleSeries.applyOptions({
          priceFormat: { type: "price", precision, minMove: Math.pow(10, -precision) },
        });
        applyDisplayData();
        updateTitlePrice(lastPx);
        initMsg.remove();
      } catch (err) {
        if (mySymbol !== symbol || myInterval !== interval) return;
        initMsg.textContent = "geçmiş veri yüklenemedi, yeniden deneniyor...";
        setTimeout(() => { if (mySymbol === symbol && myInterval === interval) loadInitialData(); }, 3000);
      }
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      const myInterval = interval;
      ws = new WebSocket(futuresKlineWsUrl(mySymbol, myInterval));
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        const k = msg.k || (msg.data && msg.data.k);
        if (!k) return;
        const candle = {
          time: k.t / 1000,
          open: parseFloat(k.o), high: parseFloat(k.h),
          low: parseFloat(k.l), close: parseFloat(k.c),
        };

        // rawCandles'i guncel tut: ayni zaman damgasiysa son mumu degistir,
        // yeni bir zaman ise ekle - hem HA hesaplamasi hem sembol/periyot
        // degisiminde dogru gecmis icin bu gerekli.
        const lastRaw = rawCandles[rawCandles.length - 1];
        if (lastRaw && lastRaw.time === candle.time) rawCandles[rawCandles.length - 1] = candle;
        else rawCandles.push(candle);
        if (rawCandles.length > 1500) rawCandles.shift();

        if (haMode) {
          const haArray = computeHeikinAshi(rawCandles);
          candleSeries.setData(haArray);
          updateTitlePrice(haArray[haArray.length - 1].close);
          if (k.x) checkReversalConfirmation(haArray); // sadece KAPANAN mumda teyit kontrolu
        } else {
          candleSeries.update(candle);
          updateTitlePrice(candle.close);
        }
        if (k.x) checkLiquiditySweep(candle); // PDH/PDL/PWH/PWL sweep kontrolu - her zaman HAM mumla
      };
      ws.onclose = () => {
        clearHeartbeat();
        if (!stopped && myGen === generation) scheduleReconnect(myGen);
      };
      ws.onerror = () => ws.close();
    }

    function resetHeartbeat() {
      clearHeartbeat();
      heartbeatTimer = setTimeout(() => ws && ws.close(), 60000);
    }
    function clearHeartbeat() {
      if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; }
    }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function resetChartForReload() {
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;
      lastClose = null;
      rawCandles = [];
      lastHaReversalTime = null;
      candleSeries.setData([]);
      if (!container.contains(initMsg)) container.appendChild(initMsg);
      initMsg.textContent = "geçmiş veriler yükleniyor...";
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      resetChartForReload();
      titleEl.textContent = `${symbol} · ${interval}`;

      // Cizimler sembole bagli oldugu icin secim/surukleme/bekleyen-nokta
      // durumunu sifirla - yeni sembolun kendi cizim kumesi otomatik
      // olarak render() icinde getShapesForSymbol(symbol) ile yuklenecek.
      pendingPoints = [];
      previewPoint = null;
      selectedShape = null;
      dragTarget = null;
      renderMiniToolbar();

      panelsMeta[id].symbol = symbol;
      saveLayout();

      loadInitialData();
      connectWs();
      loadLiquidityLevels();
    }

    function changeInterval(newInterval) {
      if (newInterval === interval) return;
      interval = newInterval;
      tfButtons.forEach((b) => b.classList.toggle("active", b.dataset.value === interval));
      resetChartForReload();
      titleEl.textContent = `${symbol} · ${interval}`;

      panelsMeta[id].interval = interval;
      saveLayout();

      loadInitialData();
      connectWs();
    }

    function onTargetNav(sym, meta) {
      const s = String(sym || "").toUpperCase();
      const tf = meta && meta.interval;
      if (s && s !== symbol) changeSymbol(s);
      if (tf && tf !== interval) changeInterval(tf);
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, onTargetNav);
    }

    subscribeToTarget(initialTargetId);
    loadInitialData();
    connectWs();
    loadLiquidityLevels();
    allMarket.subscribe(refreshScannerBadge);

    panelInstances[id] = {
      destroy() {
        stopped = true;
        drawStopped = true;
        clearHeartbeat();
        if (ws) ws.close();
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
        marketScanner.unsubscribe(refreshScannerBadge);
        allMarket.unsubscribe(refreshScannerBadge);
        resizeObserver.disconnect();
        chart.remove();
      },
    };

    return item;
  }

  // =====================================================================
  // EMIR DEFTERI (ORDER BOOK) PANELI
  // =====================================================================
  function createOrderBookPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let targetId = null;
    let generation = 0;
    const GROUP_PRESETS = [
      { id: "auto", label: "Auto" },
      { id: "0.05", label: "0.05%" },
      { id: "0.1", label: "0.1%" },
      { id: "0.25", label: "0.25%" },
      { id: "0.5", label: "0.5%" },
      { id: "1", label: "1%" },
    ];
    let groupMode = (panelsMeta[id] && panelsMeta[id].obGroup) || "auto";
    let latestDepth = null;
    let bidShareEma = null;
    let paintTimer = null;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Emir Defteri`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);

    const obBody = document.createElement("div");
    obBody.className = "ob-body";
    obBody.innerHTML = `
      <div class="ob-ls">
        <div class="ob-ls-track"><div class="ob-ls-long"></div></div>
        <div class="ob-ls-labels"><span class="long">B —</span><span class="short">S —</span></div>
      </div>
      <div class="ob-group-bar"></div>
      <div class="ob-header-row"><span>Fiyat</span><span>Büyüklük</span><span>Toplam</span></div>
      <div class="ob-asks"></div>
      <div class="ob-spread">—</div>
      <div class="ob-bids"></div>
    `;
    body.appendChild(obBody);
    const asksEl = obBody.querySelector(".ob-asks");
    const bidsEl = obBody.querySelector(".ob-bids");
    const spreadEl = obBody.querySelector(".ob-spread");
    const obLsLong = obBody.querySelector(".ob-ls-long");
    const obLsLongLabel = obBody.querySelector(".ob-ls-labels .long");
    const obLsShortLabel = obBody.querySelector(".ob-ls-labels .short");
    const groupBar = obBody.querySelector(".ob-group-bar");

    GROUP_PRESETS.forEach((preset) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ob-group-btn" + (preset.id === groupMode ? " active" : "");
      btn.textContent = preset.label;
      btn.addEventListener("click", () => {
        groupMode = preset.id;
        if (panelsMeta[id]) panelsMeta[id].obGroup = groupMode;
        saveLayout();
        groupBar.querySelectorAll(".ob-group-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        safePaint();
      });
      groupBar.appendChild(btn);
    });

    function niceNum(x) {
      if (!(x > 0) || !isFinite(x)) return 1;
      const exp = Math.pow(10, Math.floor(Math.log10(x)));
      const n = x / exp;
      const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
      return nice * exp;
    }

    function resolveTick(mid) {
      if (!(mid > 0)) return 1;
      if (groupMode === "auto") {
        const pct = mid >= 1000 ? 0.0001 : 0.001;
        return niceNum(mid * pct);
      }
      const pct = parseFloat(groupMode) / 100;
      return niceNum(mid * (isFinite(pct) && pct > 0 ? pct : 0.001));
    }

    function tickDecimals(tick) {
      if (tick >= 1) return 0;
      const s = Number(tick).toFixed(10).replace(/0+$/, "");
      const i = s.indexOf(".");
      return i < 0 ? 0 : Math.min(8, s.length - i - 1);
    }

    function parseLevels(raw) {
      return (raw || []).map((l) => [parseFloat(l[0]), parseFloat(l[1])]).filter((l) => isFinite(l[0]) && l[1] > 0);
    }

    function groupLevels(levels, tick, side) {
      const map = new Map();
      levels.forEach(([price, qty]) => {
        const n = side === "bid"
          ? Math.floor((price + 1e-12) / tick)
          : Math.ceil((price - 1e-12) / tick);
        const grouped = n * tick;
        const key = grouped.toFixed(8);
        map.set(key, (map.get(key) || 0) + qty);
      });
      const out = [...map.entries()].map(([k, q]) => [parseFloat(k), q]);
      out.sort((a, b) => b[0] - a[0]);
      return out;
    }

    function withCum(levels, side) {
      const rows = levels.map(([p, q]) => ({ price: p, qty: q, usd: p * q, cum: 0 }));
      if (side === "ask") {
        let cum = 0;
        for (let i = rows.length - 1; i >= 0; i--) {
          cum += rows[i].usd;
          rows[i].cum = cum;
        }
      } else {
        let cum = 0;
        rows.forEach((r) => { cum += r.usd; r.cum = cum; });
      }
      return rows;
    }

    function renderSide(container, rows, side, maxUsd, medianUsd) {
      const wallMin = Math.max((medianUsd || 0) * 2.5, 25000);
      container.innerHTML = "";
      const frag = document.createDocumentFragment();
      rows.forEach((r) => {
        const pct = Math.min(100, (r.usd / Math.max(maxUsd, 1)) * 100);
        const wall = r.usd >= wallMin;
        const row = document.createElement("div");
        row.className = "ob-row " + side + (wall ? " ob-wall" : "");
        row.innerHTML =
          `<div class="ob-bar" style="width:${pct}%"></div>` +
          `<span class="ob-price ${side}">${r.price.toLocaleString("en-US", { minimumFractionDigits: r.decimals, maximumFractionDigits: r.decimals })}</span>` +
          `<span class="ob-qty">${formatUsdCompact(r.usd)}${wall ? " ▮" : ""}</span>` +
          `<span class="ob-cum">${formatUsdCompact(r.cum)}</span>`;
        frag.appendChild(row);
      });
      container.appendChild(frag);
    }

    function paintBook() {
      if (!latestDepth) return;
      const rawBids = latestDepth.b || latestDepth.bids;
      const rawAsks = latestDepth.a || latestDepth.asks;
      const bids = parseLevels(rawBids);
      const asks = parseLevels(rawAsks);
      if (!bids.length || !asks.length) return;

      const bestBid = Math.max(...bids.map((l) => l[0]));
      const bestAsk = Math.min(...asks.map((l) => l[0]));
      const mid = (bestBid + bestAsk) / 2;
      const tick = resolveTick(mid);

      let groupedAsks = groupLevels(asks, tick, "ask");
      let groupedBids = groupLevels(bids, tick, "bid");
      let usedTick = tick;
      if (groupMode === "auto" && (groupedAsks.length < 3 || groupedBids.length < 3) && tick > 0) {
        usedTick = niceNum(tick / 2);
        groupedAsks = groupLevels(asks, usedTick, "ask");
        groupedBids = groupLevels(bids, usedTick, "bid");
      }
      const decimals = tickDecimals(usedTick);
      groupedAsks = groupedAsks.slice(-10);
      groupedBids = groupedBids.slice(0, 10);

      const askRows = withCum(groupedAsks, "ask").map((r) => Object.assign(r, { decimals }));
      const bidRows = withCum(groupedBids, "bid").map((r) => Object.assign(r, { decimals }));
      const allUsd = askRows.concat(bidRows).map((r) => r.usd).sort((a, b) => a - b);
      const medianUsd = allUsd.length ? allUsd[Math.floor(allUsd.length / 2)] : 0;
      const maxUsd = Math.max(...allUsd, 1);

      renderSide(asksEl, askRows, "ask", maxUsd, medianUsd);
      renderSide(bidsEl, bidRows, "bid", maxUsd, medianUsd);

      const spread = bestAsk - bestBid;
      const spreadPct = bestBid ? (spread / bestBid) * 100 : 0;
      spreadEl.textContent = `Spread ${spread.toLocaleString("en-US", { maximumFractionDigits: Math.max(decimals, 2) })} (${spreadPct.toFixed(3)}%) · grup ${usedTick.toLocaleString("en-US", { maximumFractionDigits: decimals })}`;

      let bidNotional = 0;
      let askNotional = 0;
      bids.forEach(([p, q]) => { bidNotional += p * q; });
      asks.forEach(([p, q]) => { askNotional += p * q; });
      const bookTot = bidNotional + askNotional;
      if (bookTot > 0) {
        const instant = (bidNotional / bookTot) * 100;
        bidShareEma = bidShareEma == null ? instant : bidShareEma + 0.22 * (instant - bidShareEma);
        const bPct = bidShareEma;
        const sPct = 100 - bPct;
        obLsLong.style.width = bPct.toFixed(2) + "%";
        obLsLongLabel.textContent = "B " + bPct.toFixed(1) + "%";
        obLsShortLabel.textContent = "S " + sPct.toFixed(1) + "%";
      }
    }

    function safePaint() {
      try { paintBook(); } catch (e) {
        spreadEl.textContent = "Defter hatası: " + (e && e.message ? e.message : e);
      }
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    let lastPaintAt = 0;
    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      spreadEl.textContent = "Derinlik bağlanıyor…";
      ws = new WebSocket(`wss://fstream.binance.com/ws/${mySymbol.toLowerCase()}@depth20@100ms`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        try { latestDepth = JSON.parse(event.data); } catch { return; }
        const now = Date.now();
        if (now - lastPaintAt >= 500) {
          lastPaintAt = now;
          safePaint();
        }
      };
      ws.onclose = () => {
        clearHeartbeat();
        if (!stopped && myGen === generation) scheduleReconnect(myGen);
      };
      ws.onerror = () => ws.close();
    }

    function resetHeartbeat() {
      clearHeartbeat();
      heartbeatTimer = setTimeout(() => ws && ws.close(), 60000);
    }
    function clearHeartbeat() {
      if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; }
    }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;

      symbol = newSymbol;
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;
      latestDepth = null;
      bidShareEma = null;

      asksEl.innerHTML = "";
      bidsEl.innerHTML = "";
      spreadEl.textContent = "—";
      obLsLong.style.width = "50%";
      obLsLongLabel.textContent = "B —";
      obLsShortLabel.textContent = "S —";
      titleEl.textContent = `${symbol} · Emir Defteri`;

      panelsMeta[id].symbol = symbol;
      saveLayout();

      connectWs();
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, changeSymbol);
    }

    subscribeToTarget(initialTargetId);
    connectWs();
    paintTimer = setInterval(() => {
      if (Date.now() - lastPaintAt < 500) return;
      lastPaintAt = Date.now();
      safePaint();
    }, 500);

    panelInstances[id] = {
      destroy() {
        stopped = true;
        clearHeartbeat();
        if (paintTimer) clearInterval(paintTimer);
        if (ws) ws.close();
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
      },
    };

    return item;
  }

  // =====================================================================
  // LONG/SHORT + TRADER POSITIONING (secili coin, Binance futures/data)
  // =====================================================================
  function shareToPct(v) {
    const n = parseFloat(v);
    if (!isFinite(n)) return null;
    return n <= 1 ? n * 100 : n;
  }

  function createLsPositionPanel(id, initialSymbol, initialTargetId) {
    let symbol = (initialSymbol || "BTCUSDT").toUpperCase();
    let targetId = null;
    let period = "1h";
    let generation = 0;
    let pollTimer = null;
    let stopped = false;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Pozisyon`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);
    body.classList.add("ls-body");

    const periodBar = document.createElement("div");
    periodBar.className = "ls-period";
    const periodBtns = {};
    ["5m", "1h", "4h"].forEach((p) => {
      const btn = document.createElement("button");
      btn.className = "wl-col-toggle-btn" + (p === period ? " active" : "");
      btn.type = "button";
      btn.textContent = p;
      btn.addEventListener("click", () => {
        if (period === p) return;
        period = p;
        Object.keys(periodBtns).forEach((k) => periodBtns[k].classList.toggle("active", k === p));
        loadRatios();
      });
      periodBtns[p] = btn;
      periodBar.appendChild(btn);
    });
    body.appendChild(periodBar);

    function makeCard(title) {
      const card = document.createElement("div");
      card.className = "ls-card";
      const h = document.createElement("div");
      h.className = "ls-card-title";
      h.textContent = title;
      const barWrap = document.createElement("div");
      barWrap.className = "ls-card-bar";
      const bar = document.createElement("div");
      bar.className = "ls-card-long";
      barWrap.appendChild(bar);
      const row = document.createElement("div");
      row.className = "ls-card-row";
      const longEl = document.createElement("span");
      longEl.className = "long";
      longEl.textContent = "L —";
      const shortEl = document.createElement("span");
      shortEl.className = "short";
      shortEl.textContent = "S —";
      row.append(longEl, shortEl);
      const meta = document.createElement("div");
      meta.className = "ls-card-meta";
      card.append(h, barWrap, row, meta);
      body.appendChild(card);
      return { bar, longEl, shortEl, meta };
    }

    const globalCard = makeCard("Long / Short Positions");
    const traderCard = makeCard("Trader Positioning");
    const exposureCard = makeCard("Market Exposure");

    const hint = document.createElement("div");
    hint.className = "ls-hint";
    hint.textContent = "Binance hesap oranı, top trader pozisyon oranı ve taker alım/satım. Target ID sembolü, 90 sn’de bir.";
    body.appendChild(hint);

    function paintCard(card, longPct, metaText) {
      if (longPct == null || !isFinite(longPct)) {
        card.bar.style.width = "50%";
        card.longEl.textContent = "L —";
        card.shortEl.textContent = "S —";
        card.meta.textContent = metaText || "";
        return;
      }
      const clamped = Math.max(0, Math.min(100, longPct));
      card.bar.style.width = clamped.toFixed(2) + "%";
      card.longEl.textContent = "L " + clamped.toFixed(2) + "%";
      card.shortEl.textContent = "S " + (100 - clamped).toFixed(2) + "%";
      card.meta.textContent = metaText || "";
    }

    async function fetchLatest(path, sym, per) {
      const url = `https://fapi.binance.com/futures/data/${path}?symbol=${encodeURIComponent(sym)}&period=${per}&limit=1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(path + " HTTP " + res.status);
      const data = await res.json();
      return Array.isArray(data) && data[0] ? data[0] : null;
    }

    async function loadRatios() {
      if (stopped) return;
      const myGen = generation;
      const sym = symbol;
      const per = period;
      paintCard(globalCard, null, "yükleniyor…");
      paintCard(traderCard, null, "yükleniyor…");
      paintCard(exposureCard, null, "yükleniyor…");
      try {
        const [globalAcc, topPos, taker] = await Promise.all([
          fetchLatest("globalLongShortAccountRatio", sym, per),
          fetchLatest("topLongShortPositionRatio", sym, per),
          fetchLatest("takerlongshortRatio", sym, per),
        ]);
        if (stopped || myGen !== generation) return;

        const gLong = shareToPct(globalAcc && globalAcc.longAccount);
        const gRatio = globalAcc && globalAcc.longShortRatio != null ? Number(globalAcc.longShortRatio).toFixed(3) : "—";
        paintCard(globalCard, gLong, "Hesap oranı L/S " + gRatio);

        const tLong = shareToPct(topPos && (topPos.longAccount != null ? topPos.longAccount : topPos.longPosition));
        const tRatio = topPos && topPos.longShortRatio != null ? Number(topPos.longShortRatio).toFixed(3) : "—";
        paintCard(traderCard, tLong, "Top trader pozisyon L/S " + tRatio);

        let expLong = null;
        let expMeta = "Taker alım / satım";
        if (taker) {
          const buy = parseFloat(taker.buyVol);
          const sell = parseFloat(taker.sellVol);
          const tot = (isFinite(buy) ? buy : 0) + (isFinite(sell) ? sell : 0);
          if (tot > 0) expLong = (buy / tot) * 100;
          else if (taker.buySellRatio != null) {
            const r = parseFloat(taker.buySellRatio);
            if (isFinite(r) && r >= 0) expLong = (r / (1 + r)) * 100;
          }
          if (taker.buySellRatio != null) expMeta = "Taker buy/sell " + Number(taker.buySellRatio).toFixed(3);
        }
        paintCard(exposureCard, expLong, expMeta);
      } catch (e) {
        if (stopped || myGen !== generation) return;
        console.error("[Pozisyon] oranlar alınamadı:", e);
        paintCard(globalCard, null, "veri alınamadı");
        paintCard(traderCard, null, "veri alınamadı");
        paintCard(exposureCard, null, "veri alınamadı");
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      loadRatios();
      pollTimer = setInterval(loadRatios, 90000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = String(newSymbolRaw || "").toUpperCase();
      if (!newSymbol || newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      titleEl.textContent = `${symbol} · Pozisyon`;
      panelsMeta[id].symbol = symbol;
      saveLayout();
      startPolling();
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, changeSymbol);
    }

    subscribeToTarget(initialTargetId);
    startPolling();

    panelInstances[id] = {
      destroy() {
        stopped = true;
        generation++;
        if (pollTimer) clearInterval(pollTimer);
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
      },
    };

    return item;
  }

  // =====================================================================
  // LIKIDITE ISI HARITASI (HEATMAP) PANELI
  // =====================================================================
  function createHeatmapPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let targetId = null;
    let generation = 0;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Likidite Haritası`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);
    body.style.overflow = "hidden";

    const wrap = document.createElement("div");
    wrap.className = "heatmap-container";
    const canvas = document.createElement("canvas");
    canvas.className = "heatmap-canvas";
    wrap.appendChild(canvas);
    body.appendChild(wrap);
    const ctx = canvas.getContext("2d");

    const ROWS = 60;              // Y ekseni (fiyat) cozunurlugu
    const MAX_COLUMNS = 90;       // X ekseni (zaman) - gorunen gecmis kolon sayisi
    const SAMPLE_INTERVAL_MS = 1000; // her ~1 saniyede bir yeni kolon
    const PRICE_RANGE_PCT = 0.004;   // orta fiyatin +-%0.4'u araligi goster

    let history = [];      // {rowMin, rowHeight, values: Float64Array(ROWS), mid}
    let latestDepth = null;
    let sampleTimer = null;

    function resizeCanvas() {
      const rect = wrap.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width));
      canvas.height = Math.max(1, Math.floor(rect.height));
      draw();
    }
    const resizeObserver = new ResizeObserver(resizeCanvas);
    resizeObserver.observe(wrap);

    // Koyu mavi/siyah (dusuk hacim) -> mor -> kirmizi -> parlak sari (yuksek hacim)
    function heatColor(t) {
      const stops = [
        [0.0, [8, 10, 18]],
        [0.22, [24, 48, 105]],
        [0.48, [96, 40, 130]],
        [0.72, [210, 55, 55]],
        [1.0, [255, 221, 74]],
      ];
      let a = stops[0], b = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (t >= stops[i][0] && t <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
      }
      const span = b[0] - a[0] || 1;
      const lt = (t - a[0]) / span;
      const r = Math.round(a[1][0] + (b[1][0] - a[1][0]) * lt);
      const g = Math.round(a[1][1] + (b[1][1] - a[1][1]) * lt);
      const bch = Math.round(a[1][2] + (b[1][2] - a[1][2]) * lt);
      return `rgb(${r},${g},${bch})`;
    }

    function commitSample() {
      if (!latestDepth) return;
      const rawBids = latestDepth.b || latestDepth.bids;
      const rawAsks = latestDepth.a || latestDepth.asks;
      if (!rawBids || !rawAsks || !rawBids.length || !rawAsks.length) return;

      const bestBid = Math.max(...rawBids.map((l) => parseFloat(l[0])));
      const bestAsk = Math.min(...rawAsks.map((l) => parseFloat(l[0])));
      const mid = (bestBid + bestAsk) / 2;
      const rowMin = mid * (1 - PRICE_RANGE_PCT);
      const rowMax = mid * (1 + PRICE_RANGE_PCT);
      const rowHeight = (rowMax - rowMin) / ROWS;
      const values = new Float64Array(ROWS);

      [...rawBids, ...rawAsks].forEach(([price, qty]) => {
        const p = parseFloat(price);
        const q = parseFloat(qty);
        if (q <= 0) return;
        const rowIndex = Math.floor((p - rowMin) / rowHeight);
        if (rowIndex >= 0 && rowIndex < ROWS) values[rowIndex] += q;
      });

      history.push({ rowMin, rowHeight, values, mid });
      if (history.length > MAX_COLUMNS) history.shift();
      draw();
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#0a0e14";
      ctx.fillRect(0, 0, w, h);
      if (!history.length) return;

      let maxQty = 0.0001;
      history.forEach((col) => col.values.forEach((v) => { if (v > maxQty) maxQty = v; }));

      const colWidth = w / MAX_COLUMNS;
      const rowH = h / ROWS;
      const startIdx = MAX_COLUMNS - history.length;

      history.forEach((col, i) => {
        const x = (startIdx + i) * colWidth;
        for (let r = 0; r < ROWS; r++) {
          const v = col.values[r];
          if (v <= 0) continue;
          const t = Math.min(1, Math.log(1 + v) / Math.log(1 + maxQty));
          ctx.fillStyle = heatColor(t);
          const y = h - (r + 1) * rowH; // dusuk fiyat alta, yuksek fiyat usta
          ctx.fillRect(x, y, Math.ceil(colWidth) + 1, Math.ceil(rowH) + 1);
        }
      });

      const last = history[history.length - 1];
      ctx.fillStyle = "rgba(230,234,242,0.85)";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText(last.mid.toLocaleString("en-US", { maximumFractionDigits: 2 }), w - 4, 12);
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      ws = new WebSocket(`wss://fstream.binance.com/public/ws/${mySymbol.toLowerCase()}@depth10@100ms`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        try { latestDepth = JSON.parse(event.data); } catch { /* yoksay */ }
      };
      ws.onclose = () => { clearHeartbeat(); if (!stopped && myGen === generation) scheduleReconnect(myGen); };
      ws.onerror = () => ws.close();
    }
    function resetHeartbeat() { clearHeartbeat(); heartbeatTimer = setTimeout(() => ws && ws.close(), 60000); }
    function clearHeartbeat() { if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; } }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;
      history = [];
      latestDepth = null;
      titleEl.textContent = `${symbol} · Likidite Haritası`;
      panelsMeta[id].symbol = symbol;
      saveLayout();
      connectWs();
      draw();
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, changeSymbol);
    }

    subscribeToTarget(initialTargetId);
    connectWs();
    sampleTimer = setInterval(commitSample, SAMPLE_INTERVAL_MS);
    requestAnimationFrame(resizeCanvas);

    panelInstances[id] = {
      destroy() {
        stopped = true;
        clearHeartbeat();
        if (ws) ws.close();
        if (sampleTimer) clearInterval(sampleTimer);
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
        resizeObserver.disconnect();
      },
    };

    return item;
  }

  // =====================================================================
  // BOT KONTROL PANELI (Paper Trading simulasyonu)
  //
  // NOT: Bu tamamen istemci tarafinda calisan bir SIMULASYONDUR. Gercek
  // emir gonderilmez, gercek para kullanilmaz. Kapanan 1 dakikalik mumlar
  // uzerinden basit RSI/SMA/trailing-stop kurallariyla ornek al/sat
  // sinyalleri uretir ve varsayimsal PnL hesaplar - egitim/gosterim
  // amaclidir, yatirim tavsiyesi degildir.
  // =====================================================================
  function createBotPanel(id, initialSymbol, initialTargetId) {
    let symbol = initialSymbol;
    let targetId = null;
    let generation = 0;

    const { item, body, titleEl } = buildPanelShell(id, `${symbol} · Bot`, initialTargetId, (newId) => {
      subscribeToTarget(newId);
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => symbol);

    const botBody = document.createElement("div");
    botBody.className = "bot-body";
    botBody.innerHTML = `
      <select class="bot-select">
        <option value="rsi">RSI &lt; 30 ise Al (RSI &gt; 60 Sat)</option>
        <option value="trailing">20 Mum Zirvesi Kırılımı + Trailing Stop %1</option>
        <option value="sma">SMA(9) / SMA(21) Kesişimi</option>
      </select>
      <div class="bot-controls">
        <button class="bot-toggle-btn start">BAŞLAT</button>
        <div class="bot-status"><span class="bot-status-dot"></span><span class="bot-status-text">Beklemede</span></div>
      </div>
      <div class="bot-pnl">+0.00%</div>
      <table class="bot-trades-table">
        <thead><tr><th>Zaman</th><th>Giriş</th><th>Çıkış</th><th>PnL</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="bot-disclaimer">Simülasyon (Paper Trading) — gerçek emir gönderilmez, yatırım tavsiyesi değildir.</div>
    `;
    body.appendChild(botBody);

    const selectEl = botBody.querySelector(".bot-select");
    const toggleBtn = botBody.querySelector(".bot-toggle-btn");
    const statusDot = botBody.querySelector(".bot-status-dot");
    const statusText = botBody.querySelector(".bot-status-text");
    const pnlEl = botBody.querySelector(".bot-pnl");
    const tradesBody = botBody.querySelector(".bot-trades-table tbody");

    let strategy = "rsi";
    let running = false;
    let closes = [];   // kapanan 1dk mumlarin close fiyatlari
    let equity = 100;  // bilesik simule edilmis oz sermaye (baslangic = 100)
    let trades = [];   // {time, entry, exit, pnlPct}
    let position = null; // {entryPrice, peak}

    function fmtPct(v) { return `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`; }

    function renderStatus() {
      statusDot.className = "bot-status-dot" + (running ? " running" : "");
      statusText.textContent = running ? "Çalışıyor" : "Beklemede";
      toggleBtn.textContent = running ? "DURDUR" : "BAŞLAT";
      toggleBtn.className = "bot-toggle-btn " + (running ? "stop" : "start");
    }

    function renderPnl() {
      const pct = equity - 100;
      pnlEl.textContent = fmtPct(pct);
      pnlEl.style.color = pct >= 0 ? "var(--up)" : "var(--down)";
    }

    function renderTrades() {
      tradesBody.innerHTML = "";
      trades.slice(0, 5).forEach((t) => {
        const tr = document.createElement("tr");
        const pnlColor = t.pnlPct >= 0 ? "var(--up)" : "var(--down)";
        tr.innerHTML = `
          <td>${t.time}</td>
          <td>${t.entry.toLocaleString("en-US", { maximumFractionDigits: 2 })}</td>
          <td>${t.exit.toLocaleString("en-US", { maximumFractionDigits: 2 })}</td>
          <td style="color:${pnlColor}">${fmtPct(t.pnlPct)}</td>`;
        tradesBody.appendChild(tr);
      });
    }

    function sma(period) {
      if (closes.length < period) return null;
      const slice = closes.slice(-period);
      return slice.reduce((a, b) => a + b, 0) / period;
    }

    function rsi(period = 14) {
      if (closes.length < period + 1) return null;
      const slice = closes.slice(-(period + 1));
      let gain = 0, loss = 0;
      for (let i = 1; i < slice.length; i++) {
        const diff = slice[i] - slice[i - 1];
        if (diff >= 0) gain += diff; else loss -= diff;
      }
      const avgGain = gain / period, avgLoss = loss / period;
      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return 100 - 100 / (1 + rs);
    }

    function closePosition(exitPrice) {
      const pnlPct = ((exitPrice - position.entryPrice) / position.entryPrice) * 100;
      equity = equity * (1 + pnlPct / 100);
      trades.unshift({
        time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
        entry: position.entryPrice,
        exit: exitPrice,
        pnlPct,
      });
      trades = trades.slice(0, 5);
      position = null;
      renderPnl();
      renderTrades();
    }

    function evaluateStrategy() {
      if (!running || closes.length < 2) return;
      const price = closes[closes.length - 1];

      if (strategy === "rsi") {
        const r = rsi(14);
        if (r === null) return;
        if (!position && r < 30) position = { entryPrice: price, peak: price };
        else if (position && r > 60) closePosition(price);
      } else if (strategy === "trailing") {
        const recent20 = closes.slice(-21, -1);
        const prevHigh = recent20.length ? Math.max(...recent20) : null;
        if (!position && prevHigh !== null && price > prevHigh) {
          position = { entryPrice: price, peak: price };
        } else if (position) {
          position.peak = Math.max(position.peak, price);
          if (price <= position.peak * 0.99) closePosition(price);
        }
      } else if (strategy === "sma") {
        const fast = sma(9), slow = sma(21);
        if (fast === null || slow === null) return;
        if (!position && fast > slow) position = { entryPrice: price, peak: price };
        else if (position && fast < slow) closePosition(price);
      }
    }

    selectEl.addEventListener("change", () => {
      strategy = selectEl.value;
      position = null; // strateji degisince acik pozisyon islenmeden sifirlanir
    });

    toggleBtn.addEventListener("click", () => {
      running = !running;
      renderStatus();
    });

    async function loadInitialCloses() {
      const mySymbol = symbol;
      try {
        const res = await fetch(futuresKlinesUrl(mySymbol, "1m", 100));
        if (!res.ok) throw new Error("REST hatasi: " + res.status);
        const raw = await res.json();
        if (mySymbol !== symbol) return;
        closes = raw.map((d) => parseFloat(d[4]));
      } catch (e) {
        console.error("[Bot] Gecmis kapanislar alinamadi:", e);
      }
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let stopped = false;

    function connectWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      ws = new WebSocket(futuresKlineWsUrl(mySymbol, "1m"));
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const k = msg.k;
        if (!k || !k.x) return; // sadece KAPANAN mumlari indikatore ekle
        closes.push(parseFloat(k.c));
        if (closes.length > 200) closes.shift();
        evaluateStrategy();
      };
      ws.onclose = () => { clearHeartbeat(); if (!stopped && myGen === generation) scheduleReconnect(myGen); };
      ws.onerror = () => ws.close();
    }
    function resetHeartbeat() { clearHeartbeat(); heartbeatTimer = setTimeout(() => ws && ws.close(), 60000); }
    function clearHeartbeat() { if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; } }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectWs(); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function changeSymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      clearHeartbeat();
      if (ws) { try { ws.close(); } catch (e) { /* yoksay */ } }
      retryDelayMs = 1000;
      closes = [];
      position = null;
      titleEl.textContent = `${symbol} · Bot`;
      panelsMeta[id].symbol = symbol;
      saveLayout();
      loadInitialCloses();
      connectWs();
    }

    function subscribeToTarget(newTargetId) {
      if (targetId !== null) targetBus.unsubscribe(targetId, id);
      targetId = newTargetId;
      targetBus.subscribe(targetId, id, changeSymbol);
    }

    subscribeToTarget(initialTargetId);
    renderStatus();
    renderPnl();
    loadInitialCloses();
    connectWs();

    panelInstances[id] = {
      destroy() {
        stopped = true;
        clearHeartbeat();
        if (ws) ws.close();
        if (targetId !== null) targetBus.unsubscribe(targetId, id);
      },
    };

    return item;
  }

  // =====================================================================
  // PIYASA TARAMA MODULU (marketScanner)
  //
  // Izleme Listesi sembolleri icin surekli calisan, paylasilan bir arka
  // plan tarayici: her sembolun Funding Rate'ini, Open Interest gecmisini
  // ve fiyat gecmisini takip eder; "Ekstrem FR" ve "OI/Fiyat Uyumsuzlugu"
  // durumlarini hesaplar. Watchlist satirlari, Grafik basligi ve FR
  // Tarama paneli hepsi buradan okur - tek kaynak, tekrar baglanti yok.
  //
  // NOT: OI/Fiyat uyumsuzlugu tespiti basitlestirilmis bir sezgisel
  // yontemdir (son ~20 ornekte fiyat kendi tepesine yakinken OI kendi
  // tepesinden belirgin geri cekilmis mi) - profesyonel bir "swing high"
  // uyumsuzluk analizi degil, egitim/gosterim amacli bir yaklasimdir.
  // =====================================================================
  const FR_EXTREME_LEVELS = [-0.5, -1.0, -2.0]; // % - hafif, orta, asiri esikler
  const OI_DIVERGENCE_WINDOW = 20; // ornek sayisi (~10sn araliklarla ~3-4 dakika)

  const marketScanner = {
    bySymbol: {}, // sym -> {price, fundingRate, oiHistory:[], priceHistory:[], extremeLevel, oiDivergence}
    listeners: new Set(),
    subscribe(cb) { this.listeners.add(cb); },
    unsubscribe(cb) { this.listeners.delete(cb); },
    notify() { this.listeners.forEach((cb) => { try { cb(); } catch (e) { /* dinleyici hatasi taramayi durdurmasin */ } }); },
  };

  function scannerEntry(sym) {
    if (!marketScanner.bySymbol[sym]) {
      marketScanner.bySymbol[sym] = { price: null, fundingRate: null, oiHistory: [], priceHistory: [], extremeLevel: 0, oiDivergence: false };
    }
    return marketScanner.bySymbol[sym];
  }

  function recomputeDivergence(entry) {
    const ph = entry.priceHistory, oh = entry.oiHistory;
    if (ph.length < OI_DIVERGENCE_WINDOW || oh.length < OI_DIVERGENCE_WINDOW) { entry.oiDivergence = false; return; }
    const recentP = ph.slice(-OI_DIVERGENCE_WINDOW);
    const recentO = oh.slice(-OI_DIVERGENCE_WINDOW);
    const maxPrice = Math.max(...recentP.map((p) => p.v));
    const maxOi = Math.max(...recentO.map((p) => p.v));
    const lastPrice = recentP[recentP.length - 1].v;
    const lastOi = recentO[recentO.length - 1].v;
    // Fiyat kendi son tepesinin en fazla %0.3 altinda (hala guclu/yakin),
    // ama OI kendi tepesinden en az %3 gerilemis -> alicilar tukenmis olabilir.
    const priceNearPeak = lastPrice >= maxPrice * 0.997;
    const oiDroppedFromPeak = lastOi <= maxOi * 0.97;
    entry.oiDivergence = priceNearPeak && oiDroppedFromPeak && maxOi > 0;
  }

  function scannerUpdateExtreme(entry) {
    if (entry.fundingRate === null) { entry.extremeLevel = 0; return; }
    let level = 0;
    FR_EXTREME_LEVELS.forEach((th, i) => { if (entry.fundingRate <= th) level = i + 1; });
    entry.extremeLevel = level; // 0=normal, 1=-0.5, 2=-1.0, 3=-2.0
  }

  function initMarketScanner() {
    marketScanner.reconnectStreams = function () {};
    let lastSync = 0;
    function syncFromMarket() {
      const now = Date.now();
      if (now - lastSync < 10000) return;
      lastSync = now;
      WATCHLIST_SYMBOLS.forEach((sym) => {
        const m = allMarket.bySymbol[String(sym).toUpperCase()];
        if (!m) return;
        const entry = scannerEntry(sym);
        if (m.price != null) {
          entry.price = m.price;
          const lastP = entry.priceHistory[entry.priceHistory.length - 1];
          if (!lastP || now - lastP.t >= 9000) {
            entry.priceHistory.push({ t: now, v: m.price });
            if (entry.priceHistory.length > 200) entry.priceHistory.shift();
          }
        }
        if (m.fundingPct != null) {
          entry.fundingRate = m.fundingPct;
          scannerUpdateExtreme(entry);
        }
        if (m.oiQty != null) {
          const lastO = entry.oiHistory[entry.oiHistory.length - 1];
          if (!lastO || now - lastO.t >= 40000) {
            entry.oiHistory.push({ t: now, v: m.oiQty });
            if (entry.oiHistory.length > 200) entry.oiHistory.shift();
          }
        }
        recomputeDivergence(entry);
      });
      marketScanner.notify();
    }
    allMarket.subscribe(syncFromMarket);
    watchlistBus.subscribe(syncFromMarket);
  }

  // =====================================================================
  // HACIM SICRAMA RADARI (Volume Spike Alert Widget)
  // =====================================================================
  function createVolRadarPanel(id, initialTargetId) {
    let targetId = initialTargetId;

    const { item, body } = buildPanelShell(id, "Hacim Sıçrama Radarı", targetId, (newId) => {
      targetId = newId;
      panelsMeta[id].targetId = newId;
      saveLayout();
    }, () => "BTCUSDT");
    body.style.overflow = "hidden";

    const listWrap = document.createElement("div");
    listWrap.style.cssText = "height:100%; overflow-y:auto; padding:8px;";
    body.appendChild(listWrap);

    const emptyNote = document.createElement("div");
    emptyNote.className = "alert-empty-note";
    emptyNote.textContent = "Şu an 3x üzeri hacim sıçraması tespit edilmedi.";
    listWrap.appendChild(emptyNote);

    const state = {};

    function syncState() {
      WATCHLIST_SYMBOLS.forEach((sym) => {
        if (!state[sym]) state[sym] = { closedVolumes: [], currentVolume: null, currentIsUp: null, ratio: 0 };
      });
      Object.keys(state).forEach((sym) => {
        if (!WATCHLIST_SYMBOLS.includes(sym)) delete state[sym];
      });
    }
    syncState();

    function computeRatio(entry) {
      if (entry.closedVolumes.length === 0 || entry.currentVolume === null) { entry.ratio = 0; return; }
      const avg = entry.closedVolumes.reduce((a, b) => a + b, 0) / entry.closedVolumes.length;
      entry.ratio = avg > 0 ? entry.currentVolume / avg : 0;
    }

    function render() {
      const spikes = WATCHLIST_SYMBOLS
        .map((sym) => ({ sym, ...state[sym] }))
        .filter((e) => e && e.ratio >= 3)
        .sort((a, b) => b.ratio - a.ratio);

      listWrap.innerHTML = "";
      if (spikes.length === 0) { listWrap.appendChild(emptyNote); return; }

      spikes.forEach((e) => {
        const symbolUpper = e.sym.toUpperCase();
        const isUp = e.currentIsUp;
        const flame = e.ratio >= 5 ? "🔥🔥" : "🔥";
        const row = document.createElement("div");
        row.className = "alert-list-item";
        row.style.cursor = "pointer";
        row.style.borderLeft = `4px solid ${isUp ? "var(--up)" : "var(--down)"}`;
        row.innerHTML = `
          <div class="info">
            <div class="name" style="color:${isUp ? "var(--up)" : "var(--down)"}">${flame} ${formatWatchlistLabel(e.sym)}</div>
            <div class="desc">${e.ratio.toFixed(2)}x Volume Spike · ${isUp ? "Alım ağırlıklı" : "Satım ağırlıklı"}</div>
          </div>`;
        row.addEventListener("click", () => targetBus.emit(targetId, symbolUpper));
        listWrap.appendChild(row);
      });
    }

    async function seedHistory(symbols) {
      await Promise.all((symbols || WATCHLIST_SYMBOLS).map(async (sym) => {
        if (!state[sym] || state[sym].closedVolumes.length) return;
        try {
          const res = await fetch(futuresKlinesUrl(sym.toUpperCase(), "1m", 21));
          if (!res.ok) throw new Error("HTTP " + res.status);
          const raw = await res.json();
          if (!state[sym]) return;
          state[sym].closedVolumes = raw.slice(0, -1).map((d) => parseFloat(d[5])).slice(-20);
        } catch (e) {
          console.error(`[Hacim Radarı] ${sym.toUpperCase()} geçmiş hacim alınamadı:`, e.message);
        }
      }));
      render();
    }

    let ws = null;
    let retryDelayMs = 1000;
    let heartbeatTimer = null;
    let streamGen = 0;
    let stopped = false;

    function connect(myGen) {
      if (stopped || myGen !== streamGen) return;
      if (!WATCHLIST_SYMBOLS.length) return;
      const streams = WATCHLIST_SYMBOLS.map((s) => `${s}@kline_1m`).join("/");
      ws = new WebSocket(`wss://fstream.binance.com/stream?streams=${streams}`);
      ws.onopen = () => { retryDelayMs = 1000; resetHeartbeat(); };
      ws.onmessage = (event) => {
        resetHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const d = msg.data;
        if (!d || !d.k) return;
        const k = d.k;
        const sym = d.s.toLowerCase();
        const entry = state[sym];
        if (!entry) return;

        const vol = parseFloat(k.v);
        if (k.x) {
          entry.closedVolumes.push(vol);
          if (entry.closedVolumes.length > 20) entry.closedVolumes.shift();
          entry.currentVolume = null;
        } else {
          entry.currentVolume = vol;
          entry.currentIsUp = parseFloat(k.c) >= parseFloat(k.o);
        }
        computeRatio(entry);
        render();
      };
      ws.onclose = () => { clearHeartbeat(); if (!stopped && myGen === streamGen) scheduleReconnect(myGen); };
      ws.onerror = () => ws.close();
    }
    function resetHeartbeat() { clearHeartbeat(); heartbeatTimer = setTimeout(() => ws && ws.close(), 60000); }
    function clearHeartbeat() { if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; } }
    function scheduleReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === streamGen) connect(myGen); }, retryDelayMs);
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
    }

    function reconnect() {
      streamGen++;
      const g = streamGen;
      retryDelayMs = 1000;
      try { if (ws) ws.close(); } catch (e) { /* yoksay */ }
      connect(g);
    }

    function onWatchlistChange() {
      const missing = WATCHLIST_SYMBOLS.filter((sym) => !state[sym] || !state[sym].closedVolumes.length);
      syncState();
      seedHistory(missing);
      reconnect();
    }

    watchlistBus.subscribe(onWatchlistChange);
    seedHistory().then(() => reconnect());

    panelInstances[id] = {
      destroy() {
        stopped = true;
        streamGen++;
        clearHeartbeat();
        if (ws) ws.close();
        watchlistBus.unsubscribe(onWatchlistChange);
      },
    };

    return item;
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function drawArrowHead(ctx, x1, y1, x2, y2) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const size = 9;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 7), y2 - size * Math.sin(angle - Math.PI / 7));
    ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 7), y2 - size * Math.sin(angle + Math.PI / 7));
    ctx.closePath();
    ctx.fill();
  }

  const ALERTS_KEY = "crypto-dashboard-alerts-v1";

  async function loadAlertsStore() {
    const migrated = await loadWithMigration(ALERTS_KEY, (v) => v && Array.isArray(v.alerts));
    if (!migrated) return { alerts: [], history: [] };
