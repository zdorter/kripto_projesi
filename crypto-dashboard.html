  // --- Bildirim kanali 1: Sesli uyari (Web Audio API) ------------------
  function ensureAudioContext() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* desteklenmiyor */ }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function playAlertSound(kind) {
    ensureAudioContext();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (kind === "div-double") {
      [523, 659, 784, 988, 784, 988, 1175].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const start = now + i * 0.11;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.13);
      });
      return;
    }
    if (kind === "siren" || kind === "squeeze") {
      const seq = kind === "squeeze"
        ? [392, 587, 392, 659, 392, 784, 330, 523]
        : [523, 784, 523, 784, 523, 784];
      seq.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = freq;
        const start = now + i * 0.14;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(kind === "squeeze" ? 0.16 : 0.12, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.13);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.14);
      });
      return;
    }
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = now + i * 0.16;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.2);
    });
  }

  // --- Bildirim kanali 3: Ekran ici Toast --------------------------------
  function showToast(title, desc, opts) {
    opts = opts || {};
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.className = "toast" + (opts.tone === "siren" ? " toast-siren" : opts.tone === "vol" ? " toast-vol" : opts.tone === "div" ? " toast-vol" : "");
    toast.innerHTML = `
      <div class="toast-title"><span>🔔 ${title}</span><button class="toast-close">✕</button></div>
      <div class="toast-desc">${desc}</div>`;
    toast.querySelector(".toast-close").addEventListener("click", (e) => { e.stopPropagation(); toast.remove(); });
    if (opts.symbol) {
      toast.style.cursor = "pointer";
      toast.title = "Grafiğe göndermek için tıklayın";
      toast.addEventListener("click", () => emitTarget(DEFAULT_TARGET_ID, opts.symbol, opts.interval ? { interval: opts.interval } : {}));
    }
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 8000);
  }

  function addHistoryEntry(alertName, desc, symbol, interval) {
    alertsStore.history.unshift({
      time: new Date().toLocaleString("tr-TR", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" }),
      alertName, desc,
      symbol: symbol || null,
      interval: interval || null,
    });
    alertsStore.history = alertsStore.history.slice(0, 50);
    persistAlertsStore();
  }

  function fireAlert(alert, desc) {
    playAlertSound("soft");
    showDesktopNotification(alert.name, desc);
    showToast(alert.name, desc, { symbol: alert.symbol });

    renderAlertHistory();

  const marketAlertCooldown = {};
  let lastSoundAt = 0;

  function fireMarketAlert(opts) {
    const type = opts.type || "gen";
    if (type === "vol" && !marketEngine.volAlerts) return false;
    if (type === "fr" && !marketEngine.frAlerts) return false;
    if (type === "squeeze" && !marketEngine.squeezeAlerts) return false;
    if (String(type).indexOf("engulf") === 0 && !marketEngine.engulfAlerts) return false;
    if (String(type).indexOf("div:") === 0 && !marketEngine.divAlerts) return false;
    const key = type + ":" + (opts.symbol || "");
    const cooldown = opts.cooldownMs || 20 * 60 * 1000;
    const now = Date.now();
    if (key !== "gen:" && marketAlertCooldown[key] && now - marketAlertCooldown[key] < cooldown) return false;
    marketAlertCooldown[key] = now;
    const sound = opts.sound || "soft";
    if (now - lastSoundAt > 2500) {
      playAlertSound(sound);
      lastSoundAt = now;
    }
    showDesktopNotification(opts.title, opts.desc);
    const tone = sound === "div-double" ? "div" : (sound === "siren" || sound === "squeeze" ? "siren" : type === "vol" ? "vol" : "");
    showToast(opts.title, opts.desc, { symbol: opts.symbol, interval: opts.interval, tone });
    addHistoryEntry(opts.title, opts.desc, opts.symbol, opts.interval);
    renderAlertHistory();
    return true;
  }

  function formatUsdCompact(v) {
    if (v == null || !isFinite(v)) return "—";
    const abs = Math.abs(v);
    if (abs >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
    if (abs >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
    if (abs >= 1e3) return "$" + (v / 1e3).toFixed(0) + "K";
    return "$" + v.toFixed(0);
  }

  function formatFrPeriod(row) {
    const h = row && row.fundingIntervalHours ? row.fundingIntervalHours : 8;
    const label = h + "s";
    if (!row || !row.nextFundingTime) return label;
    const ms = row.nextFundingTime - Date.now();
    if (!isFinite(ms) || ms <= 0) return label;
    const mins = Math.floor(ms / 60000);
    if (mins >= 60) return label + " · " + Math.floor(mins / 60) + "sa " + (mins % 60) + "dk";
    return label + " · " + mins + "dk";
  }

  function frIntervalHours(row) {

  }

  function frEquivalent8h(row) {
    if (!row || row.fundingPct == null || !isFinite(row.fundingPct)) return null;
    return row.fundingPct * (8 / frIntervalHours(row));
  }

  function frDeltaThreshold(absFr) {
    const noise = marketEngine.frTrendNoise || 0.002;
    const absMin = marketEngine.frTrendAbs || 0.005;
    const rel = marketEngine.frTrendRel || 0.15;
    return Math.max(noise, absMin, rel * (absFr || 0));
  }

  function updateFrTrend(row, now) {
    if (row.fundingPct == null || !isFinite(row.fundingPct)) return;
    row._frHist = row._frHist || [];
    const last = row._frHist[row._frHist.length - 1];
    if (!last || now - last.t >= 14000) {
      row._frHist.push({ t: now, v: row.fundingPct });
      if (row._frHist.length > 56) row._frHist.shift();
    } else {
      last.v = row.fundingPct;
      last.t = now;
    }
    const preferMs = marketEngine.frTrendMinMs || 8 * 60 * 1000;
    const readyMs = marketEngine.frTrendReadyMs || 5 * 60 * 1000;
    const aged = row._frHist.find((s) => now - s.t >= preferMs)
      || row._frHist.find((s) => now - s.t >= readyMs)
      || row._frHist[0];
    const age = aged ? now - aged.t : 0;
    row.frTrendReady = age >= readyMs && row._frHist.length >= 2;
    if (aged && row._frHist.length >= 2) row.frDelta = row.fundingPct - aged.v;
  }

  function classifyMarketRow(row) {
    const fr = row.fundingPct;
    const iv = frIntervalHours(row);
    const dlt = row.frDelta;
    const absFr = fr == null ? 0 : Math.abs(fr);
    const thresh = frDeltaThreshold(absFr);
    const ready = !!row.frTrendReady;
    const rising = ready && dlt != null && dlt >= thresh;
    const falling = ready && dlt != null && dlt <= -thresh;
    row.frRising = rising;
    row.frFalling = falling;
    const frEq = frEquivalent8h(row);
    const absEq = frEq == null ? 0 : Math.abs(frEq);
    const minAbs = marketEngine.oneHourFrMinAbs || 0.03;
    const eqHigh = marketEngine.oneHourFrEqSpike || 0.15;
    const eqElev = marketEngine.oneHourFrEqElevated || 0.08;
    row.oneHourSpike = iv === 1 && fr != null && (
      absEq >= eqHigh || absFr >= minAbs || (absEq >= eqElev && rising)
    );
    const oiHot = row.oiTrendPct != null
      && row.oiTrendPct >= (marketEngine.oiTrendMinPct || 2)
      && (row.oiNotional || 0) >= (marketEngine.oiMinNotional || 500000);
    const deepNeg = fr != null && (
      fr <= -0.5
      || (iv === 1 && fr <= (marketEngine.oneHourNegFr || -0.15))
      || (frEq != null && frEq <= -0.5)
    );
    row.leveragePressure = deepNeg && falling;
    row.squeezeRisk = iv === 1 && oiHot && fr != null && (
      row.leveragePressure || fr <= -0.5 || absFr >= 0.08
    );
  }

  function evaluateSqueezeAlerts() {
    if (!marketEngine.squeezeAlerts) return;
    const hits = [];
    allMarket.symbols.forEach((sym) => {
      const row = allMarket.bySymbol[sym];
      if (row && row.squeezeRisk) hits.push(row);
    });
    hits.sort((a, b) => Math.abs(b.fundingPct || 0) - Math.abs(a.fundingPct || 0));
    hits.slice(0, 3).forEach((row) => {
      const oiTxt = row.oiTrendPct == null
        ? ""
        : ` · OI ${row.oiTrendPct >= 0 ? "+" : ""}${row.oiTrendPct.toFixed(1)}% (${formatUsdCompact(row.oiNotional)})`;
      fireMarketAlert({
        type: "squeeze",
        symbol: row.symbol,
        title: "Ekstrem Squeeze / Dönüş Riski",
        desc: `${row.symbol} · ${row.fundingIntervalHours || 1}s FR · %${(row.fundingPct || 0).toFixed(4)}${oiTxt}`,
        sound: "squeeze",
        cooldownMs: 30 * 60 * 1000,
      });
    });
  }

  function feedAlertHubFromMarket(sym) {
    const entry = hub[sym];
    if (!entry) return;
    const row = allMarket.bySymbol[sym];
    if (!row) return;
    if (row.price != null) entry.price = row.price;
    if (row.fundingPct != null) entry.fundingRate = row.fundingPct;
    evaluateAlertsForSymbol(sym);
  }

  function evaluateGlobalFrAlerts() {
    if (!marketEngine.frAlerts) return;
    const threshold = marketEngine.frThreshold;
    const candidates = [];
    allMarket.symbols.forEach((sym) => {
      const row = allMarket.bySymbol[sym];
      if (row.fundingPct == null || row.prevFundingPct == null) return;
      const crossed = row.prevFundingPct > threshold && row.fundingPct <= threshold;
      if (!crossed) return;
      if ((row.quoteVol || 0) < 2000000) return;
      candidates.push(row);
    });
    candidates.sort((a, b) => a.fundingPct - b.fundingPct);
    candidates.slice(0, 4).forEach((row) => {
      const siren = row.fundingPct <= -2;
      fireMarketAlert({
        type: "fr",
        symbol: row.symbol,
        title: siren ? "Siren · Ekstrem FR" : "Ekstrem FR",
        desc: `${row.symbol} fonlama %${row.fundingPct.toFixed(4)} (eşik ${threshold}%)`,
        sound: siren ? "siren" : "soft",
        cooldownMs: 30 * 60 * 1000,
      });
    });
  }

  function sampleMinuteVolumesAndAlert() {
    const spikes = [];
    allMarket.symbols.forEach((sym) => {
      const row = allMarket.bySymbol[sym];
      if (row.quoteVol == null) return;
      if (row._prevQuote != null && row.quoteVol >= row._prevQuote * 0.4) {
        const delta = Math.max(0, row.quoteVol - row._prevQuote);
        row.lastMinuteNotional = delta;
        row._minuteVols.push(delta);
        if (row._minuteVols.length > 20) row._minuteVols.shift();
        const hist = row._minuteVols.slice(0, -1);
        if (hist.length >= 3) {
          const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
          row.volRatio = avg > 0 ? delta / avg : 0;
          if (
            hist.length >= 8 &&
            marketEngine.volAlerts &&
            row.volRatio >= marketEngine.volMultiplier &&
            delta >= marketEngine.volMinNotional &&
            (row.quoteVol || 0) >= marketEngine.volMinDayQuote
          ) {
            spikes.push(row);
          }
        } else {
          row.volRatio = 0;
        }
      }
      row._prevQuote = row.quoteVol;
    });
    spikes.sort((a, b) => b.volRatio - a.volRatio);
    if (!marketEngine.volAlerts) {
      allMarket.notify();
      return;
    }
    spikes.slice(0, 2).forEach((row) => {
      fireMarketAlert({
        type: "vol",
        symbol: row.symbol,
        title: "Hacim patlaması",
        desc: `${row.symbol} · ${row.volRatio.toFixed(1)}x son 1dk hacim (min ${marketEngine.volMultiplier}x, ${formatUsdCompact(row.lastMinuteNotional)})`,
        sound: row.volRatio >= 12 ? "siren" : "soft",
        cooldownMs: 20 * 60 * 1000,
      });
    });
    allMarket.notify();
  }

  function isBullishEngulf(prev, curr) {
    if (!prev || !curr) return false;
    if (!(prev.c < prev.o) || !(curr.c > curr.o)) return false;
    const prevBody = prev.o - prev.c;
    const currBody = curr.c - curr.o;
    if (prevBody <= 0 || currBody < prevBody) return false;
    return curr.o <= prev.c && curr.c >= prev.o;
  }

  function initAllMarketHub() {
    if (allMarket._started) return;
    allMarket._started = true;

    let premiumRetryMs = 15000;
    let premiumInFlight = false;
    async function pollPremiumIndex() {
      if (premiumInFlight) {
        setTimeout(pollPremiumIndex, premiumRetryMs);
        return;
      }
      premiumInFlight = true;
      try {
        const res = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const nextSymbols = [];
        data.forEach((d) => {
          const sym = d.symbol;
          if (!sym || !sym.endsWith("USDT") || sym.indexOf("_") !== -1) return;
          nextSymbols.push(sym);
          const row = marketEntry(sym);
          row.prevFundingPct = row.fundingPct;
          row.fundingPct = parseFloat(d.lastFundingRate) * 100;
          const nextT = parseInt(d.nextFundingTime, 10);
          if (isFinite(nextT)) row.nextFundingTime = nextT;
          const mark = parseFloat(d.markPrice);
          if (isFinite(mark) && row.price == null) row.price = mark;
          updateFrTrend(row, Date.now());
          classifyMarketRow(row);
          if (hub[sym]) feedAlertHubFromMarket(sym);
        });
        allMarket.symbols = nextSymbols.sort();
        allMarket.ready = true;
        evaluateGlobalFrAlerts();
        allMarket.notify();
        premiumRetryMs = 15000;
      } catch (e) {
        console.error("[Market] premiumIndex alınamadı:", e.message || e);
        premiumRetryMs = Math.min(premiumRetryMs * 2, 60000);
      } finally {
        premiumInFlight = false;
        setTimeout(pollPremiumIndex, premiumRetryMs);
      }
    }
    pollPremiumIndex();

    async function pollFundingInfo() {
      try {
        const res = await fetch("https://fapi.binance.com/fapi/v1/fundingInfo");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!Array.isArray(data)) return;
        const seen = new Set();
        data.forEach((d) => {
          const sym = d.symbol;
          if (!sym || !sym.endsWith("USDT") || sym.indexOf("_") !== -1) return;
          const hours = parseInt(d.fundingIntervalHours, 10);
          const row = marketEntry(sym);
          row.fundingIntervalHours = isFinite(hours) && hours > 0 ? hours : 8;
          seen.add(sym);
          classifyMarketRow(row);
        });
        allMarket.symbols.forEach((sym) => {
          if (seen.has(sym)) return;
          const row = allMarket.bySymbol[sym];
          if (row && row.fundingIntervalHours == null) row.fundingIntervalHours = 8;
        });
        allMarket.notify();
      } catch (e) {
        console.error("[Market] fundingInfo alınamadı:", e.message || e);
      }
    }
    pollFundingInfo();
    setInterval(pollFundingInfo, 60000);

    function squeezeCandidates() {
      const out = [];
      allMarket.symbols.forEach((sym) => {
        const row = allMarket.bySymbol[sym];
        if (!row) return;
        if (row.fundingIntervalHours === 1 || (row.fundingPct != null && row.fundingPct <= -0.5) || row.oneHourSpike) {
          out.push(row);
        }
      });
      out.sort((a, b) => (a.fundingPct || 0) - (b.fundingPct || 0));
      return out.slice(0, 40);
    }

    function oiPollList() {
      const seen = new Set();
      const out = [];
      function add(sym) {
        if (!sym) return;
        const u = String(sym).toUpperCase();
        if (seen.has(u)) return;
        seen.add(u);
        out.push(marketEntry(u));
      }
      WATCHLIST_SYMBOLS.forEach(add);
      if (allMarket.stickySymbol) add(allMarket.stickySymbol);
      squeezeCandidates().forEach((row) => add(row.symbol));
      return out.slice(0, 50);
    }

    let oiBackoffUntil = 0;
    async function pollCandidateOi() {
      if (Date.now() < oiBackoffUntil) return;
      const list = oiPollList();
      for (let i = 0; i < list.length; i += 8) {
        const batch = list.slice(i, i + 8);
        let hitLimit = false;
        await Promise.all(batch.map(async (row) => {
          try {
            const res = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=" + encodeURIComponent(row.symbol));
            if (res.status === 429 || res.status === 418) {
              hitLimit = true;
              return;
            }
            if (!res.ok) return;
            const data = await res.json();
            const qty = parseFloat(data.openInterest);
            if (!isFinite(qty)) return;
            const notional = qty * (row.price || 0);
            row.oiQty = qty;
            row.oiNotional = notional;
            row._oiHist = row._oiHist || [];
            const now = Date.now();
            const last = row._oiHist[row._oiHist.length - 1];
            if (!last || now - last.t >= 40000) {
              row._oiHist.push({ t: now, v: notional });
              if (row._oiHist.length > 12) row._oiHist.shift();
            } else {
              last.v = notional;
              last.t = now;
            }
            const aged = row._oiHist.find((s) => now - s.t >= 120000) || row._oiHist[0];
            row.oiTrendPct = aged && aged.v > 0 ? ((notional - aged.v) / aged.v) * 100 : 0;
            classifyMarketRow(row);
          } catch (e) { /* aday bazında yoksay */ }
        }));
        if (hitLimit) {
          oiBackoffUntil = Date.now() + 60000;
          break;
        }
      }
      evaluateSqueezeAlerts();
      allMarket.notify();
    }
    setTimeout(pollCandidateOi, 4000);
    setInterval(pollCandidateOi, 45000);

    let tickerGen = 0;
    let tickerRetryMs = 1000;
    let lastUiNotify = 0;
    function connectTicker(myGen) {
      if (myGen !== tickerGen) return;
      const ws = new WebSocket("wss://fstream.binance.com/ws/!ticker@arr");
      ws.onopen = () => { tickerRetryMs = 1000; };
      ws.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const arr = Array.isArray(msg) ? msg : msg.data;
        if (!Array.isArray(arr)) return;
        arr.forEach((t) => {
          const raw = t.s;
          if (!raw || !raw.endsWith("USDT") || raw.indexOf("_") !== -1) return;
          const row = allMarket.bySymbol[raw] || marketEntry(raw);
          row.price = parseFloat(t.c);
          row.changePct = parseFloat(t.P);
          row.quoteVol = parseFloat(t.q);
          if (hub[raw]) feedAlertHubFromMarket(raw);
        });
        const now = Date.now();
        if (now - lastUiNotify > 800) {
          lastUiNotify = now;
          allMarket.notify();
        }
      };
      ws.onclose = () => {
        if (myGen !== tickerGen) return;
        setTimeout(() => connectTicker(myGen), tickerRetryMs);
        tickerRetryMs = Math.min(tickerRetryMs * 2, 30000);
      };
      ws.onerror = () => ws.close();
    }
    connectTicker(tickerGen);

    async function pollTicker24h() {
      try {
        const res = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr");
        if (res.status === 429 || res.status === 418) {
          ticker24BackoffMs = Math.min((ticker24BackoffMs || 20000) * 2, 120000);
          return;
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        ticker24BackoffMs = 20000;
        const arr = await res.json();
        if (!Array.isArray(arr)) return;
        arr.forEach((t) => {
          const raw = t.symbol;
          if (!raw || !raw.endsWith("USDT") || raw.indexOf("_") !== -1) return;
          const row = allMarket.bySymbol[raw] || marketEntry(raw);
          const px = parseFloat(t.lastPrice);
          const ch = parseFloat(t.priceChangePercent);
          const qv = parseFloat(t.quoteVolume);
          if (isFinite(px)) row.price = px;
          if (isFinite(ch)) row.changePct = ch;
          if (isFinite(qv)) row.quoteVol = qv;
        });
        allMarket.notify();
      } catch (e) {
        console.error("[Market] 24hr ticker alınamadı:", e.message || e);
      }
    }
    let ticker24BackoffMs = 20000;
    function loopTicker24h() {
      pollTicker24h().finally(() => setTimeout(loopTicker24h, ticker24BackoffMs));
    }
    loopTicker24h();

    setInterval(sampleMinuteVolumesAndAlert, 60000);

    let mtfKlineWs = null;
    let mtfKlineGen = 0;
    let mtfSeedGen = 0;
    let mtfSeedDone = false;
    let mtfSeedStarted = false;
    let mtfRetryMs = 1000;
    let mtfSubscribed = new Set();
    let engulfPendingHits = [];
    let engulfFlushTimer = null;
    let divPendingHits = [];
    let divFlushTimer = null;

    const MTF_TF_RANK = { "4h": 4, "1h": 3, "15m": 2, "5m": 1 };
    const ENGULF_COOLDOWN_MS = {
      "5m": 20 * 60 * 1000,
      "15m": 45 * 60 * 1000,
      "1h": 3 * 60 * 60 * 1000,
      "4h": 8 * 60 * 60 * 1000,
    };
    const DIV_COOLDOWN_MS = {
      "5m": 25 * 60 * 1000,
      "15m": 60 * 60 * 1000,
      "1h": 4 * 60 * 60 * 1000,
      "4h": 10 * 60 * 60 * 1000,
    };

    function engulfTimeframes() {
      const tfs = marketEngine.engulfIntervals;
      return Array.isArray(tfs) && tfs.length ? tfs : ["5m", "15m", "1h", "4h"];
    }
    function divTimeframes() {
      const tfs = marketEngine.divIntervals;
      return Array.isArray(tfs) && tfs.length ? tfs : ["5m", "15m", "1h", "4h"];
    }
    function mtfKlineEnabled() {
      return !!(marketEngine.engulfAlerts || marketEngine.divAlerts);
    }
    function mtfScanTimeframes() {
      const set = new Set();
      if (marketEngine.engulfAlerts) engulfTimeframes().forEach((tf) => set.add(tf));
      if (marketEngine.divAlerts) divTimeframes().forEach((tf) => set.add(tf));
      return Array.from(set);
    }

    function mtfUniverse() {
      const minQ = Math.max(marketEngine.engulfMinDayQuote || 8000000, marketEngine.divMinDayQuote || 8000000);
      const tfCount = Math.max(1, mtfScanTimeframes().length);
      const requested = Math.min(marketEngine.engulfMaxStreams || 200, marketEngine.divMaxStreams || 180);
      const cap = Math.min(requested, Math.floor(1000 / tfCount));
      return allMarket.symbols
        .map((s) => allMarket.bySymbol[s])
        .filter((r) => r && (r.quoteVol || 0) >= minQ)
        .sort((a, b) => (b.quoteVol || 0) - (a.quoteVol || 0))
        .slice(0, cap)
        .map((r) => r.symbol);
    }
    function engulfUniverse() { return mtfUniverse(); }

    function mtfStreamList(symbols) {
      const tfs = mtfScanTimeframes();
      const out = [];
      symbols.forEach((s) => tfs.forEach((tf) => out.push(s.toLowerCase() + "@kline_" + tf)));
      return out;
    }
    function engulfStreamList(symbols) { return mtfStreamList(symbols); }

    function refreshEngulfFlags(row) {
      const tfs = engulfTimeframes();
      const minBody = marketEngine.engulfMinBodyPct || 0.12;
      const active = [];
      tfs.forEach((tf) => {
        const arr = (row._klinesByTf && row._klinesByTf[tf]) || [];
        const prev = arr[arr.length - 2];
        const curr = arr[arr.length - 1];
        const bodyPct = curr && curr.c ? (Math.abs(curr.c - curr.o) / curr.c) * 100 : 0;
        if (isBullishEngulf(prev, curr) && bodyPct >= minBody) active.push(tf);
      });
      row.engulfTfs = active;
      row.bullishEngulf = active.length > 0;
    }

    function flushEngulfHits() {
      engulfFlushTimer = null;
      const hits = engulfPendingHits;
      engulfPendingHits = [];
      if (!marketEngine.engulfAlerts || !hits.length) return;
      hits.sort((a, b) => {
        const rank = (MTF_TF_RANK[b.tf] || 0) - (MTF_TF_RANK[a.tf] || 0);
        return rank || (b.bodyPct - a.bodyPct);
      });
      hits.slice(0, 4).forEach((h) => {
        const loud = h.tf === "1h" || h.tf === "4h" || h.bodyPct >= 0.6;
        fireMarketAlert({
          type: "engulf:" + h.tf,
          symbol: h.symbol,
          title: "Bullish Engulf · " + h.tf,
          desc: `${h.symbol} · ${h.tf} gövde %${h.bodyPct.toFixed(2)} · ${formatUsdCompact(h.quote)}`,
          sound: loud ? "siren" : "soft",
          cooldownMs: ENGULF_COOLDOWN_MS[h.tf] || 20 * 60 * 1000,
        });
      });
      allMarket.notify();
    }

    function refreshDivFlags(row) {
      const tfs = divTimeframes();
      const tags = [];
      let bestHint = null;
      tfs.forEach((tf) => {
        const pack = row._divByTf && row._divByTf[tf];
        if (!pack || !pack.signal) return;
        const sig = pack.signal;
        if (sig.bear) {
          const lvl = sig.bear.level;
          tags.push({ tf, lvl, side: "bear", label: lvl >= 2 ? "⚠️ OI+RSI Div" : (sig.bear.rsi ? "RSI Div" : "OI Div") });
          if (!bestHint || lvl >= (bestHint.level || 0)) {
            bestHint = { tf, level: lvl, label: (lvl >= 2 ? "⚠️ OI+RSI Div · " : "⚠️ Div · ") + tf + " Bear" };
          }
        }
        if (sig.bull) {
          const lvl = sig.bull.level;
          tags.push({ tf, lvl, side: "bull", label: lvl >= 2 ? "⚠️ OI+RSI Div" : (sig.bull.rsi ? "RSI Div" : "OI Div") });
          if (!bestHint || lvl >= (bestHint.level || 0)) {
            bestHint = { tf, level: lvl, label: (lvl >= 2 ? "⚠️ OI+RSI Div · " : "⚠️ Div · ") + tf + " Bull" };
          }
        }
      });
      row.divTfs = tags.map((t) => t.tf + (t.lvl >= 2 ? "*" : ""));
      row.divActive = tags.length > 0;
      row.divBadge = tags.length ? tags.sort((a, b) => b.lvl - a.lvl)[0].label + (tags.length > 1 ? " +" + (tags.length - 1) : "") : "";
      row.divChartHint = bestHint;
    }

    function queueDivAlert(row, tf, sig) {
      if (!marketEngine.divAlerts) return;
      if ((row.quoteVol || 0) < (marketEngine.divMinDayQuote || 8000000)) return;
      const sides = [];
      if (sig.bear) sides.push({ side: "bear", level: sig.bear.level, detail: sig.bear });
      if (sig.bull) sides.push({ side: "bull", level: sig.bull.level, detail: sig.bull });
      sides.forEach((s) => {
        divPendingHits.push({
          symbol: row.symbol,
          tf,
          side: s.side,
          level: s.level,
          detail: s.detail,
        });
      });
      if (!divFlushTimer) divFlushTimer = setTimeout(flushDivHits, 1500);
    }

    function flushDivHits() {
      divFlushTimer = null;
      const hits = divPendingHits;
      divPendingHits = [];
      if (!marketEngine.divAlerts || !hits.length) return;
      hits.sort((a, b) => {
        const rank = (MTF_TF_RANK[b.tf] || 0) - (MTF_TF_RANK[a.tf] || 0);
        return rank || (b.level - a.level);
      });
      hits.slice(0, 4).forEach((h) => {
        const bear = h.side === "bear";
        const lvl2 = h.level >= 2;
        const parts = [];
        if (h.detail.oi) parts.push("OI");
        if (h.detail.rsi) parts.push("RSI");
        const title = lvl2
          ? `🔥🔥 ${h.tf.toUpperCase()} DOUBLE DIV`
          : `⚠️ ${h.tf} ${parts.join("+")} Div`;
        const desc = `${h.symbol} · ${h.tf} · ${bear ? "Bearish" : "Bullish"} ${parts.join("+")} uyumsuzluk${lvl2 ? " · High Probability Reversal" : ""}`;
        fireMarketAlert({
          type: "div:" + h.tf + ":" + h.side,
          symbol: h.symbol,
          interval: h.tf,
          title,
          desc,
          sound: lvl2 ? "div-double" : "soft",
          cooldownMs: DIV_COOLDOWN_MS[h.tf] || 45 * 60 * 1000,
        });
      });
      allMarket.notify();
    }

    function updateDivPack(row, tf, candle) {
      if (!marketEngine.divAlerts || divTimeframes().indexOf(tf) === -1) return;
      row._divByTf = row._divByTf || {};
      const pack = row._divByTf[tf] = row._divByTf[tf] || { candles: [], oi: [], rsi: [], signal: null };
      const last = pack.candles[pack.candles.length - 1];
      if (last && last.t === candle.t) pack.candles[pack.candles.length - 1] = candle;
      else pack.candles.push(candle);
      const maxLen = marketEngine.divLookback || 40;
      if (pack.candles.length > maxLen) pack.candles.splice(0, pack.candles.length - maxLen);
      pack.rsi = computeRsiSeries(pack.candles.map((c) => c.c), 14);
      if (pack.oi.length !== pack.candles.length) {
        pack.oi = new Array(pack.candles.length).fill(null);
      }
      const sig = analyzeOIRsiDivergence(pack.candles, pack.oi, pack.rsi);
      pack.signal = sig;
      refreshDivFlags(row);
      const alertKey = sig
        ? `${candle.t}:${sig.bear ? "B" + sig.bear.level : ""}${sig.bull ? "L" + sig.bull.level : ""}`
        : "";
      if (sig && alertKey !== pack._alertKey) {
        pack._alertKey = alertKey;
        queueDivAlert(row, tf, sig);
      }
      fetch(futuresOiHistUrl(row.symbol, tf, 3), { signal: AbortSignal.timeout(8000) })
        .then((r) => r.ok ? r.json() : null)
        .then((raw) => {
          if (!Array.isArray(raw) || !raw.length) return;
          const latest = parseFloat(raw[raw.length - 1].sumOpenInterestValue);
          if (!isFinite(latest)) return;
          if (pack.candles.length) pack.oi[pack.candles.length - 1] = latest;
          const sig2 = analyzeOIRsiDivergence(pack.candles, pack.oi, pack.rsi);
          pack.signal = sig2;
          refreshDivFlags(row);
          allMarket.notify();
        }).catch(() => { /* yoksay */ });
    }

    function onClosedKline(sym, tf, candle) {
      if (!tf) return;
      const row = marketEntry(sym);
      if (marketEngine.engulfAlerts && engulfTimeframes().indexOf(tf) !== -1) {
        row._klinesByTf = row._klinesByTf || {};
        const arr = row._klinesByTf[tf] = row._klinesByTf[tf] || [];
        const last = arr[arr.length - 1];
        if (last && last.t === candle.t) arr[arr.length - 1] = candle;
        else arr.push(candle);
        if (arr.length > 6) arr.splice(0, arr.length - 6);
        refreshEngulfFlags(row);
        if (row.bullishEngulf && (row.engulfTfs || []).indexOf(tf) !== -1
          && (row.quoteVol || 0) >= (marketEngine.engulfMinDayQuote || 8000000)) {
          const curr = arr[arr.length - 1];
          const bodyPct = curr && curr.c ? (Math.abs(curr.c - curr.o) / curr.c) * 100 : 0;
          engulfPendingHits.push({ symbol: row.symbol, tf, bodyPct, quote: candle.q || 0 });
          if (!engulfFlushTimer) engulfFlushTimer = setTimeout(flushEngulfHits, 1500);
        }
      }
      updateDivPack(row, tf, candle);
    }

    function handleKlineMessage(msg) {
      const d = msg && msg.data ? msg.data : msg;
      const k = d && d.k;
      if (!k || !k.x) return;
      const sym = d.s || k.s;
      if (!sym || !sym.endsWith("USDT") || sym.indexOf("_") !== -1) return;
      onClosedKline(sym, k.i, {
        t: k.t,
        o: parseFloat(k.o),
        h: parseFloat(k.h),
        l: parseFloat(k.l),
        c: parseFloat(k.c),
        q: parseFloat(k.q),
      });
    }

    async function seedMtfKlines(symbols) {
      const mySeed = ++mtfSeedGen;
      const tfs = ["4h", "1h", "15m", "5m"].filter((tf) => mtfScanTimeframes().indexOf(tf) !== -1);
      const divLimit = marketEngine.divLookback || 40;
      for (const interval of tfs) {
        if (mySeed !== mtfSeedGen || !mtfKlineEnabled()) return;
        const needDiv = marketEngine.divAlerts && divTimeframes().indexOf(interval) !== -1;
        const needEng = marketEngine.engulfAlerts && engulfTimeframes().indexOf(interval) !== -1;
        for (let i = 0; i < symbols.length; i += 6) {
          if (mySeed !== mtfSeedGen || !mtfKlineEnabled()) return;
          const batch = symbols.slice(i, i + 6);
          await Promise.all(batch.map(async (sym) => {
            try {
              const kLimit = needDiv ? divLimit + 1 : 4;
              const res = await fetch(futuresKlinesUrl(sym, interval, kLimit), { signal: AbortSignal.timeout(10000) });
              if (!res.ok) return;
              const raw = await res.json();
              if (!Array.isArray(raw) || raw.length < 3) return;
              const closed = raw.slice(0, -1).map((d) => ({
                t: d[0],
                o: parseFloat(d[1]),
                h: parseFloat(d[2]),
                l: parseFloat(d[3]),
                c: parseFloat(d[4]),
                q: parseFloat(d[7]),
              }));
              const row = marketEntry(sym);
              if (needEng) {
                row._klinesByTf = row._klinesByTf || {};
                row._klinesByTf[interval] = closed.slice(-3);
              }
              if (needDiv) {
                let oiRaw = [];
                try {
                  const oiRes = await fetch(futuresOiHistUrl(sym, interval, Math.min(divLimit, 30)), { signal: AbortSignal.timeout(10000) });
                  if (oiRes.ok) oiRaw = await oiRes.json();
                } catch (e) { /* oi seed yoksay */ }
                row._divByTf = row._divByTf || {};
                const pack = row._divByTf[interval] = row._divByTf[interval] || { candles: [], oi: [], rsi: [], signal: null };
                pack.candles = closed.slice(-divLimit);
                pack.oi = alignOiToCandles(pack.candles, oiRaw);
                pack.rsi = computeRsiSeries(pack.candles.map((c) => c.c), 14);
                pack.signal = analyzeOIRsiDivergence(pack.candles, pack.oi, pack.rsi);
              }
            } catch (e) { /* sembol bazında yoksay */ }
          }));
          await new Promise((r) => setTimeout(r, 400));
        }
        if (mySeed !== mtfSeedGen) return;
        symbols.forEach((sym) => {
          const row = marketEntry(sym);
          refreshEngulfFlags(row);
          refreshDivFlags(row);
        });
        allMarket.notify();
      }
      if (mySeed !== mtfSeedGen) return;
      mtfSeedDone = true;
      allMarket.notify();
    }

    function connectMtfKlineWs() {
      mtfKlineGen++;
      const myGen = mtfKlineGen;
      try { if (mtfKlineWs) mtfKlineWs.close(); } catch (e) { /* yoksay */ }
      mtfSubscribed = new Set();
      if (!mtfKlineEnabled()) return;
      const symbols = mtfUniverse();
      if (!symbols.length) {
        setTimeout(() => { if (myGen === mtfKlineGen) connectMtfKlineWs(); }, 8000);
        return;
      }
      if (!mtfSeedStarted) {
        mtfSeedStarted = true;
        seedMtfKlines(symbols);
      }
      const ws = new WebSocket("wss://fstream.binance.com/ws");
      mtfKlineWs = ws;
      ws.onopen = () => {
        mtfRetryMs = 1000;
        const streams = mtfStreamList(symbols);
        let i = 0;
        function sendBatch() {
          if (myGen !== mtfKlineGen || ws.readyState !== 1) return;
          const chunk = streams.slice(i, i + 40);
          if (!chunk.length) return;
          i += 40;
          ws.send(JSON.stringify({ method: "SUBSCRIBE", params: chunk, id: i }));
          chunk.forEach((st) => mtfSubscribed.add(st));
          if (i < streams.length) setTimeout(sendBatch, 250);
        }
        sendBatch();
      };
      ws.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        if (msg && msg.result === undefined && !msg.k && !(msg.data && msg.data.k) && !Array.isArray(msg)) return;
        if (Array.isArray(msg)) { msg.forEach(handleKlineMessage); return; }
        handleKlineMessage(msg);
      };
      ws.onclose = () => {
        if (myGen !== mtfKlineGen) return;
        setTimeout(() => { if (myGen === mtfKlineGen) connectMtfKlineWs(); }, mtfRetryMs);
        mtfRetryMs = Math.min(mtfRetryMs * 2, 30000);
      };
      ws.onerror = () => ws.close();
    }

    function restartMtfKline() {
      mtfSeedStarted = false;
      mtfSeedDone = false;
      connectMtfKlineWs();
    }
    allMarket.restartEngulf = restartMtfKline;
    allMarket.restartDiv = restartMtfKline;
    allMarket.restartMtfKline = restartMtfKline;
    allMarket.engulfInfo = function () {
      return {
        alerts: !!marketEngine.engulfAlerts,
        divAlerts: !!marketEngine.divAlerts,
        tfs: mtfScanTimeframes(),
        streams: mtfSubscribed.size,
        universe: mtfUniverse().length,
        seedDone: mtfSeedDone,
      };
    };
    window.__engulfInfo = allMarket.engulfInfo;
    setTimeout(connectMtfKlineWs, 6000);
    setInterval(() => {
      if (!mtfKlineEnabled()) return;
      const next = new Set(mtfStreamList(mtfUniverse()));
      let same = next.size === mtfSubscribed.size;
      if (same) next.forEach((s) => { if (!mtfSubscribed.has(s)) same = false; });
      if (!same) restartMtfKline();
    }, 5 * 60 * 1000);
  }

  function ensureHubEntry(symbol) {
    if (!hub[symbol]) hub[symbol] = { price: null, closes: [], rsi: null, fundingRate: null, oiHistory: [], _conns: {} };
    return hub[symbol];
  }

  function hubNeedsType(symbol, type) {
    return alertsStore.alerts.some((a) => a.enabled && a.symbol === symbol && a.conditions.some((c) => c.type === type));
  }

  function symbolsNeeded() {
    const set = new Set();
    alertsStore.alerts.forEach((a) => { if (a.enabled) set.add(a.symbol); });
    return set;
  }

  // Fiyat, allMarket !ticker@arr uzerinden gelir - ekstra WS acilmaz (ban korumasi).
  function hubEnsurePriceConn(symbol) {
    const entry = ensureHubEntry(symbol);
    const row = allMarket.bySymbol[symbol];
    if (row && row.price != null) entry.price = row.price;
  }

  // RSI icin kapanan 1dk mumlari
  function hubEnsureRsiConn(symbol) {
    const entry = ensureHubEntry(symbol);
    if (entry._conns.rsi) return;
    let stopped = false;
    let retryMs = 1000;
    (async () => {
      try {
        const res = await fetch(futuresKlinesUrl(symbol, "1m", 100));
        const raw = await res.json();
        entry.closes = raw.map((d) => parseFloat(d[4]));
        entry.rsi = computeRsi(entry.closes, 14);
      } catch (e) { console.error("[Alarm] Gecmis kapanislar alinamadi:", e); }
    })();
    function connect() {
      if (stopped) return;
      const ws = new WebSocket(futuresKlineWsUrl(symbol, "1m"));
      ws.onopen = () => { retryMs = 1000; };
      ws.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const k = msg.k;
        if (!k || !k.x) return;
        entry.closes.push(parseFloat(k.c));
        if (entry.closes.length > 200) entry.closes.shift();
        entry.rsi = computeRsi(entry.closes, 14);
        evaluateAlertsForSymbol(symbol);
      };
      ws.onclose = () => { if (!stopped) setTimeout(connect, retryMs); retryMs = Math.min(retryMs * 2, 30000); };
      ws.onerror = () => ws.close();
    }
    connect();
    entry._conns.rsi = { stop: () => { stopped = true; } };
  }

  // Funding, premiumIndex toplu poll'dan gelir - ekstra WS acilmaz.
  function hubEnsureFundingConn(symbol) {
    const entry = ensureHubEntry(symbol);
    const row = allMarket.bySymbol[symbol];
    if (row && row.fundingPct != null) entry.fundingRate = row.fundingPct;
  }

  // Open Interest sicramasi icin REST polling + kayan pencere
  function hubEnsureOiConn(symbol) {
    const entry = ensureHubEntry(symbol);
    if (entry._conns.oi) return;
    let stopped = false;
    async function poll() {
      if (stopped) return;
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${symbol}`);
        const data = await res.json();
        const v = parseFloat(data.openInterest);
        entry.oiHistory.push({ t: Date.now(), v });
        const cutoff = Date.now() - 5 * 60 * 1000; // son 5 dakikayi tut
        entry.oiHistory = entry.oiHistory.filter((p) => p.t >= cutoff);
        evaluateAlertsForSymbol(symbol);
      } catch (e) { console.error("[Alarm] Open Interest alinamadi:", e); }
      if (!stopped) setTimeout(poll, 5000);
    }
    poll();
    entry._conns.oi = { stop: () => { stopped = true; } };
  }

  function computeRsi(closes, period) {
    if (closes.length < period + 1) return null;
    const slice = closes.slice(-(period + 1));
    let gain = 0, loss = 0;
    for (let i = 1; i < slice.length; i++) {
      const diff = slice[i] - slice[i - 1];
      if (diff >= 0) gain += diff; else loss -= diff;
    }
    const avgGain = gain / period, avgLoss = loss / period;
    if (avgLoss === 0) return 100;
    return 100 - 100 / (1 + avgGain / avgLoss);
  }

  function computeRsiSeries(closes, period) {
    const out = new Array(closes.length).fill(null);
    for (let i = period; i < closes.length; i++) {
      out[i] = computeRsi(closes.slice(0, i + 1), period);
    }
    return out;
  }

  function findSwingHighs(candles, wing) {
    wing = wing || 2;
    const swings = [];
    for (let i = wing; i < candles.length - wing; i++) {
      const h = candles[i].h;
      let ok = true;
      for (let j = i - wing; j <= i + wing; j++) {
        if (j === i) continue;
        if (candles[j].h >= h) { ok = false; break; }
      }
      if (ok) swings.push({ i, v: h });
    }
    return swings;
  }

  function findSwingLows(candles, wing) {
    wing = wing || 2;
    const swings = [];
    for (let i = wing; i < candles.length - wing; i++) {
      const l = candles[i].l;
      let ok = true;
      for (let j = i - wing; j <= i + wing; j++) {
        if (j === i) continue;
        if (candles[j].l <= l) { ok = false; break; }
      }
      if (ok) swings.push({ i, v: l });
    }
    return swings;
  }

  function alignOiToCandles(candles, oiRaw) {
    if (!candles.length || !Array.isArray(oiRaw)) return [];
    const oi = new Array(candles.length).fill(null);
    oiRaw.forEach((p) => {
      const ts = p.timestamp || p.t;
      const val = p.sumOpenInterestValue != null ? parseFloat(p.sumOpenInterestValue)
        : (p.v != null ? p.v : parseFloat(p.sumOpenInterest));
      if (!isFinite(val)) return;
      let best = -1, bestD = Infinity;
      candles.forEach((c, idx) => {
        const d = Math.abs(c.t - ts);
        if (d < bestD) { bestD = d; best = idx; }
      });
      if (best >= 0 && bestD < 7200000) oi[best] = val;
    });
    let last = null;
    for (let i = 0; i < oi.length; i++) {
      if (oi[i] != null) last = oi[i];
      else if (last != null) oi[i] = last;
    }
    return oi;
  }

  function analyzeOIRsiDivergence(candles, oiSeries, rsiSeries) {
    const minLen = 18;
    if (!candles || candles.length < minLen || !oiSeries || oiSeries.length !== candles.length) return null;
    const rsi = rsiSeries || computeRsiSeries(candles.map((c) => c.c), 14);
    const highs = findSwingHighs(candles);
    const lows = findSwingLows(candles);
    let bear = null, bull = null;
    if (highs.length >= 2) {
      const h1 = highs[highs.length - 2], h2 = highs[highs.length - 1];
      if (h2.v >= h1.v * 1.001) {
        const oi1 = oiSeries[h1.i], oi2 = oiSeries[h2.i];
        const r1 = rsi[h1.i], r2 = rsi[h2.i];
        const oiBear = oi1 != null && oi2 != null && oi2 <= oi1 * 1.003;
        const rsiBear = r1 != null && r2 != null && r2 < r1 - 0.8;
        if (oiBear || rsiBear) {
          bear = { oi: !!oiBear, rsi: !!rsiBear, level: (oiBear && rsiBear) ? 2 : 1 };
        }
      }
    }
    if (lows.length >= 2) {
      const l1 = lows[lows.length - 2], l2 = lows[lows.length - 1];
      if (l2.v <= l1.v * 0.999) {
        const oi1 = oiSeries[l1.i], oi2 = oiSeries[l2.i];
        const r1 = rsi[l1.i], r2 = rsi[l2.i];
        const oiBull = oi1 != null && oi2 != null && oi2 <= oi1 * 0.997;
        const rsiBull = r1 != null && r2 != null && r2 > r1 + 0.8;
        if (oiBull || rsiBull) {
          bull = { oi: !!oiBull, rsi: !!rsiBull, level: (oiBull && rsiBull) ? 2 : 1 };
        }
      }
    }
    if (!bear && !bull) return null;
    return { bear, bull };
  }

  // OI'nin son 5 dakikadaki en eski degerine gore yuzde degisimi
  function oiPctChange(entry) {
    if (entry.oiHistory.length < 2) return null;
    const first = entry.oiHistory[0].v;
    const last = entry.oiHistory[entry.oiHistory.length - 1].v;
    if (!first) return null;
    return ((last - first) / first) * 100;
  }

  // Kullanilan sembollere gore gerekli hub baglantilarini acar/kapatir
  function syncHubConnections() {
    const needed = symbolsNeeded();
    needed.forEach((symbol) => {
      if (hubNeedsType(symbol, "price")) hubEnsurePriceConn(symbol);
      if (hubNeedsType(symbol, "rsi")) hubEnsureRsiConn(symbol);
      if (hubNeedsType(symbol, "funding")) hubEnsureFundingConn(symbol);
      if (hubNeedsType(symbol, "oi_spike")) hubEnsureOiConn(symbol);
    });
    // artik hicbir etkin alarmin kullanmadigi sembollerin baglantilarini kapat
    Object.keys(hub).forEach((symbol) => {
      if (!needed.has(symbol)) {
        Object.values(hub[symbol]._conns).forEach((c) => c.stop && c.stop());
        delete hub[symbol];
      }
    });
  }

  function evaluateCondition(entry, cond) {
    if (!entry) return false;
    if (cond.type === "price") {
      if (entry.price === null) return false;
      return cond.operator === ">" ? entry.price > cond.value : entry.price < cond.value;
    }
    if (cond.type === "rsi") {
      if (entry.rsi === null) return false;
      return cond.operator === ">" ? entry.rsi > cond.value : entry.rsi < cond.value;
    }
    if (cond.type === "funding") {
      if (entry.fundingRate === null) return false;
      return cond.operator === ">" ? entry.fundingRate > cond.value : entry.fundingRate < cond.value;
    }
    if (cond.type === "oi_spike") {
      const pct = oiPctChange(entry);
      if (pct === null) return false;
      return Math.abs(pct) > cond.value;
    }
    return false;
  }

  function describeCondition(c) {
    const labels = { price: "Fiyat", rsi: "RSI", funding: "Funding Rate", oi_spike: "OI değişimi (%5dk)" };
    const opLabel = c.type === "oi_spike" ? "mutlak >" : c.operator;
    return `${labels[c.type]} ${opLabel} ${c.value}`;
  }

  function describeAlert(alert) {
    return `${alert.symbol}: ` + alert.conditions.map(describeCondition).join(` ${alert.logic} `);
  }

  function evaluateAlertsForSymbol(symbol) {
    const entry = hub[symbol];
    alertsStore.alerts.forEach((alert) => {
      if (!alert.enabled || alert.symbol !== symbol) return;
      const results = alert.conditions.map((c) => evaluateCondition(entry, c));
      const combined = alert.logic === "AND" ? results.every(Boolean) : results.some(Boolean);
      if (combined && !alert._wasTrue) {
        fireAlert(alert, describeAlert(alert));
      }
      alert._wasTrue = combined;
    });
  }

  // --- Alarm CRUD --------------------------------------------------------
  function makeAlertId() { return "alert-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)); }

  function addAlert(alert) {
    alert.id = makeAlertId();
    alert.enabled = true;
    alert._wasTrue = false;
    alertsStore.alerts.push(alert);
    persistAlertsStore();
    syncHubConnections();
    renderAlertList();
    updateAlertButtonBadge();
  }
  function toggleAlert(id) {
    const alert = alertsStore.alerts.find((a) => a.id === id);
    if (!alert) return;
    alert.enabled = !alert.enabled;
    alert._wasTrue = false;
    persistAlertsStore();
    syncHubConnections();
    renderAlertList();
    updateAlertButtonBadge();
  }
  function deleteAlert(id) {
    alertsStore.alerts = alertsStore.alerts.filter((a) => a.id !== id);
    persistAlertsStore();
    syncHubConnections();
    renderAlertList();
    updateAlertButtonBadge();
  }
  function updateAlertButtonBadge() {

    btn.classList.toggle("has-alerts", activeCount > 0);

  let pendingConditions = [];
  let pendingLogic = "AND";
  const CONDITION_TYPES = [
    { value: "price", label: "Fiyat" },
    { value: "rsi", label: "RSI (14, 1dk mumlar)" },
    { value: "funding", label: "Funding Rate (%)" },
    { value: "oi_spike", label: "Open Interest sıçraması (son 5dk, %)" },
  ];

  let futuresSymbols = [];
  let futuresSymbolsPromise = null;

  function knownAlertSymbols() {
    const set = new Set(WATCHLIST_SYMBOLS.map((s) => s.toUpperCase()));
    futuresSymbols.forEach((s) => set.add(s));
    return set;
  }

  function loadFuturesSymbols() {
    if (futuresSymbolsPromise) return futuresSymbolsPromise;
    futuresSymbolsPromise = (async () => {
      try {
        const res = await fetch("https://fapi.binance.com/fapi/v1/exchangeInfo");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        futuresSymbols = (data.symbols || [])
          .filter((s) => s.status === "TRADING" && s.contractType === "PERPETUAL" && s.quoteAsset === "USDT")
          .map((s) => s.symbol)
          .sort();
      } catch (e) {
        console.error("[Alarm] Sembol listesi alınamadı:", e);
        futuresSymbols = WATCHLIST_SYMBOLS.map((s) => s.toUpperCase());
      }
      return futuresSymbols;
    })();
    return futuresSymbolsPromise;
  }

  function normalizeSymbolQuery(raw) {
    return String(raw || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  }

  function symbolMatchesQuery(sym, query) {
    const q = normalizeSymbolQuery(query);
    if (!q) return true;
    const base = sym.replace(/USDT$|USDC$/, "");
    return sym.indexOf(q) !== -1 || base.indexOf(q) !== -1;
  }

  function rankSymbol(sym, q) {
    if (!q) return 2;
    const base = sym.replace(/USDT$|USDC$/, "");
    if (base === q || sym === q) return 0;
    if (base.startsWith(q) || sym.startsWith(q)) return 1;
    return 2;
  }

  function filterAlertSymbols(query) {
    const q = normalizeSymbolQuery(query);
    const watchlist = WATCHLIST_SYMBOLS.map((s) => s.toUpperCase());
    const others = futuresSymbols.filter((s) => watchlist.indexOf(s) === -1);
    const byRank = (a, b) => rankSymbol(a, q) - rankSymbol(b, q) || a.localeCompare(b);
    return {
      watchlist: watchlist.filter((s) => symbolMatchesQuery(s, query)).sort(byRank),
      others: others.filter((s) => symbolMatchesQuery(s, query)).sort(byRank),
    };
  }

  function closeAlertSymbolCombo() {
    const list = document.getElementById("alert-symbol-combo-list");
    if (list) list.remove();
  }

  document.addEventListener("mousedown", (e) => {
    const list = document.getElementById("alert-symbol-combo-list");
    if (!list || !list.classList.contains("open")) return;
    const wrap = document.querySelector("#alert-modal-body .symbol-combo");
    if ((wrap && wrap.contains(e.target)) || list.contains(e.target)) return;
    closeAlertSymbolCombo();
  });
  document.addEventListener("scroll", () => {
    const list = document.getElementById("alert-symbol-combo-list");
    const input = document.getElementById("alert-symbol-input");
    if (!list || !list.classList.contains("open") || !input) return;
    const r = input.getBoundingClientRect();
    list.style.left = r.left + "px";
    list.style.top = (r.bottom + 4) + "px";
    list.style.width = Math.max(r.width, 180) + "px";
  }, true);

  function createSymbolCombobox(initialSymbol, onChange) {
    closeAlertSymbolCombo();
    const wrap = document.createElement("div");
    wrap.className = "symbol-combo";

    let selected = (initialSymbol || "BTCUSDT").toUpperCase();
    let activeIndex = -1;
    let visibleItems = [];

    const input = document.createElement("input");
    input.className = "alert-input";
    input.id = "alert-symbol-input";
    input.type = "text";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.placeholder = "Sembol seç veya yazarak ara";
    input.value = selected;
    input.style.textTransform = "uppercase";
    input.setAttribute("aria-autocomplete", "list");

    const list = document.createElement("div");
    list.className = "symbol-combo-list";
    list.id = "alert-symbol-combo-list";
    list.setAttribute("role", "listbox");

    function commit(sym) {
      selected = String(sym).toUpperCase();
      input.value = selected;
      pendingConditions._symbol = selected;
      if (typeof onChange === "function") onChange(selected);
      closeList();
    }

    function placeList() {
      const r = input.getBoundingClientRect();
      list.style.left = r.left + "px";
      list.style.top = (r.bottom + 4) + "px";
      list.style.width = Math.max(r.width, 180) + "px";
    }

    function closeList() {
      list.classList.remove("open");
      if (list.parentNode) list.parentNode.removeChild(list);
      activeIndex = -1;
    }

    function moveActive(delta) {
      if (!visibleItems.length) return;
      activeIndex = (activeIndex + delta + visibleItems.length) % visibleItems.length;
      visibleItems.forEach((btn, i) => btn.classList.toggle("active", i === activeIndex));
      visibleItems[activeIndex].scrollIntoView({ block: "nearest" });
    }

    function renderList() {
      const query = (selected && input.value.toUpperCase() === selected) ? "" : input.value;
      const grouped = filterAlertSymbols(query);
      const q = normalizeSymbolQuery(query);
      const maxOthers = q ? 80 : 30;
      const others = grouped.others.slice(0, maxOthers);
      const truncated = grouped.others.length > others.length;

      list.innerHTML = "";
      visibleItems = [];

      function addGroup(title, symbols) {
        if (!symbols.length) return;
        const head = document.createElement("div");
        head.className = "symbol-combo-group";
        head.textContent = title;
        list.appendChild(head);
        symbols.forEach((sym) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "symbol-combo-item";
          btn.setAttribute("role", "option");
          btn.innerHTML = `<span>${formatWatchlistLabel(sym)}</span><span class="sym-label">${sym}</span>`;
          if (sym === selected) btn.classList.add("active");
          btn.addEventListener("mousedown", (e) => { e.preventDefault(); commit(sym); });
          list.appendChild(btn);
          visibleItems.push(btn);
        });
      }

      addGroup("İzleme listesi", grouped.watchlist);
      addGroup(q ? "Eşleşen vadeli" : "Tüm vadeli USDT", others);

      if (!grouped.watchlist.length && !others.length) {
        const empty = document.createElement("div");
        empty.className = "symbol-combo-empty";
        empty.textContent = futuresSymbols.length ? "Eşleşen sembol yok." : "Sembol listesi yükleniyor…";
        list.appendChild(empty);
      } else if (!q) {
        const hint = document.createElement("div");
        hint.className = "symbol-combo-hint";
        hint.textContent = truncated
          ? `${grouped.others.length} sembol var — yazarak filtreleyin`
          : "Yazarak sembol arayabilirsiniz";
        list.appendChild(hint);
      } else if (truncated) {
        const hint = document.createElement("div");
        hint.className = "symbol-combo-hint";
        hint.textContent = `${grouped.others.length} eşleşme, ilk ${maxOthers} gösteriliyor`;
        list.appendChild(hint);
      }

      activeIndex = visibleItems.findIndex((btn) => btn.classList.contains("active"));
      if (q && visibleItems.length && activeIndex < 0) {
        activeIndex = 0;
        visibleItems[0].classList.add("active");
      }
    }

    function openList() {
      if (!list.parentNode) document.body.appendChild(list);
      renderList();
      placeList();
      list.classList.add("open");
    }

    input.addEventListener("focus", openList);
    input.addEventListener("click", openList);
    input.addEventListener("input", () => {
      selected = "";
      pendingConditions._symbol = "";
      openList();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); if (!list.classList.contains("open")) openList(); else moveActive(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); if (!list.classList.contains("open")) openList(); else moveActive(-1); }
      else if (e.key === "Enter") {
        if (list.classList.contains("open") && activeIndex >= 0 && visibleItems[activeIndex]) {
          e.preventDefault();
          visibleItems[activeIndex].dispatchEvent(new Event("mousedown"));
        }
      } else if (e.key === "Escape") {
        closeList();
      }
    });

    loadFuturesSymbols().then(() => {
      if (list.classList.contains("open")) renderList();
    });

    wrap.appendChild(input);

    return {
      el: wrap,
      getValue() {
        if (selected && knownAlertSymbols().has(selected)) return selected;
        const parsed = parseWatchlistSymbol(input.value);
        if (parsed && knownAlertSymbols().has(parsed.toUpperCase())) return parsed.toUpperCase();
        const grouped = filterAlertSymbols(input.value);
        const all = grouped.watchlist.concat(grouped.others);
        const q = normalizeSymbolQuery(input.value);
        const exactBase = all.filter((s) => s.replace(/USDT$|USDC$/, "") === q);
        if (exactBase.length === 1) return exactBase[0];
        if (all.length === 1) return all[0];
        return selected || "";
      },
    };
  }

  // =====================================================================
  // STICKY BAR (Funding Rate + geri sayim + Open Interest)
  // =====================================================================
  async function initStickyBar() {
    const saved = (await loadWithMigration(STICKY_KEY, (v) => v && typeof v === "object")) || {};
    let visible = saved.visible !== false;

    let symbol = "BTCUSDT";
    let currentTargetId = null;
    let generation = 0;
    let nextFundingTime = null;
    let lastFunding = null;
    let lastOI = null;

    const bar = document.getElementById("sticky-bar");
    const symbolEl = document.getElementById("sticky-symbol");
    const indicator = document.getElementById("sticky-indicator");
    const fundingEl = document.getElementById("sticky-funding");
    const countdownEl = document.getElementById("sticky-countdown");
    const oiEl = document.getElementById("sticky-oi");
    const targetSlot = document.getElementById("sticky-target-slot");
    const closeBtn = document.getElementById("sticky-close-btn");
    const showBtn = document.getElementById("sticky-show-btn");

    indicator.style.background = TARGET_COLORS[saved.targetId || DEFAULT_TARGET_ID];
    indicator.style.color = TARGET_COLORS[saved.targetId || DEFAULT_TARGET_ID];

    function persist(targetId) {
      idbSet(STICKY_KEY, { targetId, visible }); // fire-and-forget
    }

    function setVisible(v) {
      visible = v;
      bar.style.display = v ? "flex" : "none";
      showBtn.style.display = v ? "none" : "inline-flex";
      persist(currentTargetId || DEFAULT_TARGET_ID);
    }

    closeBtn.addEventListener("click", () => setVisible(false));
    showBtn.addEventListener("click", () => setVisible(true));

    function updateCountdown() {
      if (!nextFundingTime) { countdownEl.textContent = "—"; return; }
      const diff = nextFundingTime - Date.now();
      if (diff <= 0) { countdownEl.textContent = "00:00:00"; return; }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      countdownEl.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    setInterval(updateCountdown, 1000);

    let fundingWs = null;
    let fundingRetryMs = 1000;
    let fundingHeartbeat = null;
    let fundingFailCount = 0;
    let stopped = false;

    function connectFundingWs() {
      if (stopped) return;
      const myGen = generation;
      const mySymbol = symbol;
      fundingWs = new WebSocket(`wss://fstream.binance.com/market/ws/${mySymbol.toLowerCase()}@markPrice@1s`);
      fundingWs.onopen = () => { fundingRetryMs = 1000; fundingFailCount = 0; resetFundingHeartbeat(); };
      fundingWs.onmessage = (event) => {
        resetFundingHeartbeat();
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        if (msg.r === undefined) return;
        const rate = parseFloat(msg.r) * 100;
        if (lastFunding !== null && rate !== lastFunding) flashValue(fundingEl, rate >= lastFunding);
        fundingEl.textContent = `${rate >= 0 ? "+" : ""}${rate.toFixed(4)}%`;
        fundingEl.style.color = rate >= 0 ? "var(--up)" : "var(--down)";
        lastFunding = rate;
        nextFundingTime = msg.T;
        updateCountdown();
      };
      fundingWs.onclose = (ev) => {
        clearFundingHeartbeat();
        if (!stopped && myGen === generation) {
          fundingFailCount++;
          console.warn(`[Sticky Bar] markPrice WS kapandi (kod: ${ev.code}). Deneme: ${fundingFailCount}`);
          if (fundingFailCount >= 3 && lastFunding === null) {
            fundingEl.textContent = "bağlanamıyor";
            countdownEl.textContent = "—";
          }
          scheduleFundingReconnect(myGen);
        }
      };
      fundingWs.onerror = (ev) => {
        console.error("[Sticky Bar] markPrice WS hatasi - Futures WS'e erisim engelli olabilir (bolgesel kisitlama). Detay icin Network sekmesine bakin.", ev);
        fundingWs.close();
      };
    }
    function resetFundingHeartbeat() {
      clearFundingHeartbeat();
      fundingHeartbeat = setTimeout(() => fundingWs && fundingWs.close(), 60000);
    }
    function clearFundingHeartbeat() {
      if (fundingHeartbeat) { clearTimeout(fundingHeartbeat); fundingHeartbeat = null; }
    }
    function scheduleFundingReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === generation) connectFundingWs(); }, fundingRetryMs);
      fundingRetryMs = Math.min(fundingRetryMs * 2, 30000);
    }

    function paintOiFromMarket() {
      const m = allMarket.bySymbol[symbol];
      if (!m || m.oiQty == null || !isFinite(m.oiQty)) return;
      const oi = m.oiQty;
      if (lastOI !== null && oi !== lastOI) flashValue(oiEl, oi >= lastOI);
      oiEl.textContent = oi.toLocaleString("en-US", { maximumFractionDigits: 2 });
      lastOI = oi;
    }
    async function fetchStickyOiOnce() {
      const mySymbol = symbol;
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${mySymbol}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (mySymbol !== symbol) return;
        const oi = parseFloat(data.openInterest);
        if (!isFinite(oi)) return;
        const row = marketEntry(mySymbol);
        row.oiQty = oi;
        row.oiNotional = oi * (row.price || 0);
        paintOiFromMarket();
      } catch (e) {
        if (mySymbol !== symbol) return;
        console.error(`[Sticky Bar] Open Interest alinamadi: ${e.message}`);
        if (lastOI === null) oiEl.textContent = "erişilemiyor";
      }
    }
    function startOiPolling() {
      allMarket.stickySymbol = symbol;
      fetchStickyOiOnce();
      paintOiFromMarket();
    }

    function changeStickySymbol(newSymbolRaw) {
      const newSymbol = newSymbolRaw.toUpperCase();
      if (newSymbol === symbol) return;
      symbol = newSymbol;
      generation++;
      clearFundingHeartbeat();
      if (fundingWs) { try { fundingWs.close(); } catch (e) { /* yoksay */ } }
      fundingRetryMs = 1000;
      fundingFailCount = 0;

      lastFunding = null;
      lastOI = null;
      nextFundingTime = null;
      symbolEl.textContent = symbol;
      fundingEl.textContent = "—";
      fundingEl.style.color = "";
      oiEl.textContent = "—";
      countdownEl.textContent = "—";

      connectFundingWs();
      startOiPolling();
    }

    function subscribeToTarget(newTargetId) {
      if (currentTargetId !== null) targetBus.unsubscribe(currentTargetId, "sticky-bar");
      currentTargetId = newTargetId;
      targetBus.subscribe(currentTargetId, "sticky-bar", changeStickySymbol);
      persist(currentTargetId);
    }

    const targetGroupEl = createTargetButtonGroup(saved.targetId || DEFAULT_TARGET_ID, indicator, (newId) => {
      subscribeToTarget(newId);
    });
    targetSlot.appendChild(targetGroupEl);

    symbolEl.textContent = symbol;
    subscribeToTarget(saved.targetId || DEFAULT_TARGET_ID);
    connectFundingWs();
    allMarket.subscribe(paintOiFromMarket);
    startOiPolling();

    bar.style.display = visible ? "flex" : "none";
    showBtn.style.display = visible ? "none" : "inline-flex";
  }

  // =====================================================================
  // SAHNE YONETICISI (Scene Manager / Presets)
  // =====================================================================
  const SCENES_KEY = "crypto-dashboard-scenes-v1";
  let scenesStore = { scenes: [], activeSceneId: null };

  async function loadScenesStore() {
    const migrated = await loadWithMigration(SCENES_KEY, (v) => v && Array.isArray(v.scenes));
    return migrated || { scenes: [], activeSceneId: null };
  }

  function persistScenesStore() {
    idbSet(SCENES_KEY, scenesStore); // fire-and-forget
  }

  function findScene(id) {
    return scenesStore.scenes.find((s) => s.id === id);
  }

  function makeSceneId() {
    return "scene-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
  }

  // Su an ekrandaki GridStack duzenini (konum/boyut + panel tipi/sembol/target)
  // yakalar - hem otomatik kaydetme hem "Kaydet/Guncelle" butonu bunu kullanir.
  function captureCurrentGridData() {
    const nodes = grid.save(false); // sadece x/y/w/h/id - GridStack'in kendi alanlari
    const layout = nodes.map((n) => ({ id: n.id, x: n.x, y: n.y, w: n.w, h: n.h }));
    const meta = {};
    nodes.forEach((n) => {
      if (panelsMeta[n.id]) meta[n.id] = panelsMeta[n.id];
    });
    return { layout, meta };
  }

  // Aktif sahnenin icerigini gunceller. Panel eklendiginde/tasindiginde/
  // silindiginde veya sembol/target degistiginde otomatik cagrilir; ayrica
  // "Kaydet/Guncelle" butonu da aynen bunu tetikler.
  function saveLayout() {
    if (!scenesStore.activeSceneId) return;
    const scene = findScene(scenesStore.activeSceneId);
    if (!scene) return;
    const { layout, meta } = captureCurrentGridData();
    scene.layout = layout;
    scene.meta = meta;
    persistScenesStore();
  }

  grid.on("added removed change", () => saveLayout());

  function createPanelElement(type, id, symbol, targetId) {
    if (type === "watchlist") return createWatchlistPanel(id, targetId);
    if (type === "orderbook") return createOrderBookPanel(id, symbol, targetId);
    if (type === "lspos") return createLsPositionPanel(id, symbol, targetId);
    if (type === "heatmap") return createHeatmapPanel(id, symbol, targetId);
    if (type === "bot") return createBotPanel(id, symbol, targetId);
    if (type === "frscan") return createFrScanPanel(id, targetId);
    if (type === "checklist") return createChecklistPanel(id, targetId);
    if (type === "mscanner") return createMarketScannerPanel(id, targetId);
    if (type === "volradar") return createVolRadarPanel(id, targetId);
    return createChartPanel(id, symbol, targetId);
  }

  function addPanelToGrid(id, type, symbol, targetId, position) {
    panelsMeta[id] = { type, symbol, targetId };
    const el = createPanelElement(type, id, symbol, targetId);
    grid.addWidget(el, position);
  }

  // Izgaradaki TUM panelleri (WS baglantilari dahil) temizler; sahne
  // degistirirken veya yeni bos sahne acarken kullanilir.
  function clearGridPanels() {
    Object.keys(panelInstances).forEach((id) => panelInstances[id]?.destroy?.());
    Object.keys(panelInstances).forEach((id) => delete panelInstances[id]);
    Object.keys(panelsMeta).forEach((id) => delete panelsMeta[id]);
    grid.removeAll();
  }

  // Verilen sahne verisini (layout+meta) izgaraya yukler. GridStack'in
  // gercek callback imzasi: (parent, w, add) => HTMLElement | undefined.
  function loadSceneIntoGrid(scene) {
    if (!scene || !Array.isArray(scene.layout) || scene.layout.length === 0) return;
    const meta = scene.meta || {};
    grid.load(scene.layout, (parentEl, w, add) => {
      if (add) {
        const panelMeta = meta[w.id] || { type: "chart", symbol: "BTCUSDT", targetId: DEFAULT_TARGET_ID };
        const targetId = panelMeta.targetId || DEFAULT_TARGET_ID;
        panelsMeta[w.id] = { type: panelMeta.type, symbol: panelMeta.symbol, targetId, interval: panelMeta.interval, checked: panelMeta.checked };
        return createPanelElement(panelMeta.type, w.id, panelMeta.symbol, targetId);
      }
      panelInstances[w.id]?.destroy?.();
      delete panelInstances[w.id];
      delete panelsMeta[w.id];
      return undefined;
    });
  }

  function createDefaultLayout() {
    addPanelToGrid("panel-watchlist-default", "watchlist", null, DEFAULT_TARGET_ID,
      { id: "panel-watchlist-default", x: 0, y: 0, w: 3, h: 8 });
    addPanelToGrid("panel-chart-default", "chart", "BTCUSDT", DEFAULT_TARGET_ID,
      { id: "panel-chart-default", x: 3, y: 0, w: 6, h: 8 });
    addPanelToGrid("panel-orderbook-default", "orderbook", "BTCUSDT", DEFAULT_TARGET_ID,
      { id: "panel-orderbook-default", x: 9, y: 0, w: 3, h: 8 });
    addPanelToGrid("panel-scanner-default", "mscanner", null, DEFAULT_TARGET_ID,
      { id: "panel-scanner-default", x: 0, y: 8, w: 9, h: 8 });
    addPanelToGrid("panel-lspos-default", "lspos", "BTCUSDT", DEFAULT_TARGET_ID,
      { id: "panel-lspos-default", x: 9, y: 8, w: 3, h: 8 });
  }

  function renderSceneSelect() {
    const select = document.getElementById("scene-select");
    select.innerHTML = "";
    scenesStore.scenes.forEach((scene) => {
      const opt = document.createElement("option");
      opt.value = scene.id;
      opt.textContent = scene.name;
      if (scene.id === scenesStore.activeSceneId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function switchToScene(sceneId) {
    const scene = findScene(sceneId);
    if (!scene) return;
    scenesStore.activeSceneId = sceneId;
    persistScenesStore();
    clearGridPanels();
    loadSceneIntoGrid(scene);
    renderSceneSelect();
  }

  function createNewScene() {
    const name = window.prompt("Yeni sahne adı:", `Sahne ${scenesStore.scenes.length + 1}`);
    if (!name || !name.trim()) return;
    const scene = { id: makeSceneId(), name: name.trim(), layout: [], meta: {} };
    scenesStore.scenes.push(scene);
    scenesStore.activeSceneId = scene.id;
    persistScenesStore();
    clearGridPanels(); // yeni sahne bos baslar; kullanici "Panel Ekle" ile doldurur
    renderSceneSelect();
  }

  function deleteActiveScene() {
    const scene = findScene(scenesStore.activeSceneId);
    if (!scene) return;
    if (!window.confirm(`"${scene.name}" sahnesini silmek istediğinize emin misiniz?`)) return;

    scenesStore.scenes = scenesStore.scenes.filter((s) => s.id !== scene.id);
    if (scenesStore.scenes.length === 0) {
      const fresh = { id: makeSceneId(), name: "Varsayılan Sahne", layout: [], meta: {} };
      scenesStore.scenes.push(fresh);
      scenesStore.activeSceneId = fresh.id;
      persistScenesStore();
      clearGridPanels();
      createDefaultLayout();
    } else {
      scenesStore.activeSceneId = scenesStore.scenes[0].id;
      persistScenesStore();
      clearGridPanels();
      loadSceneIntoGrid(findScene(scenesStore.activeSceneId));
    }
    renderSceneSelect();
  }

  function flashSceneSaveFeedback() {
    const btn = document.getElementById("scene-save-btn");
    const original = btn.textContent;
    btn.textContent = "Kaydedildi ✓";
    setTimeout(() => { btn.textContent = original; }, 1200);
  }

  // --- Ilk kurulum: eski (sahne oncesi) duz localStorage duzeni varsa
  // ilk sahneye tasi; hic veri yoksa varsayilan 3 panelli sahneyi olustur.
  (async function initScenes() {
    await loadWatchlistStore();
    await loadMarketEngine();
    initAllMarketHub();
    initMarketScanner();

    scenesStore = await loadScenesStore();

    if (scenesStore.scenes.length === 0) {
      let migratedLayout = null;
      let migratedMeta = null;
      try {
        const oldRaw = localStorage.getItem(STORAGE_KEY);
        if (oldRaw) {
          const old = JSON.parse(oldRaw);
          if (old && Array.isArray(old.layout) && old.layout.length) {
            migratedLayout = old.layout;
            migratedMeta = old.meta || {};
          }
        }
      } catch { /* eski veri okunamadi, onemli degil */ }

      const scene = {
        id: makeSceneId(),
        name: "Varsayılan Sahne",
        layout: migratedLayout || [],
        meta: migratedMeta || {},
      };
      scenesStore.scenes.push(scene);
      scenesStore.activeSceneId = scene.id;
      persistScenesStore();
      localStorage.removeItem(STORAGE_KEY); // artik IndexedDB'deki sahne sistemi icinde
    }

    const activeScene = findScene(scenesStore.activeSceneId) || scenesStore.scenes[0];
    scenesStore.activeSceneId = activeScene.id;

    if (activeScene.layout && activeScene.layout.length > 0) {
      loadSceneIntoGrid(activeScene);
    } else {
      createDefaultLayout();
      saveLayout();
    }
    renderSceneSelect();
  })();

  initStickyBar();
  initAlertManager();

  document.getElementById("scene-select").addEventListener("change", (e) => {
    switchToScene(e.target.value);
  });
  document.getElementById("scene-save-btn").addEventListener("click", () => {
    saveLayout();
    flashSceneSaveFeedback();
  });
  document.getElementById("scene-new-btn").addEventListener("click", createNewScene);
  document.getElementById("scene-delete-btn").addEventListener("click", deleteActiveScene);

  // =====================================================================
  // "Panel Ekle" - dropdown menu
  // =====================================================================
  const PANEL_TYPE_OPTIONS = [
    { type: "mscanner", icon: "📊", name: "300+ Market Scanner", desc: "Tüm USDT-M perpetual: FR, 24s %, hacim — arama/sıralama/filtre", needsSymbol: false, size: { w: 12, h: 8 } },
    { type: "watchlist", icon: "👁", name: "İzleme Listesi", desc: "Sembol, fiyat, 24s %, hacim, FR ve açık pozisyon", needsSymbol: false, size: { w: 3, h: 8 } },
    { type: "chart", icon: "📈", name: "Grafik Paneli", desc: "TradingView Lightweight Charts (zaman dilimi + Target ID)", needsSymbol: true, size: { w: 6, h: 8 } },
    { type: "orderbook", icon: "📖", name: "Canlı Emir Defteri", desc: "Gruplu derinlik, duvar ve 3sn B/S dengesi", needsSymbol: true, size: { w: 3, h: 8 } },
    { type: "lspos", icon: "⚖", name: "Long/Short Pozisyon", desc: "Hesap oranı, top trader pozisyon, taker exposure — Target ID", needsSymbol: true, size: { w: 3, h: 8 } },
    { type: "heatmap", icon: "🗺️", name: "Likidite Isı Haritası", desc: "Canvas tabanlı derinlik yoğunluk matrisi", needsSymbol: true, size: { w: 6, h: 6 } },
    { type: "bot", icon: "🤖", name: "Bot Paneli", desc: "Strateji kontrolü ve Paper Trading kayıtları", needsSymbol: true, size: { w: 4, h: 10 } },
    { type: "frscan", icon: "🚨", name: "Ekstrem FR & OI Tarayıcı", desc: "Ekstrem fonlama oranları ve OI uyumsuzlukları", needsSymbol: false, size: { w: 4, h: 8 } },
    { type: "checklist", icon: "📋", name: "İşlem Öncesi Kontrol Listesi", desc: "Disiplin ve onay checkbox widget'ı", needsSymbol: true, size: { w: 3, h: 7 } },
    { type: "volradar", icon: "📡", name: "Hacim Sıçrama Radarı", desc: "Ortalamanın 3x-5x üzerine çıkan ani hacim patlamaları", needsSymbol: false, size: { w: 4, h: 8 } },
  ];

  const addPanelBtn = document.getElementById("add-panel-btn");
  const panelTypeMenu = document.getElementById("panel-type-menu");

  PANEL_TYPE_OPTIONS.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "panel-type-item";
    btn.innerHTML = `
      <span class="pt-icon">${opt.icon}</span>
      <span>
        <div class="pt-name">${opt.name}</div>
        <div class="pt-desc">${opt.desc}</div>
      </span>`;
    btn.addEventListener("click", () => {
      closePanelTypeMenu();
      addPanelFromMenu(opt);
    });
    panelTypeMenu.appendChild(btn);
  });

  function openPanelTypeMenu() { panelTypeMenu.classList.add("open"); }
  function closePanelTypeMenu() { panelTypeMenu.classList.remove("open"); }

  addPanelBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    panelTypeMenu.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!panelTypeMenu.contains(e.target) && e.target !== addPanelBtn) closePanelTypeMenu();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanelTypeMenu(); });

  function addPanelFromMenu(opt) {
    let symbol = null;
    if (opt.needsSymbol) {
      const symbolInput = window.prompt(`${opt.name} için sembol girin (örn. ETHUSDT):`, "ETHUSDT");
      if (!symbolInput) return;
      symbol = symbolInput.trim().toUpperCase();
      if (!/^[A-Z0-9]{5,15}$/.test(symbol)) {
        window.alert("Geçersiz sembol. Örnek: ETHUSDT, SOLUSDT");
        return;
      }
    }
    // GridStack izgarasina yeni widget olarak ekler: addPanelToGrid ->
    // createPanelElement, secilen panel tipine ait HTML + WS/REST
    // dinleyicilerini olusturur; buildPanelShell de basliga Target ID
    // secici, tam ekran ve kapatma butonlarini otomatik bagliyor. Panel
    // tipi/sembol/target, panelsMeta uzerinden Sahne Yoneticisi'nin
    // localStorage (IndexedDB) kaydina otomatik dahil olur.
    const id = "panel-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
    addPanelToGrid(id, opt.type, symbol, DEFAULT_TARGET_ID, { id, ...opt.size });
    saveLayout();
  }
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(err => {
        console.warn("PWA service worker kaydedilemedi:", err);
      });
    });
  }
</script>
