<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0e14" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Crypto Dashboard" />
<title>Kripto Dashboard</title>

<!-- Grafik kütüphanesi -->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<!-- Grid / drag-drop / resize kütüphanesi (react-grid-layout'un vanilla JS karsiligi) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css" />
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack-all.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel-header: #141a26;
    --border: #1e2634;
    --text-primary: #e6eaf2;
    --text-secondary: #7c8699;
    --accent: #e8a33d;
    --up: #26a69a;
    --down: #ef5350;
    --dot-live: #3ddc84;
    --target-1: #e8a33d;
    --target-2: #26a69a;
    --target-3: #7c8aff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    overflow: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* ---------- Ust toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #toolbar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
  #toolbar .sub { font-size: 11px; color: var(--text-secondary); margin-left: 10px; font-family: 'IBM Plex Mono', monospace; }
  #toolbar-right { display: flex; align-items: center; gap: 8px; }

  #add-panel-btn, #sticky-show-btn {
    background: var(--accent);
    color: #1a1305;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  #add-panel-btn:hover, #sticky-show-btn:hover { filter: brightness(1.1); }
  #sticky-show-btn {
    display: none;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  #sticky-show-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }

  /* ---------- Sahne cubugu (Scene Bar) ---------- */
  #scene-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #scene-bar label { font-size: 11px; color: var(--text-secondary); }
  #scene-select {
    background: var(--panel);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    min-width: 180px;
  }
  .scene-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .scene-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  .scene-btn.primary { background: var(--accent); color: #1a1305; border-color: var(--accent); }
  .scene-btn.primary:hover { filter: brightness(1.1); color: #1a1305; }
  .scene-btn.danger:hover { background: rgba(239,83,80,0.18); color: var(--down); border-color: var(--down); }

  /* ---------- Sticky bar ---------- */
  #sticky-bar {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 9px 18px;
    background: var(--panel-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sticky-symbol { font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .sticky-metric { display: flex; flex-direction: column; gap: 2px; }
  .sticky-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
  .sticky-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
    display: inline-block;
  }

  /* ---------- Deger degisince yesil/kirmizi kisa parlama ---------- */
  @keyframes flashUp { 0% { background: rgba(38,166,154,0.45); } 100% { background: transparent; } }
  @keyframes flashDown { 0% { background: rgba(239,83,80,0.45); } 100% { background: transparent; } }
  .flash-up { animation: flashUp 0.8s ease-out; }
  .flash-down { animation: flashDown 0.8s ease-out; }

  /* ---------- Grid alani ---------- */
  #grid-wrapper { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
  .grid-stack { background: transparent; }

  /* ---------- Panel govdesi ---------- */
  .grid-stack-item-content.panel {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    inset: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 6px 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--panel-header);
  }

  .drag-handle {
    cursor: grab;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 2px 6px;
    line-height: 1;
    user-select: none;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .drag-handle:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
  .drag-handle:active { cursor: grabbing; }

  .target-indicator {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 4px currentColor;
  }

  .panel-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .target-group { display: flex; gap: 3px; flex-shrink: 0; }
  .target-btn {
    width: 20px; height: 20px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .target-btn:hover { border-color: var(--text-secondary); }
  .target-btn.active-1 { background: var(--target-1); color: #1a1305; border-color: var(--target-1); }
  .target-btn.active-2 { background: var(--target-2); color: #04211d; border-color: var(--target-2); }
  .target-btn.active-3 { background: var(--target-3); color: #0d0f2b; border-color: var(--target-3); }

  .panel-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    width: 24px; height: 24px;
    border-radius: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .panel-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
  .panel-btn.close-btn:hover { background: rgba(239,83,80,0.18); color: var(--down); }

  .panel-body { flex: 1; min-height: 0; position: relative; }

  /* ---------- Maksimize modu ---------- */
  .grid-stack-item.maximized {
    position: fixed !important;
    top: 14px !important; left: 14px !important; right: 14px !important; bottom: 14px !important;
    width: auto !important; height: auto !important;
    z-index: 1000;
    transform: none !important;
  }

  #maximize-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 999; }
  #maximize-backdrop.visible { display: block; }

  /* ---------- Watchlist paneli (tablo) ---------- */
  .watchlist-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .wl-col-toggles {
    display: flex; gap: 4px; padding: 5px 8px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: var(--panel-header);
  }
  .wl-col-toggle-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 2px 8px; font-size: 9px; font-weight: 600;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .wl-col-toggle-btn.active { border-color: var(--accent); color: var(--accent); }
  .wl-table-wrap { flex: 1; min-height: 0; overflow: auto; }
  .wl-table {
    width: 100%; min-width: 0; border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  }
  .wl-table th {
    position: sticky; top: 0; background: var(--panel-header);
    text-align: right; font-size: 9px; color: var(--text-secondary); font-weight: 600;
    padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .wl-table td {
    text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border);
    color: var(--text-primary); white-space: nowrap;
  }
  .wl-table th.col-symbol, .wl-table td.col-symbol { text-align: left; }
  .wl-table tbody tr { cursor: pointer; transition: background 0.15s ease; }
  .wl-table tbody tr:last-child td { border-bottom: none; }
  .wl-table tbody tr:hover { background: rgba(255,255,255,0.04); }
  .wl-symbol { font-weight: 600; }
  .wl-table.hide-fr .col-fr, .wl-table.hide-oi .col-oi,
  .wl-table.hide-chg .col-chg, .wl-table.hide-vol .col-vol { display: none; }
  .wl-warn-icon { font-size: 11px; cursor: help; }
  .wl-add-bar {
    display: flex; gap: 6px; padding: 6px 8px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: var(--panel-header);
    align-items: center;
  }
  .wl-add-input {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 8px; font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .wl-add-input:focus { outline: none; border-color: var(--accent); }
  .wl-add-input::placeholder { color: var(--text-secondary); }
  .wl-add-btn {
    background: var(--accent); color: #1a1305; border: none;
    border-radius: 4px; padding: 5px 10px; font-size: 11px; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
  }
  .wl-add-btn:hover { filter: brightness(1.1); }
  .wl-add-btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  .wl-add-status {
    font-size: 10px; padding: 0 8px 6px; flex-shrink: 0;
    min-height: 14px; font-family: 'IBM Plex Sans', sans-serif;
  }
  .wl-add-status.error { color: var(--down); }
  .wl-add-status.ok { color: var(--up); }
  .wl-remove-btn {
    background: transparent; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 13px; padding: 0; border-radius: 4px;
    width: 20px; height: 20px; line-height: 1;
  }
  .wl-remove-btn:hover { color: var(--down); background: rgba(239,83,80,0.18); }
  .wl-table th.col-action, .wl-table td.col-action {
    width: 28px; text-align: center; padding-left: 4px; padding-right: 6px;
  }
  .wl-empty { color: var(--text-secondary); font-size: 11px; text-align: center; padding: 18px 10px; }

  /* ---------- 300+ Market Scanner ---------- */
  .ms-toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: var(--panel-header);
    align-items: center;
  }
  .ms-search {
    flex: 1; min-width: 110px;
    background: var(--panel); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  }
  .ms-search:focus { outline: none; border-color: var(--accent); }
  .ms-filter-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 4px 8px; font-size: 10px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .ms-filter-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  .ms-filter-btn.active { border-color: var(--accent); color: var(--accent); }
  .ms-filter-btn.danger.active { border-color: var(--down); color: var(--down); }
  .ms-count { font-size: 10px; color: var(--text-secondary); font-family: 'IBM Plex Mono', monospace; margin-left: auto; }
  .ms-hint { font-size: 9px; color: var(--text-secondary); padding: 0 8px 4px; flex-shrink: 0; }
  .ms-table th.sortable { cursor: pointer; user-select: none; }
  .ms-table th.sortable:hover { color: var(--text-primary); }
  .ms-table tr.ms-hot { background: rgba(239,83,80,0.08); }
  .ms-table tr.ms-vol { background: rgba(232,163,61,0.08); }
  .ms-table tr.ms-spike { background: rgba(232,163,61,0.12); }
  .ms-table tr.ms-squeeze { background: rgba(239,83,80,0.16); }
  .ms-table tr.ms-engulf { background: rgba(38,166,154,0.12); }
  .ms-tag {
    display: inline-block; font-size: 8px; font-weight: 700; margin-left: 5px;
    padding: 1px 5px; border-radius: 4px; vertical-align: middle; white-space: nowrap;
  }
  .ms-tag.spike { color: #1a1305; background: var(--accent); }
  .ms-tag.squeeze { color: #fff; background: var(--down); }
  .ms-tag.engulf { color: #04110f; background: var(--up); }
  .ms-tag.div { color: #1a1305; background: #c9a227; }
  .ms-table tr.ms-div { background: rgba(201,162,39,0.14); }
  .ms-div-tf-bar { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 8px 6px; flex-shrink: 0; }
  .ms-div-tf-btn {
    background: var(--panel-header); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 2px 6px; font-size: 9px; font-weight: 600; cursor: pointer;
  }
  .ms-div-tf-btn.active { background: #c9a227; color: #1a1305; border-color: #c9a227; }
  .ms-fr-up { color: var(--up); }
  .ms-fr-down { color: var(--down); }
  .toast.toast-siren { border-color: var(--down); border-left-color: var(--down); }
  .toast.toast-vol { border-color: var(--accent); border-left-color: var(--accent); }
  .alert-history-row.clickable { cursor: pointer; }
  .alert-history-row.clickable:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }

  /* ---------- Grafik paneli ---------- */
  .chart-container { position: absolute; inset: 0; }
  .chart-init-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--text-secondary); font-size: 12px; font-family: 'IBM Plex Mono', monospace;
  }
  .chart-price-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-secondary); }

  .chart-tf-bar {
    display: flex; gap: 4px; padding: 5px 8px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    background: var(--panel-header);
  }
  .chart-tf-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 3px 8px; font-size: 10px;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .chart-tf-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  .chart-tf-btn.active { background: var(--accent); color: #1a1305; border-color: var(--accent); font-weight: 600; }

  /* ---------- Cizim (Drawing) araç çubuğu ve katmanı ---------- */
  .draw-toolbar {
    position: absolute; top: 8px; left: 8px; z-index: 5;
    display: flex; flex-direction: column; gap: 3px;
    background: rgba(16,21,31,0.92); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px; backdrop-filter: blur(2px);
  }
  .draw-tool-btn {
    width: 28px; height: 24px; background: transparent; border: 1px solid transparent;
    color: var(--text-secondary); border-radius: 4px; font-size: 9px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  }
  .draw-tool-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
  .draw-tool-btn.active { background: var(--accent); color: #1a1305; }
  .draw-tool-btn.draw-tool-long { color: var(--up); }
  .draw-tool-btn.draw-tool-short { color: var(--down); }
  .draw-tool-btn.draw-tool-long.active { background: var(--up); color: #04211d; }
  .draw-tool-btn.draw-tool-short.active { background: var(--down); color: #2b0a08; }
  .draw-toolbar hr { width: 100%; border: none; border-top: 1px solid var(--border); margin: 2px 0; }

  .draw-canvas { position: absolute; inset: 0; z-index: 2; }

  .draw-mini-toolbar {
    position: absolute; z-index: 6; display: none;
    align-items: center; gap: 4px; padding: 4px 6px;
    background: var(--panel-header); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .draw-mini-toolbar.visible { display: flex; }
  .draw-color-swatch { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .draw-color-swatch.selected { border-color: var(--text-primary); }
  .draw-mini-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 2px 7px; font-size: 10px; cursor: pointer;
  }
  .draw-mini-btn:hover { color: var(--text-primary); }
  .draw-mini-btn.danger:hover { color: var(--down); border-color: var(--down); }

  /* ---------- Emir defteri (Order Book) paneli ---------- */
  .ob-body {
    display: flex; flex-direction: column; height: 100%; overflow: hidden;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  }
  .ob-header-row {
    display: flex; justify-content: space-between; gap: 6px;
    padding: 5px 10px; color: var(--text-secondary); font-size: 10px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ob-header-row span:nth-child(2), .ob-header-row span:nth-child(3) { text-align: right; }
  .ob-asks, .ob-bids { display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 0; }
  .ob-row {
    position: relative;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 2.5px 10px;
  }
  .ob-row .ob-bar { position: absolute; top: 0; right: 0; bottom: 0; }
  .ob-row.ask .ob-bar { background: rgba(239,83,80,0.16); }
  .ob-row.bid .ob-bar { background: rgba(38,166,154,0.16); }
  .ob-price, .ob-qty, .ob-cum { position: relative; z-index: 1; }
  .ob-price { flex: 1; }
  .ob-price.ask { color: var(--down); }
  .ob-price.bid { color: var(--up); }
  .ob-qty { color: var(--text-secondary); min-width: 52px; text-align: right; }
  .ob-spread {
    text-align: center; padding: 4px; color: var(--text-secondary); font-size: 10px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    flex-shrink: 0; background: var(--panel-header);
  }
  .ob-ls {
    flex-shrink: 0; padding: 7px 10px 8px;
    border-bottom: 1px solid var(--border); background: var(--panel-header);
  }
  .ob-ls-track {
    height: 6px; border-radius: 99px; overflow: hidden;
    display: flex; background: var(--down);
  }
  .ob-ls-long { height: 100%; background: var(--up); width: 50%; }
  .ob-ls-labels {
    display: flex; justify-content: space-between; margin-top: 5px;
    font-size: 10px; font-weight: 600;
  }
  .ob-ls-labels .long { color: var(--up); }
  .ob-ls-labels .short { color: var(--down); }
  .ob-group-bar {
    display: flex; flex-wrap: wrap; gap: 3px; padding: 5px 8px 4px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ob-group-btn {
    background: var(--panel-header); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 4px; padding: 2px 6px; font-size: 9px; font-weight: 600; cursor: pointer;
  }
  .ob-group-btn.active { background: var(--accent); color: #1a1305; border-color: var(--accent); }
  .ob-row.ob-wall .ob-bar { background: rgba(232,163,61,0.28); }
  .ob-row.ob-wall .ob-qty { color: var(--accent); font-weight: 700; }
  .ob-cum { color: var(--text-secondary); font-size: 10px; min-width: 52px; text-align: right; }

  .ls-body {
    display: flex; flex-direction: column; height: 100%; overflow: auto;
    padding: 8px; gap: 8px;
  }
  .ls-period { display: flex; gap: 4px; flex-shrink: 0; }
  .ls-card {
    background: var(--panel-header); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
  }
  .ls-card-title {

  /* ---------- Toast bildirimleri ---------- */

  /* PWA / iPhone touch improvements */

<body>
<div id="app">
  <div id="toolbar">
    <div style="display:flex; align-items:baseline;">
      <h1>Kripto Dashboard</h1>
      <span class="sub">İzleme Listesi'nde bir sembole tıklayınca aynı Target ID'ye sahip paneller güncellenir</span>
    </div>
    <div id="toolbar-right">
      <button id="sticky-show-btn">Bilgi çubuğunu göster</button>
      <button id="alert-manager-btn">🔔 Alarmlar</button>
      <div id="add-panel-wrap">

        <div id="panel-type-menu"></div>

    </div>
  </div>

    <label for="scene-select">Sahne</label>
    <select id="scene-select"></select>
    <button class="scene-btn primary" id="scene-save-btn">Kaydet / Güncelle</button>
    <button class="scene-btn" id="scene-new-btn">+ Yeni Sahne</button>
    <button class="scene-btn danger" id="scene-delete-btn">Sil</button>
  </div>

  <div id="sticky-bar">
    <div class="target-group" id="sticky-target-slot"></div>
    <span class="target-indicator" id="sticky-indicator"></span>
    <span id="sticky-symbol">—</span>
    <div class="sticky-metric">
      <span class="sticky-label">Funding Rate</span>
      <span class="sticky-value" id="sticky-funding">—</span>
    </div>
    <div class="sticky-metric">
      <span class="sticky-label">Sonraki Fonlama</span>
      <span class="sticky-value" id="sticky-countdown" style="color:var(--text-secondary)">—</span>
    </div>
    <div class="sticky-metric">
      <span class="sticky-label">Open Interest</span>
      <span class="sticky-value" id="sticky-oi">—</span>
    </div>
    <button class="panel-btn close-btn" id="sticky-close-btn" style="margin-left:auto;" title="Bilgi çubuğunu kapat">✕</button>
  </div>

  <div id="grid-wrapper">
    <div class="grid-stack" id="dashboard-grid"></div>
  </div>
</div>

<div id="maximize-backdrop"></div>
<div id="toast-container"></div>

<script>
(function () {
  "use strict";

  // =====================================================================
  // Genel ayarlar / durum
  // =====================================================================
  const STORAGE_KEY = "crypto-dashboard-layout-v3";
  const STICKY_KEY = "crypto-dashboard-stickybar-v1";
  const DEFAULT_WATCHLIST_SYMBOLS = ["btcusdt", "ethusdt", "bnbusdt", "solusdt", "xrpusdt", "adausdt"];
  const WATCHLIST_KEY = "crypto-dashboard-watchlist-v1";
  const WATCHLIST_MAX = 30;
  let WATCHLIST_SYMBOLS = DEFAULT_WATCHLIST_SYMBOLS.slice();
  const TARGET_COLORS = { 1: "#e8a33d", 2: "#26a69a", 3: "#7c8aff" };
  const DEFAULT_TARGET_ID = 1;

  const panelsMeta = {};      // id -> { type: 'watchlist' | 'chart' | 'orderbook', symbol?, targetId }
  const panelInstances = {};  // id -> { destroy() }
  let maximizedPanelId = null;

  const backdrop = document.getElementById("maximize-backdrop");

  // =====================================================================
  // IndexedDB tabanli kalici depo (localStorage yerine)
  //
  // localStorage senkron ve ~5-10MB sinirli; IndexedDB asenkron ama cok
  // daha genis kapasiteli ve yapisal veriyi (JSON.stringify gerekmeden)
  // dogrudan saklayabiliyor. Asagidaki idbGet/idbSet, eski kodun geri
  // kalaninin degismeden calismasi icin basit bir anahtar-deger arayuzu
  // sunuyor. Ilk calistirmada, eger IndexedDB'de veri yoksa ama eski
  // localStorage'da varsa, otomatik olarak IndexedDB'ye tasinir (tek
  // seferlik gecis) - boylece daha once olusturulmus sahneler, alarmlar
  // ve cizimler kaybolmaz.
  // =====================================================================
  const IDB_NAME = "crypto-dashboard-db";
  const IDB_STORE = "kv";
  let idbOpenPromise = null;

  function openIdb() {
    if (idbOpenPromise) return idbOpenPromise;
    idbOpenPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("IndexedDB desteklenmiyor")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return idbOpenPromise;
  }

  async function idbGet(key) {
    try {
      const db = await openIdb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      console.error("[IndexedDB] Okuma hatasi, localStorage'a dusuluyor:", e);
      return null;
    }
  }

  async function idbSet(key, value) {
    try {
      const db = await openIdb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      console.error("[IndexedDB] Yazma hatasi:", e);
    }
  }

  // Bir anahtar icin: once IndexedDB'ye bak; yoksa eski localStorage
  // kaydini oku, IndexedDB'ye tasi, localStorage'daki eski kopyayi sil.
  async function loadWithMigration(key, isValid) {
    const fromIdb = await idbGet(key);
    if (fromIdb !== null && isValid(fromIdb)) return fromIdb;
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (isValid(parsed)) {
          await idbSet(key, parsed);
          localStorage.removeItem(key);
          return parsed;
        }
      }
    } catch { /* eski veri okunamadi, onemli degil */ }
    return null;
  }

  const watchlistBus = {
    listeners: new Set(),
    subscribe(cb) { this.listeners.add(cb); },
    unsubscribe(cb) { this.listeners.delete(cb); },
    notify() { this.listeners.forEach((cb) => { try { cb(); } catch (e) { /* dinleyici hatasi listeyi durdurmasin */ } }); },
  };

  function persistWatchlist() {
    idbSet(WATCHLIST_KEY, WATCHLIST_SYMBOLS);
  }

  async function loadWatchlistStore() {
    const migrated = await loadWithMigration(WATCHLIST_KEY, (v) => Array.isArray(v) && v.every((s) => typeof s === "string"));
    if (migrated) {
      WATCHLIST_SYMBOLS = migrated.map((s) => String(s).toLowerCase());
    }
  }

  function formatWatchlistLabel(sym) {
    const u = String(sym).toUpperCase();
    if (u.endsWith("USDT")) return u.slice(0, -4) + "/USDT";
    if (u.endsWith("USDC")) return u.slice(0, -4) + "/USDC";
    return u;
  }

  function parseWatchlistSymbol(raw) {
    if (!raw) return null;
    let s = String(raw).trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!s) return null;
    if (!/(USDT|USDC)$/.test(s)) s += "USDT";
    if (!/^[A-Z0-9]{5,20}$/.test(s)) return null;
    return s.toLowerCase();
  }

  function futuresKlinesUrl(symbol, interval, limit) {
    return "https://fapi.binance.com/fapi/v1/klines?symbol=" + encodeURIComponent(symbol) + "&interval=" + encodeURIComponent(interval) + "&limit=" + limit;
  }
  function futuresKlineWsUrl(symbol, interval) {
    return "wss://fstream.binance.com/ws/" + String(symbol).toLowerCase() + "@kline_" + interval;
  }
  function futuresOiHistUrl(symbol, period, limit) {
    return "https://fapi.binance.com/futures/data/openInterestHist?symbol=" + encodeURIComponent(symbol)
      + "&period=" + encodeURIComponent(period) + "&limit=" + limit;
  }
  function emitTarget(targetId, symbol, meta) {
    targetBus.emit(targetId, symbol, meta || {});
  }

  function priceFractionDigits(p) {
    const abs = Math.abs(Number(p));
    if (!isFinite(abs) || abs === 0) return 2;
    if (abs >= 100) return 2;
    if (abs >= 10) return 3;
    if (abs >= 1) return 4;
    const extra = Math.ceil(-Math.log10(abs));
    return Math.max(4, Math.min(8, extra + 4));
  }

  function formatPrice(p) {
    if (p == null || !isFinite(p)) return "—";
    const d = priceFractionDigits(p);
    return Number(p).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: d,
    });
  }

  async function validateFuturesSymbol(symUpper) {
    try {
      const res = await fetch(`https://fapi.binance.com/fapi/v1/ticker/price?symbol=${symUpper}`);
      if (!res.ok) return false;
      const data = await res.json();
      return !!(data && data.symbol === symUpper && data.price);
    } catch {
      return false;
    }
  }

  async function addWatchlistSymbol(raw) {
    const sym = parseWatchlistSymbol(raw);
    if (!sym) return { ok: false, error: "Geçersiz sembol. Örnek: ETH veya SOLUSDT" };
    if (WATCHLIST_SYMBOLS.includes(sym)) return { ok: false, error: "Bu sembol zaten listede." };
    if (WATCHLIST_SYMBOLS.length >= WATCHLIST_MAX) return { ok: false, error: `En fazla ${WATCHLIST_MAX} sembol eklenebilir.` };
    const valid = await validateFuturesSymbol(sym.toUpperCase());
    if (!valid) return { ok: false, error: `${sym.toUpperCase()} Binance Futures'ta bulunamadı.` };
    WATCHLIST_SYMBOLS = WATCHLIST_SYMBOLS.concat(sym);
    persistWatchlist();
    watchlistBus.notify();
    return { ok: true, symbol: sym };
  }

  function removeWatchlistSymbol(sym) {
    const key = String(sym).toLowerCase();
    if (!WATCHLIST_SYMBOLS.includes(key)) return false;
    WATCHLIST_SYMBOLS = WATCHLIST_SYMBOLS.filter((s) => s !== key);
    persistWatchlist();
    watchlistBus.notify();
    return true;
  }

  const grid = GridStack.init({
    column: 12,
    cellHeight: 58,
    margin: 8,
    float: true,
    handle: ".drag-handle",
    animate: true,
  }, "#dashboard-grid");

  // =====================================================================
  // Target bus: Watchlist -> ayni Target ID'deki Grafik/Emir Defteri/
  // Sticky Bar hedeflerine yayin
  // =====================================================================
  const targetBus = {
    listeners: {}, // targetId -> Map(subscriberId -> callback)
    subscribe(targetId, subscriberId, cb) {
      if (!this.listeners[targetId]) this.listeners[targetId] = new Map();
      this.listeners[targetId].set(subscriberId, cb);
    },
    unsubscribe(targetId, subscriberId) {
      this.listeners[targetId]?.delete(subscriberId);
    },
    emit(targetId, symbol, meta) {
      const m = meta && typeof meta === "object" ? meta : {};
      this.listeners[targetId]?.forEach((cb) => {
        try { cb(symbol, m); } catch (e) { /* dinleyici hatasi */ }
      });
    },
  };

  // Deger degisince kisa yesil/kirmizi parlama efekti
  function flashValue(el, isUp) {
    el.classList.remove("flash-up", "flash-down");
    void el.offsetWidth; // reflow - animasyonu yeniden baslatmak icin
    el.classList.add(isUp ? "flash-up" : "flash-down");
  }

  // Target 1/2/3 buton grubunu olusturur; hem panel basliklarinda hem
  // Sticky Bar'da ayni mantikla kullanilir.
  function createTargetButtonGroup(initialTargetId, indicatorEl, onChange) {
    const wrap = document.createElement("div");
    wrap.className = "target-group";
    const buttons = [1, 2, 3].map((tId) => {
      const btn = document.createElement("button");
      btn.className = "target-btn" + (tId === initialTargetId ? ` active-${tId}` : "");
      btn.textContent = String(tId);
      btn.title = `Target ${tId}`;
      btn.dataset.target = String(tId);
      wrap.appendChild(btn);
      return btn;
    });
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const tId = Number(btn.dataset.target);
        buttons.forEach((b) => {
          b.className = "target-btn" + (Number(b.dataset.target) === tId ? ` active-${tId}` : "");
        });
        if (indicatorEl) {
          indicatorEl.style.background = TARGET_COLORS[tId];
          indicatorEl.style.color = TARGET_COLORS[tId];
          indicatorEl.title = `Target ${tId}`;
        }
        onChange(tId);
      });
    });
    return wrap;
  }

  // =====================================================================
  // Ortak panel govdesi (baslik + tutamac + target secici + butonlar)
  // =====================================================================
  function buildPanelShell(id, title, initialTargetId, onTargetChange, getAlertSymbol) {
    const item = document.createElement("div");
    item.className = "grid-stack-item";

    const content = document.createElement("div");
    content.className = "grid-stack-item-content panel";

    const header = document.createElement("div");
    header.className = "panel-header";

    const handle = document.createElement("span");
    handle.className = "drag-handle";
    handle.textContent = "≡";
    handle.title = "Sürüklemek için tutun";

    const indicator = document.createElement("span");
    indicator.className = "target-indicator";
    indicator.style.background = TARGET_COLORS[initialTargetId];
    indicator.style.color = TARGET_COLORS[initialTargetId];
    indicator.title = `Target ${initialTargetId}`;

    const titleEl = document.createElement("span");
    titleEl.className = "panel-title";
    titleEl.textContent = title;

    const targetGroup = createTargetButtonGroup(initialTargetId, indicator, onTargetChange);

    const bellBtn = document.createElement("button");
    bellBtn.className = "panel-btn";
    bellBtn.textContent = "🔔";
    bellBtn.title = "Alarm ekle";
    bellBtn.addEventListener("click", () => {
      const sym = (typeof getAlertSymbol === "function" ? getAlertSymbol() : getAlertSymbol) || "BTCUSDT";
      openAlertManager(sym);
    });

    const maxBtn = document.createElement("button");
    maxBtn.className = "panel-btn";
    maxBtn.textContent = "⤢";
    maxBtn.title = "Tam ekran";
    maxBtn.addEventListener("click", () => toggleMaximize(id));

    const closeBtn = document.createElement("button");
    closeBtn.className = "panel-btn close-btn";
    closeBtn.textContent = "✕";
    closeBtn.title = "Paneli kapat";
    closeBtn.addEventListener("click", () => closePanel(id));

    header.append(handle, indicator, titleEl, targetGroup, bellBtn, maxBtn, closeBtn);

    const body = document.createElement("div");
    body.className = "panel-body";

    content.append(header, body);
    item.appendChild(content);

    return { item, body, titleEl };
  }

  function toggleMaximize(id) {
    const item = grid.engine.nodes.find((n) => n.id === id)?.el;
    if (!item) return;

    if (maximizedPanelId === id) {
      item.classList.remove("maximized");
      backdrop.classList.remove("visible");
      grid.movable(item, true);
      grid.resizable(item, true);
      maximizedPanelId = null;
    } else {
      if (maximizedPanelId) toggleMaximize(maximizedPanelId);
      item.classList.add("maximized");
      backdrop.classList.add("visible");
      grid.movable(item, false);
      grid.resizable(item, false);
      maximizedPanelId = id;
    }
  }

  function closePanel(id) {
    const node = grid.engine.nodes.find((n) => n.id === id);
    if (!node) return;
    panelInstances[id]?.destroy?.();
    delete panelInstances[id];
    delete panelsMeta[id];
    if (maximizedPanelId === id) {
      backdrop.classList.remove("visible");
      maximizedPanelId = null;
    }
    grid.removeWidget(node.el);
    saveLayout();
  }

  // WATCHLIST PANELI

  function createWatchlistPanel(id, initialTargetId) {

    const { item, body } = buildPanelShell(id, "İzleme Listesi", targetId, (newId) => {
      targetId = newId;
      panelsMeta[id].targetId = newId;

    }, () => "BTCUSDT");

    const addBar = document.createElement("div");
    addBar.className = "wl-add-bar";

      <input class="wl-add-input" type="text" spellcheck="false" placeholder="Sembol ekle (ETH, SOLUSDT)" />
      <button class="wl-add-btn" type="button">Ekle</button>`;
    const addInput = addBar.querySelector(".wl-add-input");
    const addBtn = addBar.querySelector(".wl-add-btn");

    const wrap = document.createElement("div");

      <thead>
        <tr>
          <th class="col-symbol">Sembol</th>
          <th class="col-price">Fiyat</th>
          <th class="col-chg">24s %</th>
          <th class="col-vol">Hacim</th>
          <th class="col-fr">FR (Fonlama)</th>
          <th class="col-oi">OI (A.P.)</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody></tbody>`;
    wrap.appendChild(table);
    const tbody = table.querySelector("tbody");

    [["chg", "24s %"], ["vol", "Hacim"], ["fr", "FR"], ["oi", "OI"]].forEach(([col, label]) => {
      const btn = document.createElement("button");
      btn.className = "wl-col-toggle-btn active";
      btn.textContent = label;
      btn.title = `${label} sütununu göster/gizle`;
      btn.addEventListener("click", () => {
        const hidden = table.classList.toggle(`hide-${col}`);
        btn.classList.toggle("active", !hidden);
      });
      colBar.appendChild(btn);
    });

    body.appendChild(colBar);
    body.appendChild(addBar);
    body.appendChild(addStatus);
    body.appendChild(wrap);

    const state = {};
    const rows = {};

    function setAddStatus(text, kind) {
      addStatus.textContent = text || "";
      addStatus.className = "wl-add-status" + (kind ? " " + kind : "");
    }

    function formatCompactUsd(v) {
      if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
      if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
      if (v >= 1e3) return "$" + (v / 1e3).toFixed(1) + "K";
      return "$" + v.toFixed(0);
    }

    function renderOi(sym) {
      const s = state[sym];
      const row = rows[sym];
      if (!row) return;
      const m = allMarket.bySymbol[String(sym).toUpperCase()];
      const qty = (m && m.oiQty != null) ? m.oiQty : (s && s.oiQty);
      const px = (s && s.price != null) ? s.price : (m && m.price);
      if (qty == null || px == null || !isFinite(qty) || !isFinite(px)) return;
      if (s) s.oiQty = qty;
      row.oiCell.textContent = formatCompactUsd(qty * px);
    }

    function renderTickerExtras(sym) {
      const row = rows[sym];
      if (!row || !row.chgCell) return;
      const m = allMarket.bySymbol[String(sym).toUpperCase()];
      if (!m) return;
      if (m.changePct != null && isFinite(m.changePct)) {
        row.chgCell.textContent = (m.changePct >= 0 ? "+" : "") + m.changePct.toFixed(2) + "%";
        row.chgCell.style.color = m.changePct >= 0 ? "var(--up)" : "var(--down)";
      }
      if (m.quoteVol != null && isFinite(m.quoteVol)) {
        row.volCell.textContent = formatUsdCompact(m.quoteVol);
      }
      renderOi(sym);
    }
    function renderAllTickerExtras() {
      WATCHLIST_SYMBOLS.forEach(renderTickerExtras);
    }

    function renderScannerIcons() {
      WATCHLIST_SYMBOLS.forEach((sym) => {
        const entry = marketScanner.bySymbol[sym];
        const row = rows[sym];
        if (!entry || !row) return;
        const reasons = [];
        if (entry.extremeLevel > 0) reasons.push("Ekstrem FR");
        if (entry.oiDivergence) reasons.push("OI Diverjansı");
        row.warnIcon.textContent = reasons.length ? " ⚠️" : "";
        row.warnIcon.title = reasons.join(" + ");
      });
    }

    function rebuildRows() {
      tbody.innerHTML = "";
      Object.keys(rows).forEach((k) => delete rows[k]);
      Object.keys(state).forEach((k) => { if (!WATCHLIST_SYMBOLS.includes(k)) delete state[k]; });

      if (WATCHLIST_SYMBOLS.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="7" class="wl-empty">Liste boş. Yukarıdan bir sembol ekleyin.</td>`;
        tbody.appendChild(tr);
        return;
      }

      WATCHLIST_SYMBOLS.forEach((sym) => {
        const symbolUpper = sym.toUpperCase();
        if (!state[sym]) state[sym] = { price: null, fundingRate: null, oiQty: null };

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="col-symbol wl-symbol">${formatWatchlistLabel(sym)}<span class="wl-warn-icon"></span></td>
          <td class="col-price wl-price">—</td>
          <td class="col-chg wl-chg">—</td>
          <td class="col-vol wl-vol">—</td>
          <td class="col-fr wl-fr">—</td>
          <td class="col-oi wl-oi">—</td>
          <td class="col-action"><button class="wl-remove-btn" type="button" title="Listeden çıkar">✕</button></td>`;
        tr.addEventListener("click", () => {
          tr.style.background = "rgba(232,163,61,0.18)";
          setTimeout(() => { tr.style.background = ""; }, 250);
          targetBus.emit(targetId, symbolUpper);
        });
        tr.querySelector(".wl-remove-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          removeWatchlistSymbol(sym);
        });
        tbody.appendChild(tr);
        rows[sym] = {
          priceCell: tr.querySelector(".wl-price"),
          chgCell: tr.querySelector(".wl-chg"),
          volCell: tr.querySelector(".wl-vol"),
          frCell: tr.querySelector(".wl-fr"),
          oiCell: tr.querySelector(".wl-oi"),
          warnIcon: tr.querySelector(".wl-warn-icon"),
        };
        const s = state[sym];
        if (s.price !== null) {
          rows[sym].priceCell.textContent = formatPrice(s.price);
        }
        if (s.fundingRate !== null) {
          rows[sym].frCell.textContent = `%${s.fundingRate.toFixed(4)}`;
          rows[sym].frCell.style.color = s.fundingRate >= 0 ? "var(--up)" : "var(--down)";
        }
        renderOi(sym);
        renderTickerExtras(sym);
      });
      renderScannerIcons();
    }

    let priceWs = null;
    let priceRetryMs = 1000;
    let priceHeartbeat = null;
    let fundingWs = null;
    let fundingRetryMs = 1000;
    let fundingHeartbeat = null;
    let streamGen = 0;
    let stopped = false;

    function connectPrice(myGen) {
      if (stopped || myGen !== streamGen) return;
      if (!WATCHLIST_SYMBOLS.length) return;
      const streams = WATCHLIST_SYMBOLS.map((s) => `${s}@miniTicker`).join("/");
      priceWs = new WebSocket(`wss://fstream.binance.com/stream?streams=${streams}`);
      priceWs.onopen = () => { priceRetryMs = 1000; resetPriceHeartbeat(); };
      priceWs.onmessage = (event) => {
        resetPriceHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const d = msg.data;
        if (!d) return;
        const sym = d.s.toLowerCase();
        const s = state[sym];
        const row = rows[sym];
        if (!s || !row) return;
        const close = parseFloat(d.c);
        const prevPrice = s.price;
        s.price = close;
        row.priceCell.textContent = formatPrice(close);
        if (prevPrice !== null && close !== prevPrice) flashValue(row.priceCell, close >= prevPrice);
        renderOi(sym);
      };
      priceWs.onclose = () => { clearPriceHeartbeat(); if (!stopped && myGen === streamGen) schedulePriceReconnect(myGen); };
      priceWs.onerror = () => priceWs.close();
    }
    function resetPriceHeartbeat() { clearPriceHeartbeat(); priceHeartbeat = setTimeout(() => priceWs && priceWs.close(), 60000); }
    function clearPriceHeartbeat() { if (priceHeartbeat) { clearTimeout(priceHeartbeat); priceHeartbeat = null; } }
    function schedulePriceReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === streamGen) connectPrice(myGen); }, priceRetryMs);
      priceRetryMs = Math.min(priceRetryMs * 2, 30000);
    }

    function connectFunding(myGen) {
      if (stopped || myGen !== streamGen) return;
      if (!WATCHLIST_SYMBOLS.length) return;
      const streams = WATCHLIST_SYMBOLS.map((s) => `${s}@markPrice@1s`).join("/");
      fundingWs = new WebSocket(`wss://fstream.binance.com/market/stream?streams=${streams}`);
      fundingWs.onopen = () => { fundingRetryMs = 1000; resetFundingHeartbeat(); };
      fundingWs.onmessage = (event) => {
        resetFundingHeartbeat();
        let msg; try { msg = JSON.parse(event.data); } catch { return; }
        const d = msg.data;
        if (!d || d.r === undefined) return;
        const sym = d.s.toLowerCase();
        const s = state[sym];
        const row = rows[sym];
        if (!s || !row) return;
        const rate = parseFloat(d.r) * 100;
        const prevRate = s.fundingRate;
        s.fundingRate = rate;
        row.frCell.textContent = `%${rate.toFixed(4)}`;
        row.frCell.style.color = rate >= 0 ? "var(--up)" : "var(--down)";
        if (prevRate !== null && rate !== prevRate) flashValue(row.frCell, rate >= prevRate);
      };
      fundingWs.onclose = () => { clearFundingHeartbeat(); if (!stopped && myGen === streamGen) scheduleFundingReconnect(myGen); };
      fundingWs.onerror = () => fundingWs.close();
    }
    function resetFundingHeartbeat() { clearFundingHeartbeat(); fundingHeartbeat = setTimeout(() => fundingWs && fundingWs.close(), 60000); }
    function clearFundingHeartbeat() { if (fundingHeartbeat) { clearTimeout(fundingHeartbeat); fundingHeartbeat = null; } }
    function scheduleFundingReconnect(myGen) {
      setTimeout(() => { if (!stopped && myGen === streamGen) connectFunding(myGen); }, fundingRetryMs);
      fundingRetryMs = Math.min(fundingRetryMs * 2, 30000);
    }

    function reconnectWatchlistStreams() {
      streamGen++;
      const g = streamGen;
      priceRetryMs = 1000;
      fundingRetryMs = 1000;
      try { if (priceWs) priceWs.close(); } catch (e) { /* yoksay */ }
      try { if (fundingWs) fundingWs.close(); } catch (e) { /* yoksay */ }
      connectPrice(g);
      connectFunding(g);
    }

    async function submitAddSymbol() {
      const raw = addInput.value;
      addBtn.disabled = true;
      setAddStatus("Kontrol ediliyor…", "");
      const result = await addWatchlistSymbol(raw);
      addBtn.disabled = false;
      if (!result.ok) {
        setAddStatus(result.error, "error");
        return;
      }
      addInput.value = "";
      setAddStatus(`${result.symbol.toUpperCase()} eklendi`, "ok");
      setTimeout(() => { if (addStatus.classList.contains("ok")) setAddStatus("", ""); }, 1800);
    }

    addBtn.addEventListener("click", submitAddSymbol);
    addInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitAddSymbol();
      }
    });

    function onWatchlistChange() {
      rebuildRows();
      reconnectWatchlistStreams();
    }

    marketScanner.subscribe(renderScannerIcons);
    watchlistBus.subscribe(onWatchlistChange);
    allMarket.subscribe(renderAllTickerExtras);
    rebuildRows();
    reconnectWatchlistStreams();
    renderScannerIcons();
    renderAllTickerExtras();

    panelInstances[id] = {
      destroy() {
        stopped = true;
        streamGen++;
        clearPriceHeartbeat();
        clearFundingHeartbeat();
        if (priceWs) priceWs.close();
        if (fundingWs) fundingWs.close();
        marketScanner.unsubscribe(renderScannerIcons);
        watchlistBus.unsubscribe(onWatchlistChange);
        allMarket.unsubscribe(renderAllTickerExtras);
      },
    };

    return item;
  }
