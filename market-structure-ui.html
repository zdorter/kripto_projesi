<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Structure · Research UI</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222d;
      --border: #2a3544;
      --text: #e8edf4;
      --muted: #8b98a8;
      --accent: #5b9cf5;
      --warn: #e8b84a;
      --research: #9b87f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1rem 1.25rem 2rem;
    }
    h1 { font-size: 1.35rem; margin: 0; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0.15rem 0 0.75rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
    .toolbar label { color: var(--muted); }
    .toolbar select, .toolbar button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
    }
    .toolbar button { cursor: pointer; }
    #research-banner {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: rgba(91, 156, 245, 0.15);
      border: 1px solid rgba(91, 156, 245, 0.35);
      color: var(--accent);
    }
    .badge-research {
      background: rgba(155, 135, 245, 0.12);
      border-color: rgba(155, 135, 245, 0.4);
      color: var(--research);
    }
    .badge-warn {
      background: rgba(232, 184, 74, 0.12);
      border-color: rgba(232, 184, 74, 0.4);
      color: var(--warn);
    }
    #load-status, #evaluation-line { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.35rem; }
    #evaluation-line { font-family: ui-monospace, monospace; }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: start;
    }
    @media (min-width: 960px) {
      .layout { grid-template-columns: minmax(18rem, 1fr) minmax(22rem, 1.4fr); }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    .panel h3, .tf-card h3 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .panel h4, .tf-card h4 { margin: 0.5rem 0 0.25rem; font-size: 0.82rem; color: var(--muted); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    details { margin: 0.35rem 0; }
    summary { cursor: pointer; font-weight: 600; font-size: 0.88rem; }
    .subsection { padding: 0.35rem 0 0.5rem 0.35rem; font-size: 0.88rem; }
    ul { margin: 0.25rem 0; padding-left: 1.2rem; }
    .compact-list code { font-size: 0.72rem; color: var(--muted); }
    .eval-line { margin-top: 0.5rem; font-size: 0.78rem; }
    .nav-back {
      display: inline-block;
      margin-bottom: 0.65rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .nav-back:hover { text-decoration: underline; }
    .disclaimer {
      font-size: 0.85rem;
      color: var(--warn);
      border-left: 3px solid var(--warn);
      padding-left: 0.65rem;
      margin-bottom: 0.85rem;
    }
    #debug-detail {
      margin-top: 1rem;
      font-size: 0.78rem;
      font-family: ui-monospace, monospace;
    }
    #msl-chart-panel {
      margin-bottom: 1rem;
    }
    #msl-chart-wrap {
      position: relative;
      width: 100%;
      height: min(420px, 55vh);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    #msl-chart {
      width: 100%;
      height: 100%;
    }
    #msl-chart-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
      margin: 0.5rem 0;
      font-size: 0.82rem;
    }
    .chart-toolbar label { color: var(--muted); cursor: pointer; }
    #msl-chart-status, #msl-chart-tooltip {
      font-size: 0.78rem;
      font-family: ui-monospace, monospace;
      color: var(--muted);
    }
  </style>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <a class="nav-back" href="./wave-scanner.html">← Wave Scanner</a>
  <h1>MARKET STRUCTURE</h1>
  <p class="subtitle">Research / Descriptive · MSL-12 chart overlay (research only)</p>

  <p class="disclaimer">
    Observational co-occurrence only. Not a trading signal, entry, exit, or production rule.
  </p>

  <div class="toolbar">
    <label for="symbol-select">Symbol</label>
    <select id="symbol-select"></select>
    <label for="data-source">Data</label>
    <select id="data-source">
      <option value="LIVE" selected>LIVE</option>
      <option value="DEMO">DEMO</option>
    </select>
    <span class="muted">15M: NOT ESTABLISHED</span>
    <button type="button" id="msl-refresh">Refresh</button>
    <label class="muted" for="replay-relations-toggle">
      <input type="checkbox" id="replay-relations-toggle" />
      Show replay relations (debug)
    </label>
  </div>

  <div id="research-banner"></div>
  <div id="load-status">—</div>
  <div id="evaluation-line">Evaluation: —</div>

  <section class="panel" id="msl-chart-panel">
    <h3>Chart · MSL overlay</h3>
    <div class="chart-toolbar">
      <label for="chart-timeframe">Chart TF</label>
      <select id="chart-timeframe">
        <option value="1H" selected>1H</option>
        <option value="4H">4H</option>
        <option value="15M">15M</option>
      </select>
      <label><input type="checkbox" id="msl-vis-structure" checked /> Structure</label>
      <label><input type="checkbox" id="msl-vis-internal" /> Internal labels</label>
      <label><input type="checkbox" id="msl-vis-protected" checked /> Protected</label>
      <label><input type="checkbox" id="msl-vis-break" checked /> BOS / CHoCH</label>
      <label><input type="checkbox" id="msl-vis-liquidity" checked /> Liquidity</label>
      <label><input type="checkbox" id="msl-vis-events" /> Liquidity Events</label>
      <label><input type="checkbox" id="msl-vis-mss" /> MSS</label>
      <label><input type="checkbox" id="msl-vis-htf" /> HTF Context</label>
    </div>
    <div id="msl-chart-wrap">
      <div id="msl-chart"></div>
      <div id="msl-chart-overlay"></div>
    </div>
    <div id="msl-chart-status">—</div>
    <div id="msl-chart-tooltip"></div>
  </section>

  <div class="layout">
    <div id="msl-left-column"></div>
    <div id="msl-right-column"></div>
  </div>

  <details class="panel" id="debug-section">
    <summary>Research / Debug detail</summary>
    <div id="debug-detail"></div>
  </details>

  <script type="module" src="./dist/wave/market-structure-ui-app.js"></script>
</body>
</html>
